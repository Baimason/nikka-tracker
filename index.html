  function patternOf(p){ return p.pattern || inferPattern(p.parts||[]); }
  function patternExamples(id,n){ return PHRASES.filter(function(p){ return p.parts && patternOf(p)===id && wordReadable(p.jp); }).slice(0,n||3); }

  /* ---- desbloqueo: needs satisfechos Y al menos 1 ejemplo legible ---- */
  function patternUnlocked(pid){ var p=PATTERN_BY_ID[pid]; if(!p)return false; var pt=ensurePatterns();
    for(var i=0;i<p.needs.length;i++){ if(!(pt.box[p.needs[i]]>=1))return false; }
    return patternExamples(pid,1).length>0; }
  function nextPatternToTeach(){ var pt=ensurePatterns(), cand=PATTERNS.filter(function(p){ return !pt.seen[p.id] && patternUnlocked(p.id); }); cand.sort(function(a,b){return a.order-b.order;}); return cand.length?cand[0]:null; }
  function duePattern(){ var pt=ensurePatterns(), cand=PATTERNS.filter(function(p){ return pt.seen[p.id] && isPatternDue(p.id) && patternExamples(p.id,1).length; }); cand.sort(function(a,b){return a.order-b.order;}); return cand.length?cand[0]:null; }
  function anySeenPatternForDrill(){ var pt=ensurePatterns(), cand=PATTERNS.filter(function(p){ return pt.seen[p.id] && patternExamples(p.id,1).length; }); return cand.length?cand[Math.floor(Math.random()*cand.length)]:null; }

  /* ---- director: detour al inicio de cada pregunta de Frases ---- */
  var ptsess=null;
  function maybePattern(){
    if(!rsess || rsess.pool!==PHRASES) return false;
    var pt=ensurePatterns();
    // 0) ficha de segmentación: una sola vez, justo antes del primer patrón
    if(!pt.segSeen && nextPatternToTeach()){ launchSegCard(); return true; }
    // 1) repaso vencido
    var due=duePattern(); if(due){ launchPatternCloze(due.id,true); return true; }
    // 2) patrón nuevo desbloqueado -> teach card
    //    sólo si queda cupo diario Y no hay ya un patrón joven sin madurar (uno en vuelo)
    if(newPatternsToday()<NEW_PATTERNS_PER_DAY && youngPatternCount()<MAX_YOUNG_PATTERNS){
      var nu=nextPatternToTeach(); if(nu){ launchPatternTeach(nu.id); return true; }
    }
    // 3) patrón joven -> constructor guiado (afianza antes de reconocer)
    var bp=nextBuildPhrase();
    if(bp){ var mature=phraseReadyIdxMature(PHRASES).length>0;
      if(!mature || Math.random()<GUIDED_PROB){ launchGuidedBuild(bp); return true; } }
    // 4) refuerzo ocasional: cloze de un patrón ya visto
    if(Math.random()<PATTERN_DRILL_PROB){ var s=anySeenPatternForDrill(); if(s){ launchPatternCloze(s.id,false); return true; } }
    return false;
  }

  /* ---- TEACH CARD de patrón (absorbe la partícula nueva si la hay) ---- */
  function moldHTML(mold){ var out=''; for(var i=0;i<mold.length;i++){ var ch=mold.charAt(i);
      if(ch==='｛'){ var j=mold.indexOf('｝',i); var slot=mold.slice(i+1,j); out+='<span class="pt-slot">'+slot+'</span>'; i=j; }
      else { out+='<span class="pt-fix">'+ch+'</span>'; } }
    return out; }
  function launchPatternTeach(pid){ ptsess={mode:'teach',pid:pid,relearn:false}; renderPatternTeach(); readingEl.classList.remove('hidden'); }
  function ptHead(){ return '<div class="d-sticky"><div class="d-head"><div class="d-head-l"><button class="d-close" id="rClose">✕ '+t('Close')+'</button>'+gearBtn()+'</div></div>'+wordsGoalHTML()+'</div>'; }
  /* parte pronunciable del molde: las piezas fijas, sin los huecos ｛...｝ */
  function moldSpoken(mold){ var out=''; for(var i=0;i<mold.length;i++){ var ch=mold.charAt(i); if(ch==='｛'){ i=mold.indexOf('｝',i); } else if(ch==='／'){ } else out+=ch; } return out; }
  function spkBtn(say,small){ return '<button class="pt-spk'+(small?' sm':'')+'" data-say="'+say+'" aria-label="'+t('Play')+'">🔊</button>'; }
  function renderPatternTeach(){
    var p=PATTERN_BY_ID[ptsess.pid], pt=ensurePatterns();
    var newP=(p.intro||[]).filter(function(x){ return PARTICLES[x] && !pt.seen['_p_'+x]; });
    var ex=patternExamples(p.id,3), es=getLang()==='es';
    var h=ptHead();
    h+='<div class="pt-card">';
    h+='<div class="pt-kind">'+t('New pattern')+'</div>';
    if(newP.length){ var pc=newP[0], info=PARTICLES[pc];
      h+='<div class="pt-particle"><div class="pt-pg"><span class="pt-glyph mincho">'+pc+'</span><span class="pt-read">'+info.read+'</span>'+spkBtn(pc)+'</div><div class="pt-fn">'+info.fn+'</div></div>'; }
    h+='<div class="pt-mold-row"><div class="pt-mold mincho">'+moldHTML(p.mold)+'</div>'+spkBtn(moldSpoken(p.mold))+'</div>';
    h+='<div class="pt-gloss">'+p.gloss+'</div>';
    if(ex.length){ h+='<div class="pt-exlabel">'+t('Same mold, different fill:')+'</div><div class="pt-ex">';
      ex.forEach(function(e){ h+='<div class="pt-exrow">'+spkBtn(e.jp,true)+'<span class="pt-extext"><span class="mincho">'+phraseHilite(e)+'</span> <span class="pt-exmean">'+(es?e.es:e.en)+'</span></span></div>'; });
      h+='</div>'; }
    h+='</div><div class="d-actions"><button class="d-next" id="ptGot">'+t('Got it →')+'</button></div>';
    readingInner.innerHTML=h;
    var c=document.getElementById('rClose'); if(c)c.addEventListener('click',closeReading);
    var g=document.getElementById('ptGot'); if(g)g.addEventListener('click',patternTeachDone);
    readingInner.querySelectorAll('.pt-spk').forEach(function(b){ b.addEventListener('click',function(){ speak(b.getAttribute('data-say')); }); });
    if(ex.length) setTimeout(function(){ speak(ex[0].jp); },300);
  }
  /* resalta partículas/terminaciones fijas en shu dentro de una frase de ejemplo */
  function phraseHilite(e){ if(!e.parts) return e.jp; var out=''; e.parts.forEach(function(w){ var fix=PARTICLES[w]||['だ','です','ですか','か','ください','おねがいします','ある','いる','すき'].indexOf(w)>=0||/たい$/.test(w); out+=fix?'<span class="pt-hi">'+w+'</span>':w; }); return out; }
  function patternTeachDone(){ var pid=ptsess.pid, p=PATTERN_BY_ID[pid], pt=ensurePatterns();
    pt.seen[pid]=1; if(!(pt.box[pid]>=1))pt.box[pid]=1; (p.intro||[]).forEach(function(x){ if(PARTICLES[x])pt.seen['_p_'+x]=1; });
    setPatternDue(pid,pt.box[pid]); var td=today(); pt.daily[td]=(pt.daily[td]||0)+1; pt.newDay[td]=(pt.newDay[td]||0)+1; stampDay();
    Persistence.save(state); ptsess=null;
    /* Coherencia: tras enseñar el molde, armamos UNA de sus propias frases de
       ejemplo (mismo patrón), no una cualquiera. Las demás del mismo molde salen
       después vía nextBuildPhrase (ordenado por patrón). */
    var _exs=patternExamples(pid,20).filter(function(e){ return e.parts && !phraseMature(e); });
    if(_exs.length){ launchGuidedBuild(_exs[0]); return; }
    nextReadingQ(); }

  /* ---- CLOZE de partícula: ocultar UNA partícula y elegirla ---- */
  function launchPatternCloze(pid,relearn){
    var exs=PHRASES.filter(function(p){ return p.parts && patternOf(p)===pid && wordReadable(p.jp) && p.parts.some(function(w){return PARTICLES[w];}); });
    if(!exs.length){ // sin frase con partícula visible -> tratamos como visto y seguimos
      var pt=ensurePatterns(); pt.seen[pid]=1; if(!(pt.box[pid]>=1))pt.box[pid]=1; setPatternDue(pid,pt.box[pid]); ptsess=null; buildReadingQ(); renderReading(); return; }
    var phrase=exs[Math.floor(Math.random()*exs.length)];
    var pidxs=[]; phrase.parts.forEach(function(w,i){ if(PARTICLES[w])pidxs.push(i); });
    var slot=pidxs[Math.floor(Math.random()*pidxs.length)], answer=phrase.parts[slot];
    var conf=Object.keys(PCONF[answer]||{}); shuffle(conf);
    var opts=[answer].concat(conf.filter(function(x){return x!==answer;}).slice(0,3));
    while(opts.length<3){ var extra=['は','が','を','に','で','へ','の'].filter(function(x){return opts.indexOf(x)<0;}); if(!extra.length)break; opts.push(extra[0]); }
    opts=shuffle(opts);
    ptsess={mode:'cloze',pid:pid,relearn:!!relearn,phrase:phrase,slot:slot,answer:answer,opts:opts,answered:false,picked:null};
    renderPatternCloze(); readingEl.classList.remove('hidden');
  }
  function renderPatternCloze(){
    var q=ptsess, phrase=q.phrase, es=getLang()==='es';
    var jp=''; phrase.parts.forEach(function(w,i){ if(i===q.slot){ var cls='pt-hole'+(q.answered?(w===q.answer?' filled':''):''); jp+='<span class="'+cls+'">'+(q.answered?q.answer:'▢')+'</span>'; } else jp+=w; });
    var h=ptHead();
    h+='<div class="pt-card"><div class="pt-kind">'+t('Which particle goes here?')+'</div>';
    h+='<div class="pt-cloze mincho">'+((q.answered&&getSweep()&&isAllKana(phrase.jp))?sweepKanaHTML(phrase.jp):jp)+'</div>';
    h+='<div class="pt-clmean">'+(es?phrase.es:phrase.en)+'</div>';
    h+='<div class="pt-opts">';
    q.opts.forEach(function(w){ var cls='pt-opt mincho'; if(q.answered){ if(w===q.answer)cls+=' ok'; else if(w===q.picked)cls+=' bad'; else cls+=' dim'; } h+='<button class="'+cls+'" data-p="'+w+'">'+w+'</button>'; });
    h+='</div>';
    if(q.answered){ var info=PARTICLES[q.answer]; h+='<div class="pt-fb"><b class="mincho">'+q.answer+'</b> — '+(info?info.fn:'')+'</div>';
      h+='<div class="rq-ans" style="text-align:center;margin:4px 0 2px"><button class="d-spk-word" id="clSpk">🔊 <span>'+t('hear it')+'</span></button></div><div class="d-actions"><button class="d-next" id="ptNext">'+t('Next →')+'</button></div>'; }
    readingInner.innerHTML=h;
    var c=document.getElementById('rClose'); if(c)c.addEventListener('click',closeReading);
    var nx=document.getElementById('ptNext'); if(nx)nx.addEventListener('click',function(){ ptsess=null; nextReadingQ(); });
    var csp=document.getElementById('clSpk'); if(csp)csp.addEventListener('click',function(){ speakSweep(phrase.jp, readingInner.querySelector('.sweepline')); });
    if(!q.answered){ readingInner.querySelectorAll('.pt-opt').forEach(function(o){ o.addEventListener('click',function(){ clozeAnswer(o.getAttribute('data-p')); }); }); }
    else { setTimeout(function(){ speakSweep(phrase.jp, readingInner.querySelector('.sweepline')); },250); }
  }
  function clozeAnswer(p){ var q=ptsess; if(!q||q.answered)return; q.answered=true; q.picked=p;
    var pt=ensurePatterns(), pid=q.pid, correct=(p===q.answer), cur=pt.box[pid]||0, td=today();
    if(!pt.lastMove)pt.lastMove={};
    if(pt.lastMove[pid]!==td){ pt.box[pid]=correct?Math.min(5,cur+1):Math.max(1,cur-1); pt.lastMove[pid]=td; setPatternDue(pid,pt.box[pid]); }
    if(correct){ if((pt.leech[pid]||0)>0)pt.leech[pid]=0; } else { pt.leech[pid]=(pt.leech[pid]||0)+1; }
    pt.daily[td]=(pt.daily[td]||0)+1; stampDay();
    Persistence.save(state); renderPatternCloze(); }

  /* =========================================================================
     MADURACIÓN + CONSTRUCTOR GUIADO + FICHA DE SEGMENTACIÓN
     Ciclo de una construcción: teach -> construir guiado (x2) -> madura ->
     reconocer frase completa. El reconocimiento ("¿qué significa?") se reserva
     a patrones maduros (box>=PAT_MATURE). Patrón joven = se practica armando,
     con andamiaje: sólo las piezas de la frase + 1 distractor confundible.
     ========================================================================= */
  var PAT_MATURE=4, GUIDED_PROB=0.85, BUILD_NOPAT=2;
  function patternMature(pid){ return (ensurePatterns().box[pid]||0)>=PAT_MATURE; }
  function phraseMature(p){ if(!p.parts)return true;
    var ph=ensurePhrases(), built=(ph.built&&ph.built[p.jp])||0, pid=patternOf(p);
    if(pid&&PATTERN_BY_ID[pid]) return built>=1 && patternMature(pid);  // frase con patrón: armada >=1 vez + patrón maduro
    return built>=BUILD_NOPAT;                                          // frase sin patrón: armada BUILD_NOPAT veces
  }
  function phraseReadyMature(p){ if(!phraseReady(p))return false; return phraseMature(p); }
  /* frase construible sólo si su patrón ya fue enseñado (o no tiene patrón) */
  function buildableGate(p){ var pid=patternOf(p); if(!pid||!PATTERN_BY_ID[pid])return true; return !!ensurePatterns().seen[pid]; }
  /* próxima frase a construir: patrón de menor order primero, y dentro, la menos construida */
  function nextBuildPhrase(){ var ph=ensurePhrases();
    var blt=function(p){ return (ph.built&&ph.built[p.jp])||0; };
    var ord=function(p){ var pp=patternOf(p); return (pp&&PATTERN_BY_ID[pp])?PATTERN_BY_ID[pp].order:99; };
    /* construible = legible (kana aprendido) + patrón enseñado + no madura.
       NO exigimos vocab dominado (box>=3): armar la frase, con las piezas a la
       vista y el molde recién explicado, ES la forma de aprender ese vocab. */
    var cand=PHRASES.filter(function(p){ return p.parts && wordReadable(p.jp) && buildableGate(p) && !phraseMature(p); });
    if(!cand.length)return null;
    cand.sort(function(a,b){ return (ord(a)-ord(b)) || (blt(a)-blt(b)); });
    var bo=ord(cand[0]), bb=blt(cand[0]);
    var top=cand.filter(function(p){ return ord(p)===bo && blt(p)===bb; });
    return top[Math.floor(Math.random()*top.length)];
  }
  function phraseReadyIdxMature(pool){ var out=[]; for(var i=0;i<pool.length;i++) if(phraseReadyMature(pool[i])) out.push(i); return out; }
  /* frases del patrón totalmente construibles (todo el vocab ya dominado) */
  function buildablePhrases(pid){ return PHRASES.filter(function(p){ return p.parts && patternOf(p)===pid && wordReadable(p.jp) && p.parts.every(function(w){ return phraseWordKnown(w); }); }); }
  /* frases del patrón practicables por CLOZE (más laxo que construir: sólo pide una
     partícula visible, no que todo el vocab esté dominado). */
  function clozeablePhrases(pid){ return PHRASES.filter(function(p){ return p.parts && patternOf(p)===pid && wordReadable(p.jp) && p.parts.some(function(w){ return PARTICLES[w]; }); }); }
  /* un patrón se puede afianzar (y por lo tanto madurar) si tiene alguna frase
     construible O clozeable. Si no, no cuenta como "en vuelo" para no bloquear el
     pipeline con un patrón que aún no se puede practicar. */
  function patternPracticeable(pid){ return buildablePhrases(pid).length>0 || clozeablePhrases(pid).length>0; }
  function youngPattern(){ var pt=ensurePatterns(), cand=PATTERNS.filter(function(p){ var b=pt.box[p.id]||0; return pt.seen[p.id] && b>=1 && b<PAT_MATURE && buildablePhrases(p.id).length; }); cand.sort(function(a,b){return a.order-b.order;}); return cand.length?cand[0]:null; }

  /* ---- FICHA DE SEGMENTACIÓN (una sola vez, antes del primer patrón) ---- */
  function launchSegCard(){ ptsess={mode:'seg'}; renderSegCard(); readingEl.classList.remove('hidden'); }
  function renderSegCard(){
    var es=getLang()==='es';
    var h=ptHead();
    h+='<div class="sg-card">';
    h+='<div class="pt-kind">'+(es?'Cómo leer japonés':'Reading Japanese')+'</div>';
    h+='<div class="sg-title mincho">'+(es?'¿Dónde termina una palabra?':'Where does a word end?')+'</div>';
    h+='<p class="sg-p">'+(es?'En español, las palabras van separadas por espacios:':'In English, spaces separate the words:')+'</p>';
    h+='<div class="sg-demo"><span class="sg-es">'+(es?'me·gusta·el·té':'I·like·tea')+'</span></div>';
    h+='<p class="sg-p">'+(es?'En japonés, <b>no</b>. Todo va pegado, sin un solo espacio:':'In Japanese, <b>no</b>. It all runs together, no spaces:')+'</p>';
    h+='<div class="sg-demo"><span class="sg-jp mincho">おちゃ<span class="pt-hi">が</span>すき</span></div>';
    h+='<p class="sg-p">'+(es?'¿Cómo sabés dónde corta? Por las <b>partículas</b>: piezas cortitas (は・が・を・に…) que marcan las junturas. Cuando reconocés una, sabés que ahí termina una palabra y empieza otra:':'How do you know where to cut? By the <b>particles</b>: tiny pieces (は・が・を・に…) that mark the joins. Spot one and you know a word just ended:')+'</p>';
    h+='<div class="sg-demo"><div class="sg-cut mincho">おちゃ <span class="sg-bar">|</span> <span class="pt-hi">が</span> <span class="sg-bar">|</span> すき</div></div>';
    h+='<p class="sg-p">'+(es?'Por eso Nikka resalta las partículas en rojo: son tus <b>señales de corte</b>. Con el tiempo tu ojo las encuentra solo.':'That is why Nikka highlights particles in red: they are your <b>cut markers</b>. In time your eye finds them on its own.')+'</p>';
    h+='<div class="sg-note">'+(es?'Más adelante, cuando aparezcan los kanji (漢字), tendrás una segunda pista: el salto entre kanji y kana también marca los cortes.':'Later, when kanji (漢字) appear, you get a second cue: the jump between kanji and kana also marks the cuts.')+'</div>';
    h+='</div><div class="d-actions"><button class="d-next" id="ptGot">'+t('Got it →')+'</button></div>';
    readingInner.innerHTML=h;
    var c=document.getElementById('rClose'); if(c)c.addEventListener('click',closeReading);
    var g=document.getElementById('ptGot'); if(g)g.addEventListener('click',segDone);
  }
  function segDone(){ ensurePatterns().segSeen=1; Persistence.save(state); ptsess=null; nextReadingQ(); }

  /* ---- CONSTRUCTOR GUIADO ---- */
  function launchGuidedBuild(phrase){
    if(!phrase||!phrase.parts){ ptsess=null; buildReadingQ(); renderReading(); return; }
    var pid=patternOf(phrase);
    var tiles=phrase.parts.map(function(w){ return {w:w,used:false}; });
    var partIdx=-1; for(var i=0;i<phrase.parts.length;i++){ if(PARTICLES[phrase.parts[i]]){ partIdx=i; break; } }
    if(partIdx>=0){ var pw=phrase.parts[partIdx], conf=Object.keys(PCONF[pw]||{}).filter(function(c){return phrase.parts.indexOf(c)<0;});
      if(conf.length) tiles.push({w:conf[0],used:false,distractor:true}); }
    else { var pool=PHRASES.filter(function(p){return p.parts&&(!pid||patternOf(p)===pid);}).reduce(function(a,p){p.parts.forEach(function(w){if(!PARTICLES[w]&&phrase.parts.indexOf(w)<0&&a.indexOf(w)<0&&wordReadable(w))a.push(w);});return a;},[]);
      if(pool.length){ shuffle(pool); tiles.push({w:pool[0],used:false,distractor:true}); } }
    shuffle(tiles);
    ptsess={mode:'build',pid:pid,phrase:phrase,tiles:tiles,placed:[],answered:false,bad:-1};
    renderGuidedBuild(); readingEl.classList.remove('hidden');
  }
  function renderGuidedBuild(){
    var q=ptsess, es=getLang()==='es';
    var h=ptHead();
    h+='<div class="pt-card"><div class="pt-kind">'+t('Build the phrase')+'</div>';
    h+='<div class="gb-goal">'+(es?q.phrase.es:q.phrase.en)+'</div>';
    h+='<div class="gb-sub">'+t('Tap the words in order to build the phrase')+'</div>';
    h+='<div class="gb-slot">';
    q.placed.forEach(function(w){ h+='<span class="gb-placed'+(PARTICLES[w]?' pt':'')+'">'+w+'</span>'; });
    if(!q.answered) h+='<span class="gb-caret"></span>';
    h+='</div>';
    if(q.answered){ h+='<div class="pt-fb" style="border:none;padding-top:8px"><span class="mincho" style="font-size:22px;color:var(--green)">'+sweepKanaHTML(q.phrase.jp)+'</span></div>'; }
    else {
      h+='<div class="gb-tray">';
      q.tiles.forEach(function(tl,i){ var cls='gb-tile'+(PARTICLES[tl.w]?' pt':'')+(tl.used?' used':'')+(q.bad===i?' bad':''); h+='<button class="'+cls+'" data-i="'+i+'">'+tl.w+'</button>'; });
      h+='</div>';
    }
    h+='</div>';
    if(q.answered) h+='<div class="rq-ans" style="text-align:center;margin:4px 0 2px"><button class="d-spk-word" id="gbSpk">🔊 <span>'+t('hear it')+'</span></button></div><div class="d-actions"><button class="d-next" id="gbNext">'+t('Next →')+'</button></div>';
    readingInner.innerHTML=h;
    var c=document.getElementById('rClose'); if(c)c.addEventListener('click',closeReading);
    var nx=document.getElementById('gbNext'); if(nx)nx.addEventListener('click',function(){ ptsess=null; nextReadingQ(); });
    var gsp=document.getElementById('gbSpk'); if(gsp)gsp.addEventListener('click',function(){ speakSweep(q.phrase.jp, readingInner.querySelector('.sweepline')); });
    if(!q.answered){ readingInner.querySelectorAll('.gb-tile:not(.used)').forEach(function(o){ o.addEventListener('click',function(){ gbTap(parseInt(o.getAttribute('data-i'),10)); }); }); }
    else { setTimeout(function(){ speakSweep(q.phrase.jp, readingInner.querySelector('.sweepline')); },250); }
  }
  function gbTap(i){ var q=ptsess; if(!q||q.answered)return; var tl=q.tiles[i]; if(tl.used)return;
    var next=q.phrase.parts[q.placed.length];
    if(tl.w===next){ tl.used=true; q.placed.push(tl.w); q.bad=-1;
      if(q.placed.length===q.phrase.parts.length){ q.answered=true; buildComplete(); } }
    else { q.bad=i; }
    renderGuidedBuild();
  }
  function buildComplete(){ var pt=ensurePatterns(), ph=ensurePhrases(), q=ptsess, td=today();
    ph.built[q.phrase.jp]=(ph.built[q.phrase.jp]||0)+1;         // cuenta la construcción de esta frase
    /* El patrón sube de nivel como máximo UNA vez por día (igual que el SRS de
       palabras). Así madurar hasta el reconocimiento toma varios días, no 4 clics
       de la misma sesión. Podés seguir armando hoy: practica sin adelantar el box. */
    if(q.pid && PATTERN_BY_ID[q.pid]){ if(!pt.lastMove)pt.lastMove={};
      if(pt.lastMove[q.pid]!==td){ var cur=pt.box[q.pid]||0; pt.box[q.pid]=Math.min(5,cur+1); pt.lastMove[q.pid]=td; setPatternDue(q.pid,pt.box[q.pid]); } }
    ph.seen[q.phrase.jp]=1;                                     // no re-enseñar como frase nueva
    pt.daily[td]=(pt.daily[td]||0)+1; stampDay();
    Persistence.save(state); }



  function buildReadingQ(){
    var pool=rsess.pool,box=rsess.box,all=[]; for(var i=0;i<pool.length;i++)all.push(i);
    var readable=(pool===PHRASES?phraseReadyIdxMature(pool):readableIdx(pool)), tgtSet;
    if(pool===PHRASES){
      /* Frases: nunca usar TODO el pool como fallback (eso soltaba ~15 frases de
         golpe tras un reset y evaluaba reconocimiento de patrones sin enseñar).
         El set = frases maduras (para reconocer) UNIÓN las introducibles bajo la
         escalera: frases fijas (sin partes) o frases cuyo patrón YA se enseñó y su
         vocab se lee. El resto lo maneja el director de patrones (maybePattern). */
      tgtSet=readable.slice();
      for(var _e=0;_e<pool.length;_e++){ var _p=pool[_e];

    var ex=rsess.ex, td=today(); ex.lastMove=ex.lastMove||{};
    /* SRS de palabras — dos reglas que mantienen el pool sano y el dominio honesto:
       (A) fallar hace ‑1 (Math.max(0,cur‑1)), NO reset a 0: un tropiezo ya no borra
           toda la racha, así las palabras convergen en vez de reciclarse al fondo.
       (B) un movimiento de box por palabra por día: solo el PRIMER encuentro de cada
           día mueve el box (ese es el reencuentro espaciado real). Los siguientes
           del mismo día refuerzan pero no lo mueven. Así box>=4 = acertada en 4 días
           distintos = dominio espaciado de verdad, no una racha de un mismo minuto. */
    if(ex.lastMove[key]!==td){
      box[key]=correct?Math.min(5,cur+1):Math.max(0,cur-1);
      ex.lastMove[key]=td;
      if(box[key]>cur){ /* real level-up today (honest momentum, not just reps) */
        ex.up=ex.up||{}; ex.up[td]=(ex.up[td]||0)+1;
        if(cur<4 && box[key]>=4){ ex.mas=ex.mas||{}; ex.mas[td]=(ex.mas[td]||0)+1; }

    if(ex.leech){ ex.leech[key]=correct?0:((ex.leech[key]||0)+1); }

  /* =========================================================================
     NEW EXERCISES — Armar la palabra (build) + Emparejar (match)
     Both live in CHARACTER practice (stages 1–3): the word is a scaffold to
     drill kana in context. They feed the SAME kana SRS as the drill (boxFor /
     setDue / leech) and count toward the daily goal (k.daily[td].done + stampDay).
     "Solo lo aprendido": build words are gated by wordReadable; match draws only
     from learned+active pairs. Tunable: BUILD_MAX_LEN, buildFullProb, MATCH_PAIRS.
     Both reuse the #reading overlay (readingEl/readingInner) — one runs at a time.
     ========================================================================= */
  var bsess=null, msess=null;
  function bstat(){ return wsess?rsess:bsess; }
  var BUILD_MAX_LEN=4, MATCH_PAIRS=5;

  /* shared: mirror the drill's SRS + daily semantics for one character event */
  function srsMark(script,romaji,correct){
    var b=boxFor(script),cur=b[romaji]||0;
    b[romaji]=correct?Math.min(5,cur+1):0;
    setDue(script,romaji,b[romaji]);
    if(correct){ if(b[romaji]>=PROMOTE_AT)clearLeech(script,romaji); } else { bumpLeech(script,romaji); }
  }
  function bumpDaily(correct){
    var k=ensureKana(),td=today();
    if(!k.daily[td])k.daily[td]={done:0,correct:0};
    k.daily[td].done++; if(correct)k.daily[td].correct++;
    stampDay();
  }
  function closeExtra(){ if(csess){ customEnd(); return; } if(dsess){ dailyEnd(); return; } if(wsess){ wordsEnd(); return; } bsess=null; msess=null; readingEl.classList.add("hidden"); try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){} render(); }

  /* ---------- ARMAR LA PALABRA ---------- */
  function wordChars(jp){ var a=[]; for(var i=0;i<jp.length;i++){ var ch=jp.charAt(i); var e=KANA_REV[ch]; if(e)a.push({ch:ch,romaji:e.romaji,script:e.script}); } return a; }
  function buildWordPool(){
    return WORD_POOL.filter(function(w){
      if(!wordReadable(w.jp))return false;
      var real=0,ok=true;
      for(var i=0;i<w.jp.length;i++){ var ch=w.jp.charAt(i);
        if(SMALL_KANA.indexOf(ch)>=0){ ok=false; break; }   /* v1: skip っ/ゃ/ー etc. so 1 tile = 1 testable kana */
        if(!KANA_REV[ch]){ ok=false; break; }
        real++;
      }
      return ok && real>=2 && real<=BUILD_MAX_LEN;
    });
  }
  /* how much to lean toward full-word building vs single-gap cloze:
     rises with how many kana are learned and how solid they are — "se va adaptando". */
  function buildFullProb(){
    var pairs=activePairs().filter(function(p){return isLearned(p.script,p.romaji);});
    if(!pairs.length)return 0.15;
    var sum=0; pairs.forEach(function(p){ sum+=Math.min(5,boxFor(p.script)[p.romaji]||0); });
    var avg=sum/pairs.length, learnedFactor=Math.min(1,pairs.length/20);
    return Math.max(0.15,Math.min(0.8,(avg/5)*0.55+learnedFactor*0.3));
  }
  function buildNextQ(preferJp){
    var pool=buildWordPool();
    if(wsess){ var _sn=ensureWords().seen||{}; pool=pool.filter(function(w){return _sn[w.jp];}); }
    if(!pool.length){ bsess.q=null; return; }
    var w=null; if(preferJp){ for(var _pi=0;_pi<pool.length;_pi++){ if(pool[_pi].jp===preferJp){ w=pool[_pi]; break; } } } if(!w) w=pool[Math.floor(Math.random()*pool.length)];
    var chars=wordChars(w.jp);
    if(Math.random()<buildFullProb()){
      var uniq={}; chars.forEach(function(c){uniq[c.ch]=1;});
      var decoys=[];
      chars.forEach(function(c){ distractors(c.romaji,c.script,2).forEach(function(dr){ var g=glyph(dr,c.script); if(!uniq[g]&&decoys.indexOf(g)<0)decoys.push(g); }); });
      shuffle(decoys); decoys=decoys.slice(0,Math.max(2,Math.min(4,8-Object.keys(uniq).length)));
      var tiles=shuffle(Object.keys(uniq).concat(decoys));
      bsess.q={mode:"full",word:w,chars:chars,tiles:tiles,slot:0,placed:[],attempted:{},badTile:"",done:false};
    }else{
      var bi=Math.floor(Math.random()*chars.length),tgt=chars[bi];
      var seen={},opts=[{romaji:tgt.romaji,ch:tgt.ch}]; seen[tgt.romaji]=1;
      distractors(tgt.romaji,tgt.script,5).forEach(function(r){ if(!seen[r]){seen[r]=1;opts.push({romaji:r,ch:glyph(r,tgt.script)});} });
      shuffle(opts);
      bsess.q={mode:"cloze",word:w,chars:chars,blank:bi,tgt:tgt,opts:opts,done:false,picked:null,correct:false};
    }
  }
  function startBuild(){ bsess={done:0,correct:0,wrong:0,q:null}; buildNextQ(); readingEl.classList.remove("hidden"); renderBuild(); }
  function buildAnswerCloze(rom){
    var q=bsess.q; if(!q||q.done||q.mode!=="cloze")return;
    var correct=rom===q.tgt.romaji;
    q.done=true; q.picked=rom; q.correct=correct;
    srsMark(q.tgt.script,q.tgt.romaji,correct); bumpDaily(correct); if(correct)markWordKnown(q.word.jp);
    var _st=bstat(); _st.done++; if(correct)_st.correct++; else _st.wrong++;
    speak(q.word.jp); Persistence.save(state); renderBuild();
  }
  function buildTapTile(gl){
    var q=bsess.q; if(!q||q.done||q.mode!=="full")return;
    var slot=q.slot, need=q.chars[slot], firstTry=!q.attempted[slot];
    if(gl===need.ch){
      if(firstTry){ q.attempted[slot]=1; srsMark(need.script,need.romaji,true); bumpDaily(true); var _st=bstat(); _st.done++; _st.correct++; }
      q.placed[slot]=gl; q.badTile=""; q.slot++;
      if(q.slot>=q.chars.length){ q.done=true; speak(q.word.jp); markWordKnown(q.word.jp); }
      Persistence.save(state); renderBuild();
    }else{
      if(firstTry){ q.attempted[slot]=1; srsMark(need.script,need.romaji,false); bumpDaily(false); var _st=bstat(); _st.done++; _st.wrong++; Persistence.save(state); }
      q.badTile=gl; renderBuild();
    }
  }
  function extraGoalHTML(){
    var k=ensureKana(),dt=k.daily[today()]||{done:0},gpct=Math.min(100,dt.done),gtier=dayTier(dt.done);
    return '<div class="d-goal"><div class="lab"><span>'+t("Daily goal")+'</span><span>'+dt.done+(gtier>=0?' · '+t(TIER_LABEL[gtier]):'')+'</span></div>'+

  function renderBuild(){
    var q=bsess.q, h=buildHeaderHTML(bstat());
    if(!q){ h+='<div class="rq-prompt"><div class="rq-kind">'+t("Build the word")+'</div><div class="rq-mean">'+t("Learn a few characters first.")+'</div></div>'; readingInner.innerHTML=h; bindBuild(); return; }
    var es=getLang()==="es", w=q.word, mean=(es?w.es:w.en)||w.en||"", em=(getEmoji()&&w.emoji)?(' '+w.emoji):"", showRom=state.buildRomaji!==false;
    h+='<div class="rq-prompt">';
    h+='<div class="rq-kind">'+t(q.mode==="cloze"?"Fill the gap":"Spell it out")+'</div>';
    h+='<div class="rq-mean">'+mean+em+'</div>';

    h+='<button class="d-spk" id="xSpk" aria-label="Play">🔊</button>';
    h+='</div>';
    h+='<div class="bw-slots mincho">';
    q.chars.forEach(function(c,i){
      if(q.mode==="cloze"){

      }else{

        else if(i===q.slot && !q.done) h+='<span class="bw-slot active">＿</span>';
        else h+='<span class="bw-slot">＿</span>';

    h+='</div>';
    h+='<div class="d-grid bw-grid">';
    if(q.mode==="cloze"){
      q.opts.forEach(function(o){
        var cls="opt mincho";
        if(q.done){ if(o.romaji===q.tgt.romaji)cls+=" correct"; else if(o.romaji===q.picked)cls+=" bad"; else cls+=" dim"; }
        h+='<button class="'+cls+'" data-rom="'+o.romaji+'">'+o.ch+'</button>';
      });
    }else{
      q.tiles.forEach(function(g){ h+='<button class="opt mincho'+(q.badTile===g?" bad":"")+'" data-tile="'+g+'">'+g+'</button>'; });
    }
    h+='</div>';
    h+='<div class="rd-toggles">';

    h+='</div>';

      h+='<div class="rq-fb"><div class="rq-ans"><span class="mincho">'+sweepKanaHTML(w.jp)+'</span> <span class="rq-rom">'+w.romaji+'</span> — <span class="mean">'+mean+'</span></div></div>';
      h+='<div class="d-actions"><button class="d-next" id="xNext">'+t("Next →")+'</button></div>';
    }
    readingInner.innerHTML=h; bindBuild();
  }
  function bindBuild(){
    var c=document.getElementById("xClose"); if(c)c.addEventListener("click",closeExtra);
    var sp=document.getElementById("xSpk"); if(sp)sp.addEventListener("click",function(){ if(bsess&&bsess.q)speakSweep(bsess.q.word.jp, readingInner.querySelector(".sweepline")); });
    var rt=document.getElementById("xRom"); if(rt)rt.addEventListener("click",function(){ state.buildRomaji=!(state.buildRomaji!==false); Persistence.save(state); renderBuild(); });
    var et=document.getElementById("xEmoji"); if(et)et.addEventListener("click",function(){ state.emoji=!getEmoji(); Persistence.save(state); renderBuild(); });
    var nx=document.getElementById("xNext"); if(nx)nx.addEventListener("click",function(){ if(csess){ customAfterUnit(); } else if(dsess){ dailyAfterUnit(); } else if(wsess){ wordsAfterUnit(); } else { buildNextQ(); renderBuild(); } });
    if(bsess&&bsess.q&&!bsess.q.done){
      if(bsess.q.mode==="cloze") readingInner.querySelectorAll(".opt[data-rom]").forEach(function(o){ o.addEventListener("click",function(){ buildAnswerCloze(o.getAttribute("data-rom")); }); });
      else readingInner.querySelectorAll(".opt[data-tile]").forEach(function(o){ o.addEventListener("click",function(){ buildTapTile(o.getAttribute("data-tile")); }); });
    }
  }

  /* ---------- EMPAREJAR ---------- */
  function matchPool(){ return activePairs().filter(function(p){return isLearned(p.script,p.romaji);}); }
  function matchDeal(){
    var pool=matchPool(); if(pool.length<3){ msess.left=null; msess.right=null; return; }
    var scored=pool.map(function(p){ var b=Math.min(5,boxFor(p.script)[p.romaji]||0); return {p:p,w:Math.max(1,6-b)+(isDue(p.script,p.romaji)?3:0)}; });
    var N=Math.min(MATCH_PAIRS,pool.length),chosen=[],bag=scored.slice(),usedRom={};
    while(chosen.length<N && bag.length){
      var sum=bag.reduce(function(a,x){return a+x.w;},0),x=Math.random()*sum,idx=0;
      for(var i=0;i<bag.length;i++){ x-=bag[i].w; if(x<=0){idx=i;break;} }
      var cand=bag[idx].p; bag.splice(idx,1);
      if(usedRom[cand.romaji])continue;            /* one sound per board: や/ヤ, へ/ヘ can't both show */
      usedRom[cand.romaji]=1; chosen.push(cand);
    }
    var left=chosen.map(function(p,i){return {id:i,type:"g",p:p,glyph:glyph(p.romaji,p.script),done:false};});
    var right=chosen.map(function(p,i){return {id:i,type:"r",p:p,label:p.romaji,done:false};});
    msess.left=shuffle(left); msess.right=shuffle(right); msess.sel=null; msess.bad=null; msess.remain=chosen.length;
  }
  function startMatch(){ msess={done:0,boards:0,wrong:0}; matchDeal(); readingEl.classList.remove("hidden"); renderMatch(); }
  function matchTap(col,idx){
    if(!msess)return;
    var arr=col==="l"?msess.left:msess.right, card=arr&&arr[idx];
    if(!card||card.done)return;
    var sel=msess.sel;
    if(!sel){ msess.sel={col:col,idx:idx,id:card.id}; msess.bad=null; renderMatch(); return; }
    if(sel.col===col){ msess.sel=(sel.idx===idx)?null:{col:col,idx:idx,id:card.id}; msess.bad=null; renderMatch(); return; }
    if(sel.id===card.id){
      arr[idx].done=true; (sel.col==="l"?msess.left:msess.right)[sel.idx].done=true;
      srsMark(card.p.script,card.p.romaji,true); bumpDaily(true);
      if(state.matchSpeak!==false)speak(glyph(card.p.romaji,card.p.script));
      msess.done++; msess.remain--; msess.sel=null; msess.bad=null; Persistence.save(state);
      if(msess.remain<=0){ msess.boards++; renderMatch(); setTimeout(function(){ if(csess){ if(msess)customAfterUnit(); } else if(dsess){ if(msess)dailyAfterUnit(); } else if(msess){ matchDeal(); renderMatch(); } },700); return; }
      renderMatch();
    }else{
      msess.wrong=(msess.wrong||0)+1;
      msess.bad=[{col:sel.col,idx:sel.idx},{col:col,idx:idx}]; msess.sel=null; renderMatch();
      setTimeout(function(){ if(msess){ msess.bad=null; renderMatch(); } },550);
    }
  }
  function matchTileHTML(col,idx,card){
    var lab=card.type==="g"?card.glyph:card.label, base="opt mt-tile"+(card.type==="g"?" mincho":" rom");
    if(card.done)return '<button class="'+base+' done" disabled>'+lab+'</button>';
    var sel=msess.sel&&msess.sel.col===col&&msess.sel.idx===idx;
    var bad=msess.bad&&msess.bad.some(function(b){return b.col===col&&b.idx===idx;});
    return '<button class="'+base+(sel?" sel":"")+(bad?" bad":"")+'" data-col="'+col+'" data-idx="'+idx+'">'+lab+'</button>';
  }
  function renderMatch(){
    var mWrong=msess.wrong||0, mDone=msess.done+mWrong;
    var h='<div class="d-sticky"><div class="d-head"><div class="d-head-l"><button class="d-close" id="mClose">✕ '+t("Close")+'</button>'+gearBtn()+'</div>'+
      '<div class="d-stats">'+
      '<div class="d-stat"><div class="n">'+mDone+'</div><div class="l">'+t("Done")+'</div></div>'+
      '<div class="d-stat wrong"><div class="n">'+mWrong+'</div><div class="l">'+t("Wrong")+'</div></div>'+
      '<div class="d-stat right"><div class="n">'+msess.done+'</div><div class="l">'+t("Correct")+'</div></div>'+
      '</div></div>'+
      '<div class="mt-sub">'+msess.done+' '+t("Pairs")+' · '+msess.boards+' '+t("Boards")+'</div>'+
      wordsGoalHTML()+'</div>';
    if(!msess.left){ h+='<div class="rq-prompt"><div class="rq-kind">'+t("Match")+'</div><div class="rq-mean">'+t("Learn a few characters first.")+'</div></div>'; readingInner.innerHTML=h; bindMatch(); return; }
    h+='<div class="rq-prompt" style="padding:4px 0 2px"><div class="rq-kind">'+t("Tap the pairs")+'</div></div>';
    h+='<div class="mt-board"><div class="mt-col">';
    msess.left.forEach(function(card,idx){ h+=matchTileHTML("l",idx,card); });
    h+='</div><div class="mt-col">';
    msess.right.forEach(function(card,idx){ h+=matchTileHTML("r",idx,card); });
    h+='</div></div>';
    h+='<button class="bw-toggle" id="mSnd">'+(state.matchSpeak!==false?"☑":"☐")+' '+t("🔊 on tap")+'</button>';

  }
  function bindMatch(){
    var c=document.getElementById("mClose"); if(c)c.addEventListener("click",closeExtra);
    var s=document.getElementById("mSnd"); if(s)s.addEventListener("click",function(){ state.matchSpeak=(state.matchSpeak===false); Persistence.save(state); renderMatch(); });
    readingInner.querySelectorAll(".mt-tile:not([disabled])").forEach(function(o){ o.addEventListener("click",function(){ matchTap(o.getAttribute("data-col"),parseInt(o.getAttribute("data-idx"),10)); }); });
  }

  /* =========================================================================
     ARMÁ LA FRASE — build a compositional phrase from word-tiles.
     Only phrases carrying a `parts` array are buildable (fixed idioms like
     がんばって have none and are recognition-only, which is correct — they
     don't decompose). Gated by "solo lo aprendido": the phrase must be
     readable AND already seen (its first-contact card was shown). Runs inside
     the Frases session as an occasional detour from the recognition quiz,
     mirroring the words+build (wsess+bsess) seam. Never punitive: a wrong tile
     just flags red; only a completed build advances SRS. Tunable: PHRASE_BUILD_PROB.
     ========================================================================= */
  var pbsess=null, PHRASE_BUILD_PROB=0.34, pbRecent=[];
  function phraseDecoyUniverse(){ var u={}; PHRASES.forEach(function(p){ if(p.parts)p.parts.forEach(function(w){u[w]=1;}); }); return Object.keys(u); }
  function phraseBuildPool(){
    if(!rsess||rsess.pool!==PHRASES)return [];
    /* Fix A: the builder shows the meaning + note up front, so it doubles as a
       first-contact card. We no longer require `seen` — only that the phrase is
       readable with the kana you know ("solo lo aprendido" still holds). This
       unlocks all composable phrases instead of only the handful you've seen. */
    return PHRASES.filter(function(p){ return p.parts && p.parts.length>=2 && wordReadable(p.jp); });
  }
  function maybePhraseBuild(){
    var pool=phraseBuildPool(); if(!pool.length)return false;
    if(Math.random()>=PHRASE_BUILD_PROB)return false;
    /* ring buffer of the last 3 built phrases — pbsess is nulled between
       questions, so we can't rely on it to remember. Falls back to the full
       pool only if everything's recent (tiny pool). */
    var recentSet={}; pbRecent.forEach(function(jp){recentSet[jp]=1;});
    var pick=pool.filter(function(p){return !recentSet[p.jp];});
    if(!pick.length)pick=pool;
    var box=rsess.box; pick.sort(function(a,b){return (box[a.jp]||0)-(box[b.jp]||0);});
    var head=pick.slice(0,Math.min(3,pick.length)), phrase=head[Math.floor(Math.random()*head.length)];
    pbRecent.push(phrase.jp); if(pbRecent.length>3)pbRecent.shift();
    phraseBuildLaunch(phrase); return true;
  }
  function phraseBuildLaunch(phrase){
    var target=phrase.parts.slice();
    var uniq={}; target.forEach(function(w){uniq[w]=1;});
    var decoys=phraseDecoyUniverse().filter(function(w){return !uniq[w];});
    shuffle(decoys); decoys=decoys.slice(0,Math.max(1,Math.min(3,6-target.length)));
    var tiles=shuffle(target.concat(decoys));
    pbsess={phrase:phrase,target:target,tiles:tiles,slot:0,used:{},badIdx:-1,done:false};
    readingEl.classList.remove("hidden"); renderPhraseBuild();
  }
  function pbHeadHTML(){
    return '<div class="d-sticky"><div class="d-head"><div class="d-head-l"><button class="d-close" id="rClose">✕ '+t("Close")+'</button>'+gearBtn()+'</div>'+
      '<div class="d-stats"><div class="d-stat"><div class="n">'+rsess.done+'</div><div class="l">'+t("Done")+'</div></div>'+
      '<div class="d-stat wrong"><div class="n">'+rsess.wrong+'</div><div class="l">'+t("Wrong")+'</div></div>'+
      '<div class="d-stat right"><div class="n">'+rsess.correct+'</div><div class="l">'+t("Correct")+'</div></div></div></div>'+wordsGoalHTML()+'</div>';
  }
  function renderPhraseBuild(){
    var q=pbsess, es=getLang()==="es", p=q.phrase, h=pbHeadHTML();
    h+='<div class="rq-prompt">';
    h+='<div class="rq-kind">'+t("Build the phrase")+'</div>';
    h+='<div class="rq-mean">'+(es?p.es:p.en)+'</div>';
    h+='<button class="d-spk" id="pbSpk" aria-label="Play">🔊</button>';
    h+='</div>';
    h+='<div class="pb-slots mincho">';
    q.target.forEach(function(w,i){
      if(i<q.slot) h+='<span class="pb-slot filled">'+q.placed[i]+'</span>';
      else if(i===q.slot && !q.done) h+='<span class="pb-slot active empty">＿</span>';
      else h+='<span class="pb-slot empty">＿</span>';
    });
    h+='</div>';
    h+='<div class="pb-grid mincho">';
    q.tiles.forEach(function(w,i){
      var cls="pb-tile"+(q.used[i]?" used":"")+(q.badIdx===i?" bad":"");
      h+='<button class="'+cls+'" data-i="'+i+'">'+w+'</button>';
    });
    h+='</div>';
    if(q.done){
      h+='<div class="rq-fb"><div class="rq-ans"><span class="mincho">'+sweepKanaHTML(p.jp)+'</span> <span class="rq-rom">'+p.romaji+'</span> — <span class="mean">'+(es?p.es:p.en)+'</span></div>'+(p.note?'<div class="rq-note">'+p.note+'</div>':'')+'</div>';
      h+='<div class="d-actions"><button class="d-next" id="pbNext">'+t("Next →")+'</button></div>';
    }
    readingInner.innerHTML=h; bindPhraseBuild();
  }
  function pbTap(i){
    var q=pbsess; if(!q||q.done||q.used[i])return;
    var need=q.target[q.slot];
    if(q.tiles[i]===need){
      q.used[i]=true; q.placed=q.placed||[]; q.placed[q.slot]=q.tiles[i]; q.slot++; q.badIdx=-1;
      if(q.slot>=q.target.length){
        q.done=true;
        var jp=q.phrase.jp, box=rsess.box, cur=box[jp]||0; box[jp]=Math.min(5,cur+1);
        if(rsess.ex.leech)rsess.ex.leech[jp]=0;
        if(rsess.ex.seen)rsess.ex.seen[jp]=1;  /* building it counts as first contact for recognition */
        rsess.done++; rsess.correct++;
        var td=today(); rsess.ex.daily[td]=(rsess.ex.daily[td]||0)+1; stampDay();
        Persistence.save(state); speak(jp);
      }
      renderPhraseBuild();
    }else{
      q.badIdx=i; renderPhraseBuild();
    }
  }
  function bindPhraseBuild(){
    var c=document.getElementById("rClose"); if(c)c.addEventListener("click",closeReading);
    var sp=document.getElementById("pbSpk"); if(sp)sp.addEventListener("click",function(){ if(pbsess)speakSweep(pbsess.phrase.jp, readingInner.querySelector(".sweepline")); });
    var nx=document.getElementById("pbNext"); if(nx)nx.addEventListener("click",nextReadingQ);
    if(!pbsess.done) readingInner.querySelectorAll(".pb-tile:not(.used)").forEach(function(o){ o.addEventListener("click",function(){ pbTap(parseInt(o.getAttribute("data-i"),10)); }); });
  }

  /* =========================================================================
     PRACTICA DIARIA - dynamic director. Interleaves the REAL kana drill
     (teaching + review), Emparejar and Armar la palabra in one session.
     Exercises phase in by practiced-days; proportions shift by mastery.
     Each exercise stays untouched; a tiny "unit done -> next" seam hands
     control back here (nextQuestion / build Next / match board-clear).
     Tunables: INTRO_DAYS, the 70/15/15 base + ramp, masteryLevel().
     ========================================================================= */
  var dsess=null;
  var INTRO_DAYS={match:1, build:3};   // practiced days before each exercise joins the mix
  function practicedDays(){ var n=0,d=state.days||{}; for(var kk in d){ if(coreDone(d[kk]))n++; } return n; }
  function masteryLevel(){
    var pairs=activePairs().filter(function(p){return isLearned(p.script,p.romaji);}), n=pairs.length;
    if(!n)return 0;
    var sum=0; pairs.forEach(function(p){ sum+=Math.min(5,boxFor(p.script)[p.romaji]||0); });
    var solid=(sum/n)/5, count=Math.max(0,Math.min(1,(n-15)/(100-15)));
    return Math.max(0,Math.min(1,0.5*count+0.5*solid));      // 0..1: blends how many + how solid
  }
  /* ¿hay algo de frases para hacer ahora? (patrón por enseñar, frase por armar, o
     reconocimiento maduro). Sólo si las frases están activadas. */
  function anyPhraseWork(){ if(!phrasesOn())return false;
    return !!nextPatternToTeach() || !!nextBuildPhrase() || phraseReadyIdxMature(PHRASES).length>0; }
  function dailyMix(){
    var days=practicedDays(), m=masteryLevel();
    var learnedN=activePairs().filter(function(p){return isLearned(p.script,p.romaji);}).length;
    var canMatch = days>=INTRO_DAYS.match && learnedN>=8;
    var canBuild = canMatch && days>=INTRO_DAYS.build && buildWordPool().length>=8;
    var drill,match,build;
    if(canBuild){ build=15+55*m; drill=70-55*m; match=15; }   // steady 70/15/15 -> mastery 15/15/70
    else if(canMatch){ drill=80; match=20; build=0; }         // just introduced pairs
    else { drill=100; match=0; build=0; }                     // day 1: only characters
    /* frases tejidas en el mismo flujo (no una etapa aparte), sólo si están activadas */
    var phrase=(canBuild && anyPhraseWork())?25:0;
    var tot=drill+match+build+phrase;
    return {drill:drill/tot, match:match/tot, build:build/tot, phrase:phrase/tot, canMatch:canMatch, canBuild:canBuild, m:m, days:days, learnedN:learnedN};
  }
  function pickDailyType(mix){ mix=mix||dailyMix(); var r=Math.random();
    if(r<mix.drill)return "drill";
    if(r<mix.drill+mix.match)return "match";
    if(r<mix.drill+mix.match+mix.build)return "build";
    return "phrase"; }
  function startDaily(){ ensureKana(); dsess={active:true,cur:null}; dailyNextUnit(); }
  function dailyNextUnit(){
    if(!dsess)return;
    var mix=dailyMix(), type=pickDailyType(mix);
    if(type==="match" && !mix.canMatch)type="drill";
    if(type==="build" && !mix.canBuild)type="drill";
    if(type==="phrase" && !(phrasesOn() && anyPhraseWork()))type="drill";
    dsess.cur=type;
    if(type!=="phrase"){ dsess.inPhrase=false; ptsess=null; }
    if(type==="drill"){
      readingEl.classList.add("hidden");
      if(!sess) sess={done:0,correct:0,wrong:0,q:null,hitGoalShown:false,newCount:0,maxNew:5,mode:"quiz",teach:null,force:null};
      buildQuestion(); drillEl.classList.remove("hidden"); renderDrill();
    }else if(type==="match"){
      drillEl.classList.add("hidden");
      if(!msess) msess={done:0,boards:0,wrong:0};
      matchDeal(); readingEl.classList.remove("hidden"); renderMatch();
    }else if(type==="build"){
      drillEl.classList.add("hidden");
      if(!bsess) bsess={done:0,correct:0,wrong:0,q:null};
      buildNextQ(); readingEl.classList.remove("hidden"); renderBuild();
    }else{ /* phrase: ráfaga corta de frases tejida en el mismo flujo, luego vuelve a palabras */
      drillEl.classList.add("hidden");
      dsess.inPhrase=true; dsess.phraseBudget=PHRASE_DAILY_BURST;
      if(!rsess || rsess.pool!==PHRASES){ startQuiz(PHRASES, ensurePhrases(), true); }
      else { readingEl.classList.remove("hidden"); buildReadingQ(); renderReading(); }
      if(rsess && rsess.pool===PHRASES) maybePattern();   // detour de gramática para la 1a unidad
    }
  }
  function dailyAfterUnit(){ if(!dsess)return; dailyNextUnit(); }
  function dailyEnd(){ dsess=null; sess=null; bsess=null; msess=null;
    drillEl.classList.add("hidden"); readingEl.classList.add("hidden");
    try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){} render(); }

  /* ========================================================================
     EJERCICIO PERSONALIZADO — una puerta manual al director.
     El usuario elige qué actividades entran en la mezcla; csess las interleava
     reusando exactamente los mismos renderers y costuras que dsess/wsess.
     Config efímero (customCfg) — no toca estado persistido. Todo cuenta para
     el progreso del día porque cada unidad usa bumpDaily / *.daily de siempre.
     Gates honestos: lo no disponible aparece grisado con su motivo, nunca oculto.
     ======================================================================== */
  var customEl=document.getElementById("custom"), customInner=document.getElementById("customInner");
  var csess=null, customCfg=null;
  function customActs(){
    var mix=dailyMix();
    return {
      drill:  {ok:true},
      match:  {ok:mix.canMatch,  reason:"Learn a few characters first."},
      build:  {ok:mix.canBuild,  reason:"Learn a few characters first."},
      words:  {ok:readableIdx(WORD_POOL).length>0, reason:"learn more kana first"},
      phrases:{ok:(typeof PHRASES!=='undefined')&&readableIdx(PHRASES).length>0, reason:"learn more kana first"},
      kanji:  {ok:false, reason:"not available yet"}
    };
  }
  function customDefaults(){
    var a=customActs();
    return {drill:true, match:a.match.ok, build:a.build.ok, words:a.words.ok, phrases:false, useAim:!!aimedGame()};
  }
  function openCustom(){ if(!customCfg)customCfg=customDefaults(); customEl.classList.remove("hidden"); renderCustom(); }
  function closeCustom(silent){ customEl.classList.add("hidden"); if(!silent)render(); }
  function cxToggle(key,label,avail,sub){
    var ok=!!(avail&&avail.ok), on=ok&&!!customCfg[key];
    var subtxt=ok?(sub||""):(avail&&avail.reason?t(avail.reason):"");
    return '<button class="cx-toggle'+(on?" on":"")+(ok?"":" off")+'" data-cx="'+key+'"'+(ok?"":" disabled")+'>'+
      '<span class="cx-main"><span class="cx-label">'+label+'</span>'+(subtxt?'<span class="cx-sub">'+subtxt+'</span>':'')+'</span>'+
      '<span class="cx-pill'+(on?" on":"")+(ok?"":" lock")+'">'+(ok?(on?"✓":""):"🔒")+'</span></button>';
  }
  function cxSeg(kind,label,on){ return '<button class="seg'+(on?" on":"")+'" data-cxseg="'+kind+'">'+label+'</button>'; }
  function renderCustom(){
    var lang=getLang(), a=customActs(), g=aimedGame(), k=ensureKana(), h="";
    h+='<div class="d-sticky"><div class="d-head"><button class="d-close" id="cxClose">✕ '+t("Back")+'</button><span class="cx-title mincho">'+t("Custom exercise")+'</span></div></div>';
    h+='<div class="cx-intro">'+t("Build your own mix — pick what goes in.")+'</div>';
    h+='<div class="ex-sep">'+t("Activities")+'</div><div class="cx-list">'+
       cxToggle("drill",t("Kana drill"),a.drill)+
       cxToggle("match",t("Match"),a.match)+
       cxToggle("build",t("Build the word"),a.build)+
       cxToggle("words",t("Words"),a.words)+
       cxToggle("phrases",t("Phrases"),a.phrases)+
       cxToggle("kanji","Kanji",a.kanji)+'</div>';
    if(customCfg.drill){
      h+='<div class="ex-sep">'+t("Kana script")+'</div><div class="opt-row">'+
         cxSeg("hira","Hiragana",k.scope.hira)+cxSeg("hdak","+ ゛(あ)",k.scope.hdak)+cxSeg("hyoon","+ ゃ(あ)",k.scope.hyoon)+
         cxSeg("kata","Katakana",k.scope.kata)+cxSeg("kdak","+ ゛(ア)",k.scope.kdak)+cxSeg("kyoon","+ ゃ(ア)",k.scope.kyoon)+'</div>';
    }
    h+='<div class="ex-sep">'+t("Focus on a game")+'</div>';
    if(g){ h+=cxToggle("useAim","🎯 "+(g.name&&g.name[lang]?g.name[lang]:g.id),{ok:true},t("biases new words toward this game")); }
    else { h+='<div class="cx-toggle off"><span class="cx-main"><span class="cx-label">🎯 '+t("Focus on a game")+'</span><span class="cx-sub">'+t("aim at a game first")+'</span></span><span class="cx-pill lock">🔒</span></div>'; }
    var chosen=["drill","match","build","words","phrases"].filter(function(ty){return customCfg[ty]&&a[ty].ok;});
    var canStart=chosen.length>0;
    h+='<button class="start-btn cx-start'+(canStart?"":" disabled")+'" id="cxStart"'+(canStart?"":" disabled")+'>'+t("Start")+' →</button>';
    if(!canStart)h+='<div class="cx-note">'+t("Pick at least one activity.")+'</div>';
    customInner.innerHTML=h; bindCustom();
  }
  function bindCustom(){
    var c=document.getElementById("cxClose"); if(c)c.addEventListener("click",function(){ closeCustom(); });
    customInner.querySelectorAll("[data-cx]").forEach(function(b){ if(b.disabled)return;
      b.addEventListener("click",function(){ var key=b.getAttribute("data-cx"); customCfg[key]=!customCfg[key]; renderCustom(); }); });
    customInner.querySelectorAll("[data-cxseg]").forEach(function(b){
      b.addEventListener("click",function(){ setSeg(b.getAttribute("data-cxseg"),1); renderCustom(); }); });
    var s=document.getElementById("cxStart"); if(s&&!s.disabled)s.addEventListener("click",startCustom);
  }
  function startCustom(){
    var a=customActs();
    var types=["drill","match","build","words","phrases"].filter(function(ty){ return customCfg[ty]&&a[ty]&&a[ty].ok; });
    if(!types.length)return;
    ensureKana();
    csess={active:true,cur:null,last:null,types:types,useAim:!!(customCfg.useAim&&aimedGame())};
    closeCustom(true);
    customNextUnit();
  }
  function customPick(types){
    if(csess.last && types.length>1){ var f=types.filter(function(x){return x!==csess.last;}); if(f.length)types=f; }
    var pick=types[Math.floor(Math.random()*types.length)]; csess.last=pick; return pick;
  }
  function customNextUnit(){
    if(!csess)return;
    var a=customActs();
    var types=csess.types.filter(function(ty){ return a[ty]&&a[ty].ok; });
    if(!types.length){ customEnd(); return; }
    var type=customPick(types); csess.cur=type;
    if(type==="drill"){
      readingEl.classList.add("hidden");
      if(!sess) sess={done:0,correct:0,wrong:0,q:null,hitGoalShown:false,newCount:0,maxNew:5,mode:"quiz",teach:null,force:null};
      buildQuestion(); drillEl.classList.remove("hidden"); renderDrill();
    }else if(type==="match"){
      drillEl.classList.add("hidden");
      if(!msess) msess={done:0,boards:0,wrong:0};
      matchDeal(); readingEl.classList.remove("hidden"); renderMatch();
    }else if(type==="build"){
      drillEl.classList.add("hidden");
      if(!bsess) bsess={done:0,correct:0,wrong:0,q:null};
      buildNextQ(); readingEl.classList.remove("hidden"); renderBuild();
    }else if(type==="words"){
      drillEl.classList.add("hidden");
      if(!rsess || rsess.pool!==WORD_POOL){ startQuiz(WORD_POOL, ensureWords(), true); }
      else { buildReadingQ(); readingEl.classList.remove("hidden"); renderReading(); }
    }else if(type==="phrases"){
      drillEl.classList.add("hidden");
      if(!rsess || rsess.pool!==PHRASES){ startQuiz(PHRASES, ensurePhrases(), true); }
      if(rsess && rsess.pool===PHRASES && maybePattern()) return;   // teach / construir / cloze también acá
      buildReadingQ(); readingEl.classList.remove("hidden"); renderReading();
    }
  }
  function customAfterUnit(){ if(!csess)return; customNextUnit(); }
  function customEnd(){ csess=null; sess=null; bsess=null; msess=null; rsess=null; pbsess=null;
    drillEl.classList.add("hidden"); readingEl.classList.add("hidden");
    try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){} render(); }

  function startFocusDrill(romaji, script) {
    var k = ensureKana();
    // Reiniciamos la sesión
    sess = {
      done: 0, correct: 0, wrong: 0, q: null, hitGoalShown: false, 
      newCount: 0, maxNew: 5, mode: "teach", teach: null, force: null
    };

    // Forzamos la sesión a enseñar este carácter específico en su alfabeto
    sess.teach = { script: script, romaji: romaji };
    
    // Mostramos la pantalla de práctica
    drillEl.classList.remove("hidden");
    renderDrill();
    
    // Reproducimos el sonido si está disponible
    setTimeout(function(){ 
      if(sess.mode==="teach" && !sess.teach.intro) speak(glyph(romaji, script)); 
    }, 320);
  }

  function bindMain(){
    app.querySelectorAll("[data-fn]").forEach(function(b){var fn=b.getAttribute("data-fn");b.addEventListener("click",function(){if(fn==="startDrill")startDrill();else if(fn==="startDaily")startDaily();else if(fn==="startWords")startWords();else if(fn==="startPhrases")startPhrases();else if(fn==="startBuild")startBuild();else if(fn==="startMatch")startMatch();else if(fn==="openCustom")openCustom();else if(fn==="startKanji")startKanji();else if(fn==="activateKanji")activateKanji();else if(fn==="activatePhrases")activatePhrases();});});

    var wd=app.querySelector(".wotd[data-say]"); if(wd)wd.addEventListener("click",function(){speak(wd.getAttribute("data-say"));});
    app.querySelectorAll("[data-aim]").forEach(function(b){ b.addEventListener("click",function(){ setAim(b.getAttribute("data-aim")); }); });
    app.querySelectorAll("[data-ficha]").forEach(function(b){ b.addEventListener("click",function(){ openFicha(b.getAttribute("data-ficha")); }); });

    // Conectar los botones de "Enfócate en" para lanzar el entrenamiento
    app.querySelectorAll(".focus-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        startFocusDrill(btn.getAttribute("data-r"), btn.getAttribute("data-s"));
      });
    });
    var fa=app.querySelector("#focusAll"); if(fa)fa.addEventListener("click",function(){startWeakDrill(fa.getAttribute("data-s"));});

    app.querySelectorAll(".box").forEach(function(b){
      b.addEventListener("click",function(){toggle(b.getAttribute("data-id"));});
      b.addEventListener("keydown",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle(b.getAttribute("data-id"));}});
    });
    var sd=document.getElementById("startDrill"); if(sd)sd.addEventListener("click",startDrill);
    var stn=document.getElementById("stNext"); if(stn)stn.addEventListener("click",advanceStage);
    var stb=document.getElementById("stBack"); if(stb)stb.addEventListener("click",retreatStage);
    app.querySelectorAll(".seg").forEach(function(s){
      s.addEventListener("click",function(){setSeg(s.getAttribute("data-seg"),parseInt(s.getAttribute("data-val"),10));});
    });
    app.querySelectorAll(".lseg").forEach(function(b){b.addEventListener("click",function(){setLang(b.getAttribute("data-lang"));});});

    app.querySelectorAll(".fseg").forEach(function(b){b.addEventListener("click",function(){setFont(b.getAttribute("data-font"));});});

    app.querySelectorAll(".tseg").forEach(function(b){b.addEventListener("click",function(){setTheme(b.getAttribute("data-theme"));});});

    var lu=document.getElementById("lvUp"); if(lu)lu.addEventListener("click",levelUp);
    var ln=document.getElementById("lvNo"); if(ln)ln.addEventListener("click",declineLevel);
    var si=document.getElementById("scriptInfo");
    if(si)si.addEventListener("click",function(){var hp=document.getElementById("scriptHelp");if(hp)hp.hidden=!hp.hidden;});
    var kob=document.getElementById("kanaOptsBtn");
    if(kob)kob.addEventListener("click",function(e){e.stopPropagation();var p=document.getElementById("kanaOptsPanel");if(p){p.hidden=!p.hidden;kob.setAttribute("aria-expanded",p.hidden?"false":"true");}});
    var kex=app.querySelector(".ex-kana");
    if(kex)kex.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target===kex){e.preventDefault();startDrill();}});
    var cb=document.getElementById("copyBtn"); if(cb)cb.addEventListener("click",function(){copyText(encodeState(state),document.getElementById("copyStatus"));});
    var ib=document.getElementById("importBtn"); if(ib)ib.addEventListener("click",function(){
      var st=document.getElementById("importStatus"),raw=document.getElementById("importBox").value;
      try{state=mergeStates(state,decodeCode(raw));Persistence.save(state);render();flash(document.getElementById("importStatus"),t("Imported and merged ✓"),"ok");}
      catch(err){flash(st,err.message||t("Couldn't read that code."),"err");}
    });
  }
  function bindDrill(){
    var c=document.getElementById("dClose"); if(c)c.addEventListener("click",closeDrill);
    var dg=document.getElementById("dGear"); if(dg)dg.addEventListener("click",openSheet);
    var tg=document.getElementById("tGot"); if(tg)tg.addEventListener("click",gotIt);
    var tsp=document.getElementById("tSpk"); if(tsp)tsp.addEventListener("click",function(){ if(sess.teach)speak(glyph(sess.teach.romaji,sess.teach.script)); });
    var tspb=document.getElementById("tSpkBase"); if(tspb)tspb.addEventListener("click",function(){ if(sess.teach){var dv=DEVOICE[sess.teach.romaji]; if(dv)speak(glyph(dv[0],sess.teach.script));} });
    var n=document.getElementById("dNext"); if(n)n.addEventListener("click",nextQuestion);
    var s=document.getElementById("dSkip"); if(s)s.addEventListener("click",function(){buildQuestion();renderDrill();});
    var sp=document.getElementById("dSpk"); if(sp)sp.addEventListener("click",function(){speak(glyph(sess.q.target,sess.q.script));});
    var spw=document.getElementById("dSpkWord"); if(spw)spw.addEventListener("click",function(){ if(sess.q.word)speakSweep(sess.q.word.w, drillInner.querySelector(".sweepline")); });
    if(sess.q && !sess.q.answered){
      drillInner.querySelectorAll(".opt").forEach(function(o){
        o.addEventListener("click",function(){answer(o.getAttribute("data-r"));});
      });
    }
  }

  document.getElementById("resetBtn").addEventListener("click",function(){
    if(!confirm(t("Reset everything — streak, days, drill progress, and today's checklist? This can't be undone."))) return;
    state=emptyState();Persistence.save(state);render();
  });
  function resetSection(keys,label){
    if(!confirm("¿Borrar el progreso de "+label+"? La racha y los días no se tocan. No se puede deshacer.")) return;
    if(state.exercises){ keys.forEach(function(k){ var sec=state.exercises[k]; if(!sec)return; var d=sec.daily; delete state.exercises[k]; if(d)state.exercises[k]={daily:d}; }); }
    Persistence.save(state); render();
  }
  var _rk=document.getElementById("resetKana"); if(_rk)_rk.addEventListener("click",function(){ resetSection(["kana"],"kana"); });
  var _rw=document.getElementById("resetWords"); if(_rw)_rw.addEventListener("click",function(){ resetSection(["words"],"palabras"); });
  var _rp=document.getElementById("resetPhrases"); if(_rp)_rp.addEventListener("click",function(){ resetSection(["phrases","patterns"],"frases y gramática"); });

  (function boot(){
    var loaded=Persistence.boot();
    state=loaded||emptyState();
    if(!loaded)Persistence.save(state);
    if(!state.lang){state.lang=detectLang();Persistence.save(state);}
    try{seedKnownFromBuild();}catch(e){}
    render();
  })();
})();
</script>
