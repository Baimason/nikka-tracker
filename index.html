<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日課">
<meta name="theme-color" content="#e4ddcc">
<title>日課 — Japanese Daily Tracker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><rect width='100' height='100' fill='%23e4ddcc'/><rect x='8' y='8' width='84' height='84' rx='6' fill='none' stroke='%23b23726' stroke-width='5'/><rect x='16' y='16' width='68' height='68' rx='3' fill='none' stroke='%23b23726' stroke-width='2'/><text x='50' y='52' text-anchor='middle' dominant-baseline='central' font-size='50' fill='%23b23726' font-family='serif' font-weight='800'>済</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet"> <!-- Font con mejor lectura para los novatos del japones -->
<style>
  :root{
    --paper:#e4ddcc; --card:#f1ece0; --ink:#23201a; --ink-soft:#6b6456;
    --ink-faint:#a99f89; --shu:#b23726; --shu-deep:#8f2a1d; --green:#4f7a52;
    --grid:#d3cab6; --line:#d8d0bf; --gold:#8a7233;
    --shadow:var(--shadow); --box-hover:var(--box-hover); --bad-bg:var(--bad-bg);
    --display-font: "Shippori Mincho", Georgia, serif;
  }
  /* Modo oscuro: sólo redefine la paleta; el resto del CSS ya usa var(). */
  body.dark{
    --paper:#191510; --card:#241f18; --ink:#ece3d0; --ink-soft:#a79d88;
    --ink-faint:#6f6656; --shu:#d1543f; --shu-deep:#a3311f; --green:#7ba86e;
    --grid:#241f18; --line:#39332a; --gold:#c2a85e;
    --shadow:rgba(0,0,0,.5); --box-hover:rgba(236,227,208,.06); --bad-bg:#3a2521;
  }
  *{box-sizing:border-box}
  html,body{margin:0;touch-action:manipulation}
  body{
    background:linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
    color:var(--ink); font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    line-height:1.5;
    padding:0 calc(18px + env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto}
  .mincho { font-family: var(--display-font); }

  body.font-gothic {
    --display-font: "Noto Sans JP", system-ui, sans-serif;
  }

  header{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;z-index:30;
    background:var(--paper);border-bottom:2px solid var(--ink);padding:calc(20px + env(safe-area-inset-top,0px)) 0 14px;margin-bottom:22px}
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .title{display:flex;flex-direction:column;gap:2px;min-width:0}
  .title .kanji{font-family: var(--display-font);font-weight:800;font-size:44px;line-height:.95;letter-spacing:2px}
  .rom{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
  .streak-seal{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .streak-num{font-family: var(--display-font);font-weight:800;font-size:52px;line-height:1;color:var(--shu)}
  .streak-meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);max-width:78px}
  .streak-meta b{color:var(--ink);display:block;font-size:13px;letter-spacing:.05em}

  .phase{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .phase .wk{font-family: var(--display-font);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--shu);
    border:1.5px solid var(--shu);border-radius:2px;padding:2px 8px}
  .phase .focus{font-size:14px;color:var(--ink-soft)}
  .phase .focus b{color:var(--ink);font-weight:700}

  .wotd{display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid var(--shu);border-radius:2px;padding:3px 9px;cursor:pointer;color:var(--shu)}
  .wotd .wotd-em{font-size:15px}
  .wotd .wotd-jp{font-weight:700;font-size:15px;color:var(--ink)}
  .wotd .wotd-sub{font-size:11px;letter-spacing:.04em;color:var(--ink-soft)}
  .wotd.empty{font-size:15px;color:var(--ink-soft);border-color:var(--ink-soft);padding:3px 9px}
  .wotd{flex-shrink:0}

  .card{position:relative;background:var(--card);border:1.5px solid var(--ink);
    box-shadow:5px 5px 0 var(--shadow);padding:20px 20px 8px;margin-bottom:30px}
  .card h2{font-family: var(--display-font);font-weight:700;font-size:18px;margin:0 0 2px;letter-spacing:.02em}
  .card .date{font-size:12px;color:var(--ink-soft);margin-bottom:14px}

  .task{display:flex;align-items:flex-start;gap:13px;padding:13px 2px;border-top:1px solid var(--line)}
  .task:first-of-type{border-top:none}
  .box{flex:none;width:26px;height:26px;margin-top:1px;border:1.8px solid var(--ink);border-radius:3px;
    background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s;font-family: var(--display-font);color:#fff;font-size:17px}
  .box:hover{background:var(--box-hover)}
  .box.on{background:var(--ink)}
  .box.sacred{border-color:var(--shu)}
  .box.sacred.on{background:var(--shu)}
  .t-body{flex:1;min-width:0}
  .t-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .t-label{font-weight:700;font-size:15px}
  .task.done .t-label{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--shu)}
  .badge{font-family: var(--display-font);font-size:10px;letter-spacing:.12em;color:var(--shu);
    border:1px solid var(--shu);border-radius:2px;padding:1px 5px;white-space:nowrap}
  .t-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .chip{display:inline-flex;align-items:center;gap:5px;margin-top:7px;margin-right:6px;
    font-size:12px;font-weight:500;color:var(--ink);text-decoration:none;
    border:1.3px solid var(--ink);border-radius:2px;padding:3px 9px;background:var(--paper);transition:transform .1s,background .15s;cursor:pointer}
  .chip:hover{background:var(--ink);color:var(--card);transform:translateY(-1px)}
  .chip .arr{font-size:11px}

  .note{font-size:12.5px;color:var(--ink-soft);padding:12px 2px 16px;border-top:1px dashed var(--line);margin-top:4px}
  .note b{color:var(--shu)}

  .seal{position:absolute;top:-14px;right:-12px;width:66px;height:66px;
    display:flex;align-items:center;justify-content:center;pointer-events:none;
    opacity:0;transform:scale(.4) rotate(-18deg)}
  .seal.show{opacity:1;transform:scale(1) rotate(-9deg);
    transition:opacity .18s, transform .28s cubic-bezier(.2,1.5,.4,1)}
  .seal svg{width:100%;height:100%;filter:drop-shadow(1px 1px 0 rgba(143,42,29,.25))}

  .sec-h{font-family: var(--display-font);font-weight:700;font-size:13px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px;display:flex;align-items:center;gap:10px}
  .sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

  /* drill entry card */
  .drill-card{position:relative;background:var(--card);border:1.5px solid var(--ink);
    box-shadow:5px 5px 0 var(--shadow);padding:18px 20px;margin-bottom:30px}
  .drill-card .dc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .drill-card h3{font-family: var(--display-font);font-weight:700;font-size:17px;margin:0}
  .drill-card .dc-count{font-family: var(--display-font);font-size:15px;color:var(--shu);font-weight:700}
  .prog.milestones{position:relative;overflow:visible}
  .prog .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-faint);transform:translateX(-1px);opacity:.5}
  .prog .tick.on{background:var(--ink);opacity:1}

  .prog .tick.hit{background:transparent;opacity:1}
  .prog .tick-seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;line-height:16px;text-align:center;
    font-family:var(--display-font);font-weight:800;font-size:12px;color:var(--shu);
    background:var(--card);border:1.5px solid var(--shu);border-radius:3px;
    box-shadow:1px 1px 0 rgba(143,42,29,.25);z-index:2}
  .prog .tick-seal.pop{animation:tickpop .3s ease-out}
  .prog .tick-seal.final{width:24px;height:24px;line-height:20px;font-size:15px;border-width:2px;
    box-shadow:1.5px 1.5px 0 rgba(143,42,29,.3)}
  @keyframes tickpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
    60%{transform:translate(-50%,-50%) scale(1.15)}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){ .prog .tick-seal.pop{animation:none} }

  .drill-card .dc-count .tier{color:var(--green)}
  .prog{height:9px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 0 6px}
  .prog > i{display:block;height:100%;background:var(--shu);width:0;transition:width .3s}
  .prog > i.g{background:var(--green)}
  .dc-sub{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
  .start-btn{width:100%;font:inherit;font-weight:700;font-size:15px;color:var(--card);background:var(--ink);
    border:none;border-radius:3px;padding:13px;cursor:pointer}
  .start-btn:active{transform:translateY(1px)}
  .start-btn.done-today{background:var(--green)}
  details.opts{margin-top:12px}
  details.opts summary{list-style:none;cursor:pointer;font-size:12px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.1em;font-weight:700}
  details.opts summary::-webkit-details-marker{display:none}
  .opt-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
  .opt-row .k{font-size:11px;color:var(--ink-soft);width:44px;text-transform:uppercase;letter-spacing:.08em}
  .seg{font:inherit;font-size:12px;font-weight:600;border:1.3px solid var(--line);background:var(--paper);
    color:var(--ink-soft);border-radius:2px;padding:4px 10px;cursor:pointer}
  .seg.on{border-color:var(--ink);color:var(--ink);background:var(--card)}

  .road{display:flex;flex-direction:column;gap:0;margin-bottom:32px}
  .stop{display:flex;gap:14px;align-items:flex-start}
  .stop .rail{display:flex;flex-direction:column;align-items:center;flex:none;width:22px}
  .stop .dot{width:13px;height:13px;border:2px solid var(--ink-faint);background:var(--paper);border-radius:50%;margin-top:4px}
  .stop .bar{width:2px;flex:1;background:var(--line);min-height:26px}
  .stop:last-child .bar{display:none}
  .stop .rt{padding-bottom:20px}
  .stop .rt .lbl{font-weight:700;font-size:14.5px}
  .stop .rt .ds{font-size:12.5px;color:var(--ink-soft)}
  .stop.on .dot{border-color:var(--shu);background:var(--shu);box-shadow:0 0 0 4px rgba(178,55,38,.15)}
  .stop.on .rt .lbl{color:var(--shu)}
  .stop.done .dot{border-color:var(--ink);background:var(--ink)}

  /* Estilos base para el calendario */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
  .cell{aspect-ratio:1;border:1px solid var(--grid);background:var(--card);
    display:flex;align-items:center;justify-content:center;position:relative;border-radius:2px}
  .cell.pre{background:transparent;border-color:transparent}
  .cell.today{border:1.8px solid var(--ink)}
  
 /* Mejor legibilidad para las fechas */
  .cell .num{
    position:absolute; top:6px; left:8px; 
    font-size:18px; /* ¡Casi el doble de grande! */
    font-weight:800; /* Negrita al máximo */
    color:var(--ink); /* Negro sólido */
    font-family: var(--display-font); z-index: 3;
    line-height: 1; letter-spacing: -0.02em;
  }
    
  /* Niveles de recompensa (Sellos) */
  .cell .mini{font-family: var(--display-font);font-weight:800;color:var(--shu);line-height:1;}
  
  /* Nivel Básico (1-29) */
  .cell .mini.lvl-1{font-size:15px; transform:rotate(-8deg)}
  
  /* Nivel Intermedio (30-49) */
  .cell .mini.lvl-2{font-size:22px; transform:rotate(-5deg)}
  
  /* Nivel Avanzado (50-99) */
  .cell .mini.lvl-3{width: 75%; height: 75%; display: flex; align-items: center; justify-content: center;}
  .cell .mini.lvl-3 svg{width:100%; height:100%;}
  
  /* Nivel Épico (100+) */
  .cell .mini.lvl-4{width: 95%; height: 95%; display: flex; align-items: center; justify-content: center; transform:rotate(-12deg); z-index: 2;}
  .cell .mini.lvl-4 svg{width:100%; height:100%; filter:drop-shadow(2px 2px 0 rgba(143,42,29,.3))}

  .cal-cap{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-bottom:30px}

  /* Comportamiento dinámico del sello principal de la tarjeta */
  .seal.show.lvl-1 { font-size: 32px; color: var(--shu); font-weight: 800; transform: scale(1) rotate(-8deg); }
  .seal.show.lvl-2 { font-size: 46px; color: var(--shu); font-weight: 800; transform: scale(1) rotate(-5deg); }
  .seal.show.lvl-3 { transform: scale(1); }
  .seal.show.lvl-4 { transform: scale(1.15) rotate(-15deg); }
  .seal.show.lvl-4 svg { filter: drop-shadow(2px 2px 0 rgba(143,42,29,.3)); }

  .res{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .res a{font-size:12.5px;color:var(--ink);text-decoration:none;border:1.3px solid var(--line);
    border-radius:2px;padding:6px 11px;background:var(--card);transition:border-color .15s,transform .1s}
  .res a:hover{border-color:var(--ink);transform:translateY(-1px)}
  .res a span{color:var(--ink-soft)}

  details.panel{border:1.5px dashed var(--line);background:var(--card);padding:0 16px;margin-bottom:26px}
  details.panel summary{list-style:none;cursor:pointer;padding:14px 0;font-family: var(--display-font);
    font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:space-between}
  details.panel summary::-webkit-details-marker{display:none}
  details.panel summary .caret{transition:transform .2s}
  details.panel[open] summary .caret{transform:rotate(90deg)}
  .row{padding:14px 0;border-top:1px solid var(--line)}
  .row label{display:block;font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--ink)}
  .row .hint{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  textarea.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:8px;resize:vertical;
    min-height:54px;word-break:break-all;line-height:1.4}
  .btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--card);background:var(--ink);border:none;
    border-radius:2px;padding:8px 15px;cursor:pointer;margin-top:9px}
  .btn.alt{background:var(--paper);color:var(--ink);border:1.3px solid var(--ink)}
  .btn:active{transform:translateY(1px)}
  .status{font-size:12px;margin-top:8px;min-height:15px}
  .status.ok{color:var(--gold)} .status.err{color:var(--shu)}
  .soon{display:flex;align-items:center;justify-content:space-between;opacity:.6}
  .soon .st{font-weight:700;font-size:13.5px}
  .soon .tag{font-family: var(--display-font);font-size:10px;letter-spacing:.12em;border:1px solid var(--ink-faint);
    color:var(--ink-soft);border-radius:2px;padding:2px 7px;white-space:nowrap}
  .soon .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}

  footer{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;
    align-items:center;font-size:11.5px;color:var(--ink-faint);flex-wrap:wrap;gap:8px}
  .reset{background:none;border:none;color:var(--ink-faint);font:inherit;font-size:11.5px;cursor:pointer;
    text-decoration:underline;padding:0}
  .reset:hover{color:var(--shu)}
  .reset-row{display:flex;gap:14px;justify-content:center;margin-bottom:2px}
  .loading{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px}
  .saveerr{display:none;background:var(--shu);color:#fff;font-size:12px;padding:6px 12px;border-radius:2px;margin-bottom:16px}

  /* ---- drill overlay ---- */
  .drill{position:fixed;inset:0;z-index:60;overflow-y:auto;overscroll-behavior:contain;min-height:100%;
    background:linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
    padding:calc(20px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));display:flex;flex-direction:column}
  .drill.hidden{display:none}
  .drill-inner{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
  .reading{position:fixed;inset:0;z-index:60;overflow-y:auto;overscroll-behavior:contain;min-height:100%;background:linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px, var(--paper);padding:calc(20px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));display:flex;flex-direction:column}
  .reading.hidden{display:none}
  .ex-custom-btn{width:100%;font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:var(--card);border:1.3px solid var(--ink);border-radius:3px;padding:11px 14px;margin-top:12px;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
  .ex-custom-btn:active{transform:translateY(1px)}
  .custom{position:fixed;inset:0;z-index:61;overflow-y:auto;background:linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px, var(--paper);padding:calc(20px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));display:flex;flex-direction:column}
  .custom.hidden{display:none}
  .custom-inner{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
  .cx-title{font-size:17px;font-weight:700;color:var(--ink)}
  .cx-intro{font-size:13px;color:var(--ink-soft);margin:2px 0}
  .cx-list{display:flex;flex-direction:column;gap:7px}
  .cx-toggle{width:100%;text-align:left;font:inherit;background:var(--paper);border:1.3px solid var(--line);border-radius:3px;padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cx-toggle.on{border-color:var(--ink)}
  .cx-toggle.off{opacity:.55;cursor:default}
  .cx-main{display:flex;flex-direction:column;gap:2px;min-width:0}
  .cx-label{font-weight:700;font-size:14px;color:var(--ink)}
  .cx-sub{font-size:11px;color:var(--ink-soft)}
  .cx-pill{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--card);font-weight:700}
  .cx-pill.on{background:var(--green);border-color:var(--green)}
  .cx-pill.lock{border:none;background:none;font-size:14px}
  .cx-start{margin-top:16px}
  .cx-start.disabled{opacity:.5;cursor:default}
  .cx-note{font-size:12px;color:var(--shu);text-align:center;margin-top:8px}
  .reading-inner{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
  .r-count{font-size:13px;color:var(--ink-soft);font-weight:700}
  .read-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0;min-height:200px}
  .read-level{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--shu);font-weight:700;margin-bottom:16px}
  .read-jp{font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.35;color:var(--ink);max-width:92%}
  .read-romaji{font-size:16px;color:var(--ink-soft);margin-top:18px;font-style:italic}
  .read-trans{font-family: var(--display-font);font-weight:700;font-size:22px;color:var(--green);margin-top:10px}

  .emoji-toggle{align-self:center;margin-top:12px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);background:none;border:1.2px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer}
  .rq-emoji{font-size:22px}
  .rq-mean{gap:6px}
  .stg-badge{margin-left:auto;align-self:center;font-family: var(--display-font);font-weight:800;font-size:13px;color:var(--ink-soft);border:1.2px solid var(--line);border-radius:20px;padding:2px 10px;white-space:nowrap}

  /* Convertimos los caracteres débiles en botones interactivos */
  button.wk-g {
    cursor: pointer;
    transition: transform 0.1s, border-color 0.15s, color 0.15s;
    font-family: var(--display-font);
  }
  button.wk-g:hover {
    transform: translateY(-2px);
    border-color: var(--shu);
    color: var(--shu);
  }

  /* --- Build the word + Match --- */
  .bw-rom{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--ink-soft);margin-top:8px;min-height:20px}
  .bw-rom.hide{visibility:hidden}
  .bw-slots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
  .bw-slot{min-width:42px;height:52px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--ink);border-bottom:2.5px solid var(--line)}
  .bw-slot.active{border-bottom-color:var(--shu)}
  .bw-slot.blank{color:var(--ink-faint)}
  .bw-slot.filled{border-bottom-color:var(--green)}
  .bw-slot.filled.corr{border-bottom-color:var(--shu);color:var(--shu)}
  .bw-slot.blank.correct{color:var(--green);border-bottom-color:var(--green)}
  .bw-slot.blank.bad{color:var(--shu);border-bottom-color:var(--shu)}
  .bw-grid{margin-top:14px}
  /* phrase first-contact card: phrases are longer than single words */
  .rq-jp.rq-jp-ph{font-size:clamp(30px,8vw,44px);line-height:1.25}

  .pb-slot{min-width:44px;min-height:48px;padding:6px 12px;display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--ink);border-bottom:2.5px solid var(--line)}
  .pb-slot.filled{border-bottom-color:var(--ink)}
  .pb-slot.active{border-bottom-color:var(--shu)}
  .pb-slot.empty{color:var(--ink-faint)}
  .pb-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:16px}
  .pb-tile{font:inherit;font-size:21px;color:var(--ink);background:var(--card);border:1.6px solid var(--ink);
    border-radius:4px;padding:11px 16px;cursor:pointer;transition:transform .08s,background .12s}
  .pb-tile:active{transform:scale(.96)}
  .pb-tile.used{opacity:.32;pointer-events:none}
  .pb-tile.bad{background:var(--bad-bg);border-color:var(--shu);color:var(--shu)}
  .bw-toggle{display:block;margin:14px auto 0;background:none;border:1.3px solid var(--line);border-radius:20px;padding:7px 16px;font:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer}
  .rd-toggles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:14px}
  .rd-toggles .bw-toggle,.rd-toggles .emoji-toggle{margin:0}
  .mt-sub{font-size:11px;color:var(--ink-soft);text-align:center;margin:2px 0 0;letter-spacing:.06em;text-transform:uppercase}
  .mt-board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .mt-col{display:flex;flex-direction:column;gap:9px}
  .mt-tile{aspect-ratio:auto;height:52px;font-size:26px}
  .mt-tile.rom{font-size:19px}
  .mt-tile.sel{background:var(--ink);border-color:var(--ink);color:var(--card)}
  .mt-tile.done{background:rgba(79,122,82,.07);border-color:rgba(79,122,82,.5);color:var(--green);pointer-events:none}
  .pt-card{padding:4px 0 2px}
  .pt-kind{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--shu);margin-bottom:14px}
  .pt-particle{border:1px dashed var(--line);border-radius:2px;padding:12px;margin-bottom:14px;background:var(--paper)}
  .pt-pg{display:flex;align-items:baseline;gap:12px}
  .pt-glyph{font-size:40px;font-weight:800;color:var(--ink);line-height:1}
  .pt-read{font-size:14px;color:var(--ink-soft)}
  .pt-fn{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:6px}
  .pt-mold{background:var(--paper);border:1px dashed var(--line);border-radius:2px;padding:14px 10px;text-align:center;font-size:22px;line-height:1.4}
  .pt-mold .pt-slot{color:var(--ink-soft);font-size:17px}
  .pt-mold .pt-fix{color:var(--shu);font-weight:800}
  .pt-gloss{font-family:var(--display-font);font-weight:700;font-size:18px;color:var(--ink);text-align:center;margin:14px 0 4px}
  .pt-exlabel{font-size:12px;color:var(--ink-soft);margin:16px 0 8px}
  .pt-ex{display:flex;flex-direction:column;gap:9px}
  .pt-exrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .pt-exrow .mincho{font-size:22px;color:var(--ink)}
  .pt-hi{color:var(--shu);font-weight:700}
  .pt-spk{background:none;border:1.5px solid var(--shu);color:var(--shu);border-radius:2px;min-width:38px;height:38px;font-size:15px;cursor:pointer;flex:0 0 auto;line-height:1}
  .pt-spk.sm{min-width:32px;height:32px;font-size:13px}
  .pt-mold-row{display:flex;align-items:center;gap:10px}
  .pt-mold-row .pt-mold{flex:1 1 auto}
  .pt-exrow{align-items:center}
  .pt-extext{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .gb-goal{text-align:center;font-size:20px;color:var(--ink);font-weight:600;margin:14px 0 4px}
  .gb-sub{text-align:center;font-size:12px;color:var(--ink-faint);margin-bottom:18px}
  .gb-slot{min-height:64px;border:1.5px dashed var(--shu);border-radius:2px;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;flex-wrap:wrap}
  .gb-placed{font-family:var(--display-font);font-size:26px;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;padding:4px 12px}
  .gb-placed.pt{color:var(--shu);border-color:var(--shu)}
  .gb-caret{width:2px;height:30px;background:var(--ink-faint)}
  .gb-tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .gb-tile{font-family:var(--display-font);font-size:24px;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:2px;padding:10px 16px;cursor:pointer}
  .gb-tile.pt{color:var(--shu);border-color:var(--shu)}
  .gb-tile.used{opacity:.22;pointer-events:none}
  .gb-tile.bad{animation:gbshake .3s;border-color:var(--shu);background:var(--shu);color:#fff}
  @keyframes gbshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .sg-card{padding:4px 0 2px}
  .sg-title{font-weight:800;font-size:22px;color:var(--ink);margin-bottom:14px;line-height:1.3}
  .sg-p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0 0 12px}
  .sg-demo{background:var(--paper);border:1px dashed var(--line);border-radius:2px;padding:14px 10px;margin:12px 0;text-align:center}

  .sg-jp{font-size:28px;color:var(--ink)}
  .sg-cut{font-size:24px;color:var(--ink)}
  .sg-bar{color:var(--ink-faint);margin:0 3px}

  .pt-clmean{text-align:center;font-size:14px;color:var(--ink-soft);margin:10px 0 18px}
  .pt-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

  .pt-opt.bad{background:var(--shu);color:#fff;border-color:var(--shu)}

  .pt-fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;font-size:14px;color:var(--ink-soft);text-align:center}

  /* ---- Sweep: ilumina la mora que suena (aditivo, solo kana) ---- */
  .sweepline .mora{display:inline;transition:color .1s ease, text-shadow .1s ease}
  .sweepline .mora.lit{color:var(--shu);text-shadow:0 0 12px rgba(178,55,38,.5)}
  body.dark .sweepline .mora.lit{text-shadow:0 0 12px rgba(209,84,63,.55)}

  .sweepline rt .mora.lit{text-shadow:0 0 8px rgba(178,55,38,.9)}
  body.dark .sweepline rt .mora.lit{text-shadow:0 0 8px rgba(209,84,63,.95)}

  .d-head-l{display:flex;align-items:center;gap:10px}
  .d-gear{background:none;border:none;font:inherit;font-size:17px;color:var(--ink-soft);
    cursor:pointer;line-height:1;padding:2px 2px}

    background:var(--card);border-top:2px solid var(--ink);border-radius:18px 18px 0 0;

  .ss-head{display:flex;justify-content:space-between;align-items:center}
  .ss-title{font-family:var(--display-font);font-weight:700;font-size:16px;color:var(--ink)}

  .ss-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .ss-lab{font-size:14px;font-weight:600;color:var(--ink)}
  .ss-sub{font-size:12px;color:var(--ink-soft);margin-top:1px}
  .ss-slider{display:flex;align-items:center;gap:10px}

  .n5-wrap{position:relative;margin:2px 0 20px;padding:20px 0 6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .n5-track{height:4px;background:var(--ink);opacity:.14;border-radius:2px;overflow:hidden}
  .n5-track i{display:block;height:100%;width:0;background:var(--shu);border-radius:2px;transition:width .6s ease}
  .n5-tip{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
    font-family:var(--display-font);font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--shu);
    opacity:0;transform:translateY(4px);transition:opacity .28s ease,transform .28s ease;pointer-events:none}
  .n5-wrap.show .n5-tip{opacity:1;transform:translateY(0)}

  function getLang(){return (state&&state.lang)?state.lang:detectLang();}
  function t(x){return getLang()==="es"?(TR[x]||x):x;}
  function tm(m){return getLang()==="es"?(MEANINGS_ES[m]||m):m;}

  /* Tokenize a kana string into reading UNITS (the honest reading is per-unit, not

  function readUnits(str){
    var out=[],i=0,n=str.length;
    while(i<n){
      var ch=str.charAt(i), nx=(i+1<n)?str.charAt(i+1):"";

      if(ch===CHOON_MARK){ out.push({kind:"choon",ch:ch}); i++; continue; }

      if(e){ out.push({kind:"base",romaji:e.romaji,script:e.script,ch:ch}); i++; continue; }

    var yoonReached=script==="kata"?(k.level>=6):(k.level>=3);

        '<div class="rt"><div class="lbl">'+t(n.lbl)+'</div><div class="ds">'+t(n.ds)+'</div></div>'+badge+'</div>';});
    html+='</div>';
    html+='<div class="sec-h mincho">'+t("Last 4 weeks")+'</div>'+calendarHTML()+n5BarHTML();
    html+='<div class="sec-h mincho">'+t("All resources")+'</div><div class="res">'+
      resLink(LINKS.hira,"Hiragana")+resLink(LINKS.kata,"Katakana")+resLink(LINKS.anki,t("Install Anki"))+
      resLink(LINKS.ankiweb,"AnkiWeb")+resLink(LINKS.kaishi,t("Kaishi deck"))+resLink(LINKS.taekim,t("Grammar (Tae Kim)"))+

  /* =========================================================================
     7. KANA DRILL ENGINE
     ========================================================================= */
  var drillEl=document.getElementById("drill"), drillInner=document.getElementById("drillInner");
  var sess=null; // in-memory session: {done,correct,wrong,q,hitGoalShown}

  function activePool(){
    var k=ensureKana(),keys=BASE_KEYS.slice();
    if(k.scope.dakuten)keys=keys.concat(DAK_KEYS);
    return keys;
  }
  function activeScripts(){var k=ensureKana();var a=[];if(k.scope.hira)a.push("hira");if(k.scope.kata)a.push("kata");if(!a.length)a.push("hira");return a;}
  function pickTarget(pool,exclude){
    var k=ensureKana(),ent=pool.filter(function(r){return r!==exclude;});
    var w=ent.map(function(r){return Math.max(1,6-(k.box[r]||0));});
    var sum=w.reduce(function(a,b){return a+b;},0),x=Math.random()*sum;
    for(var i=0;i<ent.length;i++){x-=w[i];if(x<=0)return ent[i];}
    return ent[ent.length-1];
  }
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function sample(pool,n,exclude){
    var c=pool.filter(function(r){return r!==exclude;}); shuffle(c); return c.slice(0,n);
  }
  function setupQuiz(target,script){
    var dir=Math.random()<0.5?"toRomaji":"toKana",distr=distractors(target,script,8),opts;
    if(dir==="toRomaji"){ opts=shuffle(distr.concat([target])).map(function(r){return {label:r,romaji:r,rom:true};}); }
    else { opts=shuffle(distr.concat([target])).map(function(r){return {label:glyph(r,script),romaji:r,rom:false};}); }
    sess.mode="quiz"; sess.teach=null;
    sess.q={target:target,dir:dir,script:script,opts:opts,answered:false,picked:null};
    if(dir==="toKana") setTimeout(function(){speak(glyph(target,script));},250);
  }
  /* --- Learning pace: only introduce new characters as you master current ones ---
     A character joins the "active pool" when taught and leaves it (freeing a slot
     for a new one) once its SRS box reaches PROMOTE_AT. New characters appear only
     while the pool has room — so you drill a small set to fluency before more
     arrive, instead of being flooded at the start. Raise LEARN_POOL for a faster
     ramp (~15% of the ~46 base kana ≈ 7) or lower it (3–4) for a gentler pace. */
  var LEARN_POOL=5;   // max characters actively being learned at once
  var PROMOTE_AT=3;   // SRS box (0–5) at which a char graduates out of the pool
  var WEAK_BIAS=0.5;  // share of reviews steered to characters still below box 4
  function learningPoolCount(){
    var n=0; activePairs().forEach(function(p){
      if(isLearned(p.script,p.romaji) && (boxFor(p.script)[p.romaji]||0)<PROMOTE_AT) n++;
    }); return n;
  }

  /* --- Cross-day SRS: each learned character carries a next-review date --- */
  var SRS_IV=[0,1,2,4,7,14];   // days until next review, indexed by SRS box (0–5)
  function schedKey(sc,r){ return learnedKey(sc,r); }
  function getDue(sc,r){ var k=ensureKana(); return k.due[schedKey(sc,r)]||null; }
  function setDue(sc,r,box){ var k=ensureKana(),iv=SRS_IV[Math.min(5,Math.max(0,box))]; var d=new Date(); d.setDate(d.getDate()+iv); k.due[schedKey(sc,r)]=fmt(d); }
  function isDue(sc,r){ var d=getDue(sc,r); return !d || d<=today(); }   // unscheduled => treat as due
  function dueCount(){ var n=0; activePairs().forEach(function(p){ if(isLearned(p.script,p.romaji)&&isDue(p.script,p.romaji))n++; }); return n; }

  /* --- Leeches: a character that keeps lapsing gets re-taught (mnemonic again) --- */
  var LEECH_AT=3;              // lapses before the teach card comes back
  function bumpLeech(sc,r){ var k=ensureKana(),kk=schedKey(sc,r); k.leech[kk]=(k.leech[kk]||0)+1; }
  function clearLeech(sc,r){ var k=ensureKana(); delete k.leech[schedKey(sc,r)]; }
  function dueLeech(){ var k=ensureKana(),best=null,bv=LEECH_AT-1; activePairs().forEach(function(p){ if(!isLearned(p.script,p.romaji))return; var v=k.leech[schedKey(p.script,p.romaji)]||0; if(v>bv){bv=v;best=p;} }); return best; }

  /* --- Confusable-aware distractors: bias the wrong options toward look-alikes --- */
  /* yōon confusables: same romaji keys work for both scripts. The real confusion when
     reading is the vowel inside a family (kya/kyu/kyo) plus the sh/ch/j mix. */
  var YOON_CONFUSE=[["kya","kyu","kyo"],["sha","shu","sho"],["cha","chu","cho"],["nya","nyu","nyo"],["hya","hyu","hyo"],["mya","myu","myo"],["rya","ryu","ryo"],["gya","gyu","gyo"],["ja","ju","jo"],["bya","byu","byo"],["pya","pyu","pyo"],["sha","cha","ja"],["shu","chu","ju"],["sho","cho","jo"]];
  var CONFUSE_GROUPS={
    hira:[["a","o"],["ki","sa","chi"],["nu","me"],["ne","re","wa"],["ru","ro"],["ha","ho","ma"],["ma","mo"],["i","ri"],["ta","na"],["su","mu"]].concat(YOON_CONFUSE),
    kata:[["shi","tsu","so","n"],["ku","ta","ke","ka"],["u","wa","ku","fu"],["no","me","nu"],["chi","te"],["ra","fu"],["ko","ro"],["a","ma"],["ha","ho"],["na","me"]].concat(YOON_CONFUSE)
  };
  var CONFUSE=(function(){ var out={hira:{},kata:{}}; ["hira","kata"].forEach(function(sc){ CONFUSE_GROUPS[sc].forEach(function(g){ g.forEach(function(r){ out[sc][r]=out[sc][r]||{}; g.forEach(function(o){ if(o!==r)out[sc][r][o]=1; }); }); }); }); return out; })();
  function distractors(target,script,n){
    var pool=poolForScript(script).filter(function(r){return r!==target && isLearned(script,r);});
    var conf=(CONFUSE[script]&&CONFUSE[script][target])?Object.keys(CONFUSE[script][target]):[];
    var confAvail=conf.filter(function(r){return pool.indexOf(r)>=0;}); shuffle(confAvail);
    var pick=confAvail.slice(0,Math.min(4,confAvail.length));
    var rest=pool.filter(function(r){return pick.indexOf(r)<0;}); shuffle(rest);
    return pick.concat(rest).slice(0,n);
  }

  function buildQuestion(){
    var k=ensureKana();
    // --- Focus drill: restrict the whole session to the weak set of one script ---
    if(sess.focusWeak){
      var _fs=sess.focusWeak,_fb=boxFor(_fs);
      var _fp=poolForScript(_fs).filter(function(r){return isLearned(_fs,r)&&(_fb[r]||0)<4;});
      if(_fp.length){
        var _flast=sess.q?sess.q.target:null;
        var _fc=_fp.filter(function(r){return r!==_flast;}); if(!_fc.length)_fc=_fp;
        var _fw=_fc.map(function(r){var b=_fb[r]||0;return (6-b)*(6-b);});
        var _fsum=_fw.reduce(function(a,b){return a+b;},0),_fx=Math.random()*_fsum,_fpick=_fc[_fc.length-1];
        for(var _fi=0;_fi<_fc.length;_fi++){_fx-=_fw[_fi];if(_fx<=0){_fpick=_fc[_fi];break;}}
        setupQuiz(_fpick,_fs); return;
      }
      sess.focusWeak=null; // all blockers cleared — drop back to the normal flow
    }
    if(sess.force){ var f=sess.force; sess.force=null; setupQuiz(f.romaji,f.script); return; }
    var relearn=dueLeech();
    if(relearn){ clearLeech(relearn.script,relearn.romaji); sess.mode="teach"; sess.teach={script:relearn.script,romaji:relearn.romaji,relearn:true}; sess.q=null;
      var rc=sess.teach; setTimeout(function(){ if(sess.mode==="teach")speak(glyph(rc.romaji,rc.script)); },320); return; }
    var pairs=activePairs(),unlearned=[],learnedG=[];
    pairs.forEach(function(p){ (isLearned(p.script,p.romaji)?learnedG:unlearned).push(p); });
    var canTeach=learningPoolCount()<LEARN_POOL;
    if(canTeach && !k.kataIntroSeen && unlearned.some(function(p){return p.script==="kata";})){
      sess.mode="teach"; sess.teach={intro:"kata"}; sess.q=null; return;
    }
    /* teach the yōon concept once, right before the first yōon character */
    if(canTeach && (k.scope.hyoon||k.scope.kyoon) && !k.yoonIntroSeen && unlearned.some(function(p){return isYoonRomaji(p.romaji);})){
      sess.mode="teach"; sess.teach={intro:"yoon"}; sess.q=null; return;
    }
    /* reading-rule cards, once hiragana yōon are learned (small-kana concept in place) */
    if(canTeach && k.level>=3 && !k.sokuonSeen && !unlearned.some(function(p){return p.script==="hira"&&isYoonRomaji(p.romaji);})){
      sess.mode="teach"; sess.teach={intro:"sokuon"}; sess.q=null; return;
    }
    if(canTeach && k.level>=3 && k.sokuonSeen && !k.choonSeen){
      sess.mode="teach"; sess.teach={intro:"choon"}; sess.q=null; return;
    }
    if(unlearned.length && canTeach){
      unlearned.sort(function(a,b){return teachOrder(a)-teachOrder(b);});
      var tier=teachOrder(unlearned[0]),tierItems=unlearned.filter(function(p){return teachOrder(p)===tier;});
      sess.mode="teach"; sess.teach=tierItems[Math.floor(Math.random()*tierItems.length)]; sess.q=null;
      var tc=sess.teach; setTimeout(function(){ if(sess.mode==="teach"&&!tc.intro)speak(glyph(tc.romaji,tc.script)); },320); return;
    }
    if(!learnedG.length){ sess.mode="teach"; sess.teach=(unlearned[0]||{script:"hira",romaji:BASE_KEYS[0]}); sess.q=null; return; }
    var lastT=sess.q?sess.q.target:null;
    // --- Weak-first bias: reserve a share of reviews for characters still below box 4,
    //     so the handful of blockers climb instead of being drowned out by mastered kana. ---
    var weakG=learnedG.filter(function(c){return (boxFor(c.script)[c.romaji]||0)<4 && c.romaji!==lastT;});
    if(weakG.length && Math.random()<WEAK_BIAS){
      var ww=weakG.map(function(c){var b=boxFor(c.script)[c.romaji]||0;return (6-b)*(6-b);});
      var wsum=ww.reduce(function(a,b){return a+b;},0),wx=Math.random()*wsum,wp=weakG[weakG.length-1];
      for(var wi=0;wi<weakG.length;wi++){wx-=ww[wi];if(wx<=0){wp=weakG[wi];break;}}
      setupQuiz(wp.romaji,wp.script); return;
    }
    var dueG=learnedG.filter(function(c){return isDue(c.script,c.romaji);}),reviewSet=dueG.length?dueG:learnedG;
    var cands=reviewSet.filter(function(c){return c.romaji!==lastT;}); if(!cands.length)cands=reviewSet;
    var w=cands.map(function(c){var b=boxFor(c.script);return Math.max(1,6-(b[c.romaji]||0));});
    var sum=w.reduce(function(a,b){return a+b;},0),x=Math.random()*sum,pick=cands[cands.length-1];
    for(var i=0;i<cands.length;i++){x-=w[i];if(x<=0){pick=cands[i];break;}}
    setupQuiz(pick.romaji,pick.script);
  }
  function speak(text){
    try{
      if(!window.speechSynthesis)return;
      var u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=.8;
      var vs=window.speechSynthesis.getVoices(); var jp=vs.filter(function(v){return /ja(-|_)?JP/i.test(v.lang);})[0];
      if(jp)u.voice=jp; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* =========================================================================
     SWEEP — ilumina la mora que suena mientras se reproduce el audio.
     Aditivo y honesto: solo actúa sobre kana (donde 1 mora ≈ 1 sonido).
     El barrido es un metrónomo (no sync real por letra: Web Speech no da
     eventos por mora en iOS), arranca idealmente en onstart y se apaga
     cuando el audio termina. Con el ajuste apagado, todo es idéntico a hoy.
     ========================================================================= */
  var KANA_SMALL="ゃゅょャュョ"; // yōon: se funden en la mora anterior (きゃ = 1 mora)
  function splitMora(kana){
    var units=[],i,ch;
    for(i=0;i<kana.length;i++){ ch=kana.charAt(i);
      if(KANA_SMALL.indexOf(ch)>=0 && units.length){ units[units.length-1]+=ch; }
      else units.push(ch);
    }
    return units; // orden lógico = orden de lectura (izq→der, sin shaping)
  }
  function isAllKana(s){ return !!s && /^[\u3040-\u30FF]+$/.test(s); }
  function sweepSpans(kana){
    var m=splitMora(kana),s="",i;
    for(i=0;i<m.length;i++) s+='<span class="mora">'+m[i]+'</span>';
    return '<span class="sweepline">'+s+'</span>';
  }
  /* Envuelve kana suelto (p. ej. la palabra-premio) en moras si el sweep está on */
  function sweepKanaHTML(kana){ return (getSweep()&&isAllKana(kana))? sweepSpans(kana) : kana; }
  /* Respeta la capa de kanji: solo barre cuando la forma visible ES kana puro */
  function jpSweepHTML(w){
    var form=wordFormHTML(w), jp=(typeof w==="string")?w:(w&&w.jp);
    return (getSweep()&&form===jp&&isAllKana(jp))? sweepSpans(jp) : form;
  }
  var _sweepTimers=[];
  function _clearSweep(){ _sweepTimers.forEach(function(t){clearTimeout(t);}); _sweepTimers=[]; }
  function runSweep(container){
    if(!container) return;
    var spans=[].slice.call(container.querySelectorAll(".mora"));
    if(!spans.length) return;
    _clearSweep();
    spans.forEach(function(s){ s.classList.remove("lit"); });
    var ms=getSweepMs();
    spans.forEach(function(s,i){
      _sweepTimers.push(setTimeout(function(){
        spans.forEach(function(x){ x.classList.remove("lit"); });
        s.classList.add("lit");
      }, i*ms));
    });
    _sweepTimers.push(setTimeout(function(){
      spans.forEach(function(x){ x.classList.remove("lit"); });
    }, spans.length*ms + 400));
  }
  /* Reproduce y barre. Sin sweep (o sin moras en el contenedor) → speak() normal. */
  function speakSweep(text,container){
    if(!getSweep() || !container || !container.querySelector(".mora")){ speak(text); return; }
    try{
      var synth=window.speechSynthesis;
      if(!synth){ runSweep(container); return; }
      var u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=.8;
      var vs=synth.getVoices(); var jp=vs.filter(function(v){return /ja(-|_)?JP/i.test(v.lang);})[0];
      if(jp)u.voice=jp;
      var started=false, go=function(){ if(!started){ started=true; runSweep(container); } };
      u.onstart=go;
      u.onend=function(){ _clearSweep(); var ns=container.querySelectorAll(".mora"); [].slice.call(ns).forEach(function(x){x.classList.remove("lit");}); };
      u.onerror=go;
      synth.cancel(); synth.speak(u);
      setTimeout(go,250); // fallback iOS: a veces onstart nunca dispara
    }catch(e){ runSweep(container); }
  }

  /* =========================================================================
     FICHA DE AJUSTES — abrible durante las prácticas (tema / idioma / fuente
     / resaltado). Es un overlay a nivel de <body>, así render() no la destruye.
     ========================================================================= */
  function refreshOpenView(){
    var d=document.getElementById("drill"), r=document.getElementById("reading");
    try{ if(d && !d.classList.contains("hidden") && typeof sess!=="undefined" && sess){ renderDrill(); } }catch(e){}
    try{ if(r && !r.classList.contains("hidden") && typeof rsess!=="undefined" && rsess && rsess.q){ renderReading(); } }catch(e){}
  }
  function renderSheet(){
    var es=getLang()==="es", font=getFont(), lang=getLang(), theme=getTheme(), sw=getSweep(), ms=getSweepMs();
    var h="";
    h+='<div class="ss-head"><div class="ss-title">'+(es?"Ajustes":"Settings")+'</div>'+
       '<button class="ss-x" id="ssX" aria-label="'+(es?"Cerrar":"Close")+'">✕</button></div>';
    h+='<div class="ss-row"><div class="ss-lab">'+(es?"Fuente":"Font")+'</div><div class="seg-group">'+
       '<button class="fseg lseg'+(font==="mincho"?" on":"")+'" data-font="mincho" style="font-family:\'Shippori Mincho\',serif;font-size:14px;">あ</button>'+
       '<button class="fseg lseg'+(font==="gothic"?" on":"")+'" data-font="gothic" style="font-family:\'Noto Sans JP\',sans-serif;font-size:14px;">あ</button>'+
       '</div></div>';
    h+='<div class="ss-row"><div class="ss-lab">'+(es?"Idioma":"Language")+'</div><div class="seg-group">'+
       '<button class="lseg'+(lang==="en"?" on":"")+'" data-lang="en">EN</button>'+
       '<button class="lseg'+(lang==="es"?" on":"")+'" data-lang="es">ES</button>'+
       '</div></div>';
    h+='<div class="ss-row"><div class="ss-lab">'+(es?"Tema":"Theme")+'</div><div class="seg-group">'+
       '<button class="tseg lseg'+(theme==="light"?" on":"")+'" data-theme="light" style="font-size:13px;">☀</button>'+
       '<button class="tseg lseg'+(theme==="dark"?" on":"")+'" data-theme="dark" style="font-size:13px;">☾</button>'+
       '</div></div>';
    h+='<div style="height:1px;background:var(--line);margin:2px 0"></div>';
    h+='<div class="ss-row"><div><div class="ss-lab">'+(es?"Resaltar la sílaba que suena":"Highlight the syllable playing")+'</div>'+
       '<div class="ss-sub">'+(es?"Ilumina cada mora al reproducir el audio":"Lights each mora as the audio plays")+'</div></div>'+
       '<div class="seg-group">'+
       '<button class="lseg'+(!sw?" on":"")+'" data-sweep="0">Off</button>'+
       '<button class="lseg'+(sw?" on":"")+'" data-sweep="1">On</button>'+
       '</div></div>';
    if(sw){
      h+='<div class="ss-slider"><span class="ss-sub">'+(es?"Velocidad":"Speed")+'</span>'+
         '<input type="range" id="sweepSpeed" min="120" max="500" step="20" value="'+ms+'">'+
         '<span class="ss-sub" id="sweepSpeedVal">'+ms+'</span></div>';
    }
    document.getElementById("ssInner").innerHTML=h;
    bindSheet();
  }
  function bindSheet(){
    var inr=document.getElementById("ssInner"); if(!inr)return;
    inr.querySelectorAll("[data-font]").forEach(function(b){ b.onclick=function(){ setFont(b.getAttribute("data-font")); applyDisplaySettings(); renderSheet(); }; });
    inr.querySelectorAll("[data-lang]").forEach(function(b){ b.onclick=function(){ setLang(b.getAttribute("data-lang")); refreshOpenView(); renderSheet(); }; });
    inr.querySelectorAll("[data-theme]").forEach(function(b){ b.onclick=function(){ setTheme(b.getAttribute("data-theme")); applyDisplaySettings(); renderSheet(); }; });
    inr.querySelectorAll("[data-sweep]").forEach(function(b){ b.onclick=function(){ setSweep(b.getAttribute("data-sweep")==="1"); refreshOpenView(); renderSheet(); }; });
    var sl=document.getElementById("sweepSpeed");
    if(sl)sl.oninput=function(){ setSweepMs(sl.value); var lv=document.getElementById("sweepSpeedVal"); if(lv)lv.textContent=sl.value; };
    var x=document.getElementById("ssX"); if(x)x.onclick=closeSheet;
  }
  function openSheet(){
    renderSheet();
    var sc=document.getElementById("sheetScrim"); if(sc){ sc.classList.remove("hidden"); sc.onclick=closeSheet; }
    var sh=document.getElementById("settingsSheet"); if(sh)sh.classList.remove("hidden");
  }
  function closeSheet(){
    var sc=document.getElementById("sheetScrim"); if(sc)sc.classList.add("hidden");
    var sh=document.getElementById("settingsSheet"); if(sh)sh.classList.add("hidden");
  }
  /* Engranaje reutilizable para las sub-vistas de práctica + apertura delegada.
     (El drill y la lectura principal usan sus propios ids dGear/rGear.) */
  function gearBtn(){ return '<button class="d-gear" data-gear="1" aria-label="'+(getLang()==="es"?"Ajustes":"Settings")+'">⚙</button>'; }
  document.addEventListener("click",function(e){
    var t=e.target; if(t && t.closest && t.closest("[data-gear]")){ openSheet(); }
  });
  function startDrill(){
    ensureKana();
    sess={done:0,correct:0,wrong:0,q:null,hitGoalShown:false,newCount:0,maxNew:5,mode:"quiz",teach:null,force:null};
    buildQuestion();
    drillEl.classList.remove("hidden");
    renderDrill();
  }
  function startWeakDrill(script){
    ensureKana();
    sess={done:0,correct:0,wrong:0,q:null,hitGoalShown:false,newCount:0,maxNew:0,mode:"quiz",teach:null,force:null,focusWeak:script};
    buildQuestion();

  }
  function closeDrill(){
    if(csess){ customEnd(); return; }
    if(dsess){ dailyEnd(); return; }
    drillEl.classList.add("hidden");
    try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
    render();
  }
  function answer(pickRomaji){
    var q=sess.q; if(!q||q.answered)return;
    q.answered=true; q.picked=pickRomaji;
    var k=ensureKana(),correct=pickRomaji===q.target;
    // SRS box update (per script + sound)
    var _b=boxFor(q.script),cur=_b[q.target]||0;
    _b[q.target]=correct?Math.min(5,cur+1):0;
    // cross-day scheduling + leech tracking
    setDue(q.script,q.target,_b[q.target]);
    if(correct){ if(_b[q.target]>=PROMOTE_AT)clearLeech(q.script,q.target); } else { bumpLeech(q.script,q.target); }
    // session + daily counters (goal counts attempts, right or wrong)
    sess.done++; if(correct)sess.correct++; else sess.wrong++;
    var t=today(); if(!k.daily[t])k.daily[t]={done:0,correct:0};
    k.daily[t].done++; if(correct)k.daily[t].correct++;
    // unified: any 15 reps (kana+reading) stamps the day
    if(stampDay()) sess.justHitGoal=true;
    sess.q.word=pickWordFor(q.target,q.script,"reward");
    Persistence.save(state);
    renderDrill();
  }
  function gotIt(){
    var k=ensureKana(),c=sess.teach; if(!c)return;
    if(c.intro){ if(c.intro==="kata")k.kataIntroSeen=true; else if(c.intro==="yoon")k.yoonIntroSeen=true; else if(c.intro==="sokuon"){k.sokuonSeen=true;k.scope.sokuon=true;} else if(c.intro==="choon"){k.choonSeen=true;k.scope.choon=true;} Persistence.save(state); buildQuestion(); renderDrill(); return; }
    if(c.relearn)clearLeech(c.script,c.romaji);
    k.learned[learnedKey(c.script,c.romaji)]=true; sess.newCount++;
    sess.force={romaji:c.romaji,script:c.script};
    Persistence.save(state); buildQuestion(); renderDrill();
  }
  function nextQuestion(){ if(sess.justHitGoal)sess.hitGoalShown=true; sess.justHitGoal=false; if(csess){ customAfterUnit(); return; } if(dsess){ dailyAfterUnit(); return; } buildQuestion(); renderDrill(); }

  function teachHTML(){
    var c=sess.teach,es=getLang()==="es";
    if(c.intro==="kata"){
      var body=es?"Esto es <b>katakana</b>. Tiene los mismos sonidos que el hiragana que ya sabés, pero otras formas. Se usa sobre todo para palabras extranjeras (café, taxi, hotel…). Vas a aprender las formas base primero — por ejemplo き → キ — y después sus versiones con dakuten.":"This is <b>katakana</b>. Same sounds as the hiragana you already know, but different shapes. It's used mostly for foreign words (coffee, taxi, hotel…). You'll learn the base shapes first — e.g. き → キ — then their dakuten versions.";
      return '<div class="teach"><div class="teach-tag">'+t("New script")+'</div>'+
        '<div class="teach-glyph mincho">ア</div><div class="teach-rom">'+t("Katakana")+'</div>'+
        '<div class="teach-mn">'+body+'</div></div>'+
        '<div class="d-actions"><button class="d-next" id="tGot">'+t("Got it →")+'</button></div>';
    }
    if(c.intro==="yoon"){
      var yb=es?"Los <b>yōon</b> (拗音) juntan un kana de la columna -i (き, し, ち, り…) con un <b>ゃ / ゅ / ょ</b> chiquito para formar <b>un solo sonido</b>: き + ゃ = きゃ (<i>kya</i>), no 'ki-ya'. El segundo kana va más pequeño — por eso es fácil reconocerlos.":"<b>Yōon</b> (拗音) fuse an -i kana (き, し, ち, り…) with a small <b>ゃ / ゅ / ょ</b> into <b>one sound</b>: き + ゃ = きゃ (<i>kya</i>), not 'ki-ya'. The second kana is written smaller, which makes them easy to spot.";
      return '<div class="teach"><div class="teach-tag">'+(es?"Sonidos nuevos":"New sounds")+'</div>'+
        '<div class="teach-glyph mincho">きゃ</div><div class="teach-rom">yōon</div>'+
        '<div class="teach-mn">'+yb+'</div></div>'+
        '<div class="d-actions"><button class="d-next" id="tGot">'+t("Got it →")+'</button></div>';
    }
    if(c.intro==="sokuon"){
      var sb=es?"La <b>っ</b> chiquita (<b>sokuon</b>) no suena sola: <b>duplica la consonante siguiente</b> y mete una pausa corta. きって = '<i>kit-te</i>' (no 'ki-te'); ちょっと = '<i>chot-to</i>'. Ojo: la っ es más pequeña que la つ normal.":"The small <b>っ</b> (<b>sokuon</b>) has no sound of its own: it <b>doubles the next consonant</b> and adds a short pause. きって = '<i>kit-te</i>' (not 'ki-te'); ちょっと = '<i>chot-to</i>'. Note: っ is smaller than a normal つ.";
      return '<div class="teach"><div class="teach-tag">'+(es?"Regla de lectura":"Reading rule")+'</div>'+
        '<div class="teach-glyph mincho">っ</div><div class="teach-rom">'+(es?"consonante doble":"double consonant")+'</div>'+
        '<div class="teach-mn">'+sb+'</div></div>'+
        '<div class="d-actions"><button class="d-next" id="tGot">'+t("Got it →")+'</button></div>';
    }
    if(c.intro==="choon"){
      var cb=es?"<b>Vocal larga</b> (<b>chōon</b>): en katakana la marca <b>ー</b> alarga la vocal de antes — コーヒー = '<i>kōhī</i>', ラーメン = '<i>rāmen</i>'. En hiragana se alarga repitiendo la vocal (おう, ええ). El sonido se sostiene el doble.":"<b>Long vowels</b> (<b>chōon</b>): in katakana the mark <b>ー</b> lengthens the vowel before it — コーヒー = '<i>kōhī</i>', ラーメン = '<i>rāmen</i>'. In hiragana you lengthen by repeating the vowel (おう, ええ). You hold the sound about twice as long.";
      return '<div class="teach"><div class="teach-tag">'+(es?"Regla de lectura":"Reading rule")+'</div>'+
        '<div class="teach-glyph mincho">ー</div><div class="teach-rom">'+(es?"vocal larga":"long vowel")+'</div>'+
        '<div class="teach-mn">'+cb+'</div></div>'+
        '<div class="d-actions"><button class="d-next" id="tGot">'+t("Got it →")+'</button></div>';
    }
    var g=glyph(c.romaji,c.script),word=pickWordFor(c.romaji,c.script);
    var h='<div class="teach"><div class="teach-tag">'+t(c.relearn?"Let's review this one":"New character")+'</div>';
    var dv=DEVOICE[c.romaji];
    if(dv){
      var base=dv[0],sym=dv[1]==="p"?"゜":"゛",bg=glyph(base,c.script);
      h+='<div class="teach-compare">'+
         '<div class="tc-side"><div class="tc-glyph mincho">'+bg+'</div><div class="tc-rom">'+base+'</div><button class="d-spk sm" id="tSpkBase" aria-label="Play base">🔊</button></div>'+
         '<div class="tc-arrow">→</div>'+
         '<div class="tc-side new"><div class="tc-glyph mincho">'+g+'</div><div class="tc-rom">'+c.romaji+'</div><button class="d-spk sm" id="tSpk" aria-label="Play sound">🔊</button></div>'+
         '</div>';
      h+='<div class="teach-mn big">'+bg+' ('+base+') + '+sym+' → '+g+' ('+c.romaji+')</div>';
      h+='<div class="teach-mn-sub">'+(es?((dv[1]==="p"?"El círculo ゜ cambia el sonido":"Las dos rayitas ゛ sonorizan el sonido")+": de "+base+" pasa a "+c.romaji+"."):((dv[1]==="p"?"The circle ゜ changes the sound":"The two dashes ゛ voice the sound")+": "+base+" becomes "+c.romaji+"."))+'</div>';
    } else if(isYoonRomaji(c.romaji)){
      var yp=yoonParts(c.romaji,c.script);
      h+='<div class="teach-compare">'+
         '<div class="tc-side"><div class="tc-glyph mincho">'+yp.base+'</div><div class="tc-rom">'+yp.baseRomaji+'</div></div>'+
         '<div class="tc-arrow">+ '+yp.small+' →</div>'+
         '<div class="tc-side new"><div class="tc-glyph mincho">'+g+'</div><div class="tc-rom">'+c.romaji+'</div><button class="d-spk sm" id="tSpk" aria-label="Play sound">🔊</button></div>'+
         '</div>';
      h+='<div class="teach-mn big">'+yp.base+' ('+yp.baseRomaji+') + '+yp.small+' → '+g+' ('+c.romaji+')</div>';
      h+='<div class="teach-mn-sub">'+mnemonicFor(c.script,c.romaji)+'</div>';
    } else {
      h+='<div class="teach-glyph mincho">'+g+'</div><div class="teach-rom">'+c.romaji+'</div>'+
         '<button class="d-spk" id="tSpk" aria-label="Play sound">🔊</button>'+
         '<div class="teach-mn">'+mnemonicFor(c.script,c.romaji)+'</div>';
    }
    if(word) h+='<div class="teach-word"><b class="mincho">'+word.w+'</b> '+word.r+' — <span class="mean">'+exMean(word)+'</span></div>';
    h+='</div><div class="d-actions"><button class="d-next" id="tGot">'+t("Got it →")+'</button></div>';
    return h;
  }
  function renderDrill(){
    var q=sess.q,k=ensureKana(),dt={done:todayReps()};
    var gpct=Math.min(100,dt.done),gtier=dayTier(dt.done);
    var h="";
    h+='<div class="d-sticky">';
    h+='<div class="d-head"><div class="d-head-l"><button class="d-close" id="dClose">✕ '+t("Close")+'</button>'+
       '<button class="d-gear" id="dGear" aria-label="'+(getLang()==="es"?"Ajustes":"Settings")+'">⚙</button></div>'+
       '<div class="d-stats">'+
       '<div class="d-stat"><div class="n">'+sess.done+'</div><div class="l">'+t("Done")+'</div></div>'+
       '<div class="d-stat wrong"><div class="n">'+sess.wrong+'</div><div class="l">'+t("Wrong")+'</div></div>'+
       '<div class="d-stat right"><div class="n">'+sess.correct+'</div><div class="l">'+t("Correct")+'</div></div>'+
       '</div></div>';
    h+='<div class="d-goal"><div class="lab"><span>'+t("Daily goal")+'</span><span>'+dt.done+(gtier>=0?' · '+t(TIER_LABEL[gtier]):'')+'</span></div>'+
       '<div class="prog milestones"><i style="width:'+gpct+'%"></i>'+milestoneTicks(dt.done,"drill")+'</div></div>';
    h+='</div>';

    if(sess.mode==="teach"){ h+=teachHTML(); drillInner.innerHTML=h; bindDrill(); return; }

    // prompt
    h+='<div class="d-prompt">';
    if(q.dir==="toRomaji"){
      h+='<div class="d-kind">'+t("Which sound is this?")+'</div><div class="d-glyph mincho">'+glyph(q.target,q.script)+'</div>';
    }else{
      h+='<div class="d-kind">'+t("Tap the")+' '+(q.script==="kata"?"katakana":"hiragana")+'</div><div class="d-romaji mincho">'+q.target+'</div>'+
         '<button class="d-spk" id="dSpk" aria-label="Play sound">🔊</button>';
    }
    h+='</div>';

    // options
    h+='<div class="d-grid">';
    q.opts.forEach(function(o,idx){
      var cls="opt"+(o.rom?" rom":"");
      if(q.answered){
        if(o.romaji===q.target)cls+=" correct";
        else if(o.romaji===q.picked)cls+=" bad";
        else cls+=" dim";
      }
      h+='<div class="'+cls+'" data-r="'+o.romaji+'">'+o.label+'</div>';
    });
    h+='</div>';

    // feedback
    h+='<div class="d-fb">';
    if(q.answered){
      var correct=q.picked===q.target;
      if(sess.justHitGoal){
        h+='<div class="d-celebrate"><div class="big">'+t("済 Streak saved!")+'</div><div class="sm">'+t("Today is stamped and your streak is safe. Keep going or close.")+'</div></div>';
      }else{
        var tgl=glyph(q.target,q.script==="kata"?"kata":"hira");
        h+='<div class="msg '+(correct?"ok":"no")+'">'+(correct?t("Correct!"):t("It was"))+' <span class="gl mincho">'+tgl+'</span> <span class="rm">'+q.target+'</span></div>';
        var word=sess.q.word;
        if(word) h+='<div class="reward-card"><div class="rw-word mincho">'+sweepKanaHTML(word.w)+'</div><div class="rw-sub">'+word.r+' — <span class="mean">'+exMean(word)+'</span></div><button class="d-spk-word" id="dSpkWord" aria-label="Play word">🔊 <span>'+t("hear it")+'</span></button></div>';
      }
    }
    h+='</div>';

    // actions
    if(q.answered){
      h+='<div class="d-actions"><button class="d-next" id="dNext">'+t("Next →")+'</button></div>';
    }else{
      h+='<div class="d-actions"><button class="d-skip" id="dSkip">'+t("Skip")+'</button></div>';
    }
    drillInner.innerHTML=h;
    bindDrill();
  }

  function toggle(id){var t=today();if(!state.days[t])state.days[t]={};
    state.days[t][id]=!state.days[t][id];Persistence.save(state);render();}
  function flash(el,msg,cls){if(!el)return;el.textContent=msg;el.className="status "+(cls||"ok");}
  function copyText(str,statusEl){
    function ok(){flash(statusEl,t("Copied ✓"),"ok");}
    function fb(){var ta=document.getElementById("exportBox");ta.focus();ta.select();ta.setSelectionRange(0,99999);
      try{document.execCommand("copy");ok();}catch(e){flash(statusEl,t("Select the text above and copy manually."),"err");}}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str).then(ok).catch(fb);}else fb();
  }
  function setSeg(kind,val){
    var k=ensureKana();

    Persistence.save(state); render();
    var d=document.querySelector("details.opts"); if(d)d.open=true;
  }

  function n5KanaPillar(){ var k=ensureKana(), keys=BASE_KEYS.concat(DAK_KEYS).concat(YOON_KEYS), tot=keys.length*2, s=0;

  /* Fold each game's bundled words into WORD_POOL (dedup by jp) so they
     become teachable/trackable exactly like the built-in word batches. */
  (function(){
    var seen={}; WORD_POOL.forEach(function(w){ seen[w.jp]=1; });
    GAMES.forEach(function(g){ (g.words||[]).forEach(function(o){
      if(!o||!o.jp||seen[o.jp])return; seen[o.jp]=1;
      WORD_POOL.push({jp:o.jp,romaji:o.romaji||'',en:(o.en||o.es||''),es:(o.es||o.en||''),emoji:(o.emoji||EMOJI[o.jp]||'')});
    }); });
  })();

  function gamePick(o){ return o?(getLang()==="es"?(o.es||o.en):(o.en||o.es)):""; }
  function isWordMastered(jp){ return (ensureWords().box[jp]||0) >= 4; }

  /* ---- Aim at a game: bias new-word introductions toward its core vocab ----
     Mixed, not exclusive (AIM_BIAS) and still capped by READ_LEARN_POOL, so it
     prioritises without flooding. state.aim holds one game id at a time. */
  /* Priority tiers: +1 (focus) keeps the base reserve/bias; +2 (enfoque total)
     widens the reserve so aim words flood in even when the general pool is full,
     and leans the intro/review bias harder. It cannot beat the 4-days-per-word
     honest-signal floor — it just gets you TO it instead of well above it. */
  var AIM_BIAS=0.8, AIM_RESERVE=3, AIM_REVIEW_BIAS=0.45;
  var AIM_BIAS2=0.95, AIM_RESERVE2=6, AIM_REVIEW_BIAS2=0.65;
  function aimLevel(){ return (state&&state.aim)?(state.aimLvl===2?2:1):0; }
  function aimReserve(){ return aimLevel()>=2?AIM_RESERVE2:AIM_RESERVE; }
  function aimBias(){ return aimLevel()>=2?AIM_BIAS2:AIM_BIAS; }
  function aimReviewBias(){ return aimLevel()>=2?AIM_REVIEW_BIAS2:AIM_REVIEW_BIAS; }
  function aimedGame(){ if(!state||!state.aim)return null; for(var i=0;i<GAMES.length;i++)if(GAMES[i].id===state.aim)return GAMES[i]; return null; }
  function aimWordSet(){ var g=aimedGame(); if(g){ var m={}; (g.words||[]).forEach(function(w){m[w.jp]=1;}); return m; } return (typeof n5WordSet==='function')?n5WordSet():null; }
  function aimPhraseSet(){ var g=aimedGame(); if(!g||typeof OPENINGS==='undefined')return null; var o=OPENINGS[g.id]; if(!o)return null; var m={}; (o.phrases||[]).forEach(function(x){m[x.jp]=1;}); return m; }
  function aimSetForPool(pool){ return (typeof PHRASES!=='undefined'&&pool===PHRASES)?aimPhraseSet():aimWordSet(); }
  function setAim(id){
    if(state.aim!==id){ state.aim=id; state.aimLvl=1; }      /* aim a new game at +1 */
    else if((state.aimLvl||1)<2){ state.aimLvl=2; }          /* same game: +1 -> +2 */
    else { state.aim=null; state.aimLvl=1; }                 /* same game at +2 -> off */
    Persistence.save(state); render();
  }

  function gameReadiness(g){
    var need = g.kana || READY_KANA_DEFAULT;
    var hira = scriptMastery('hira').pct, kata = scriptMastery('kata').pct;
    var kanaOK = (hira >= (need.hira||0)) && (kata >= (need.kata||0));
    var core = (g.words||[]).map(function(w){ return w.jp; });
    var have = core.filter(isWordMastered).length;
    var cov  = core.length ? have/core.length : 1;
    var st;
    if(!kanaOK || cov < READY_DICT) st='locked';
    else if(cov < READY_COMFY)      st='dict';
    else                            st='comfy';
    return { state:st, cov:cov,
      kana:{ ok:kanaOK, hira:hira, kata:kata, needHira:(need.hira||0), needKata:(need.kata||0) },
      words:{ done:have, total:core.length } };
  }

  /* What to show under a game: verdict badge + the honest "te falta" line. */
  function gameVerdict(r){
    var es=getLang()==="es";
    if(r.state==='comfy') return { cls:'comfy', badge:(es?'¡Ya podés!':'Ready!'),
      sub:(es?'Menús cubiertos — jugá tranquilo':'Menus covered — go for it') };
    if(r.state==='dict'){ var cn=Math.ceil(READY_COMFY*r.words.total), falta=Math.max(1,cn-r.words.done);
      return { cls:'dict', badge:(es?'Jugable con diccionario':'Playable w/ dictionary'),
        sub:(es?('Te faltan '+falta+' palabra'+(falta===1?'':'s')+' para leerlo cómodo')
               :(falta+' word'+(falta===1?'':'s')+' from reading it comfortably')) }; }
    // locked: say WHY — kana first, then words
    if(!r.kana.ok){
      var parts=[];
      if(r.kana.hira<r.kana.needHira) parts.push('hiragana ('+r.kana.hira+'/'+r.kana.needHira+'%)');
      if(r.kana.kata<r.kana.needKata) parts.push('katakana ('+r.kana.kata+'/'+r.kana.needKata+'%)');
      return { cls:'locked', badge:(es?'Todavía no':'Not yet'),
        sub:(es?'Te falta ':'Need ')+parts.join(es?' y ':' & ') };
    }
    var dn=Math.ceil(READY_DICT*r.words.total), f2=Math.max(1,dn-r.words.done);
    return { cls:'locked', badge:(es?'Todavía no':'Not yet'),
      sub:(es?('Te faltan '+f2+' palabra'+(f2===1?'':'s')+' para jugarlo con diccionario'):(f2+' word'+(f2===1?'':'s')+' from playable w/ dictionary')) };
  }

           '<div class="mc-sub">'+r.words.done+' / '+r.words.total+' '+(es?'palabras del menú':'menu words')+'</div>'+
           '<div class="mc-goal">'+v.sub+'</div>'+

             '<button class="aim-btn'+(aimed?' on':'')+(alvl>=2?' on2':'')+'" data-aim="'+g.id+'">'+aimLbl+'</button>'+

    h+='</div>';
    return h;

  /* =========================================================================
     FICHA DE SOPORTE POR JUEGO — cheat sheet, NO diccionario genérico.
     -------------------------------------------------------------------------
     Un panel de referencia por juego: el vocabulario curado del menú agrupado
     por categoría, cada palabra con su estado REAL de tu SRS. Es un "diccionario
     acotado" al juego: honesto (refleja tu dominio, nunca un %), respeta
     "solo lo ya aprendido" (marca 🔒 lo que aún no podés leer y explica por qué),
     y NO agrega estado persistido (todo se deriva de ensureWords()/wordReadable()).
     El texto dinámico (diálogo/historia) sigue siendo trabajo de un diccionario
     externo (Jisho/Yomitan) — eso Nikka no lo clona; solo te sube la lectura
     hasta que ese diccionario te sea usable. Nada más que tocar para sumar juegos:
     el campo opcional .cat de cada palabra decide su grupo (sin cat -> "general"). */
  var CAT_LABELS={
    menu:{es:'Menús y sistema',en:'Menus & system'},
    item:{es:'Objetos',en:'Items'},
    combat:{es:'Combate',en:'Combat'},
    stats:{es:'Estadísticas',en:'Stats'},
    status:{es:'Estados',en:'Status'},
    world:{es:'Mundo y lugares',en:'World & places'},
    people:{es:'Personajes',en:'Characters'},
    story:{es:'Historia e intro',en:'Story & intro'},
    court:{es:'En la corte',en:'In court'},
    crime:{es:'Crimen',en:'Crime'},
    general:{es:'General',en:'General'}
  };
  function catLabel(c){ var o=CAT_LABELS[c]; return o?(getLang()==='es'?o.es:o.en):c; }
  /* Estado honesto por palabra, derivado del SRS existente. */
  function fichaState(jp){ var b=ensureWords().box[jp]||0;
    if(b>=4) return 'mastered';                 /* dominada = correcta en 4 días distintos */
    if(b>=1) return 'progress';                 /* vista, subiendo */
    if(wordReadable(jp)) return 'readable';     /* podés sonarla, aún sin practicar */
    return 'locked'; }                          /* su kana todavía no se aprendió */
  function fichaGroups(g){ var order=[],map={};
    (g.words||[]).forEach(function(w){ var c=w.cat||'general'; if(!map[c]){map[c]=[];order.push(c);} map[c].push(w); });
    return {order:order,map:map}; }
  function fichaChipHTML(w){
    var es=getLang()==='es', st=fichaState(w.jp), gl=es?(w.es||w.en):(w.en||w.es);
    var mark = st==='mastered'?'<span class="fx-mk ok">✓</span>'
             : st==='progress'?'<span class="fx-mk prog">◐</span>'
             : st==='locked'  ?'<span class="fx-mk lock">🔒</span>'
             :                  '<span class="fx-mk">·</span>';
    var em = w.emoji?('<span class="fx-em">'+w.emoji+'</span>'):'';
    return '<button class="fx-chip '+st+'" data-say="'+w.jp+'">'+
      '<div class="fx-hd">'+em+'<span class="fx-jp mincho">'+wordFormHTML(w)+'</span>'+mark+'</div>'+
      '<div class="fx-ro">'+(w.romaji||'')+'</div>'+
      '<div class="fx-gl">'+gl+'</div>'+
      (st==='locked'?'<div class="fx-hint">'+(es?'aún no leés su kana':'kana not learned yet')+'</div>':'')+
      '</button>';
  }

    var es=getLang()==='es', r=gameReadiness(g), v=gameVerdict(r);
    var prog=(g.words||[]).filter(function(w){return fichaState(w.jp)==='progress';}).length;
    var h='<div class="d-sticky"><div class="d-head"><button class="d-close" id="fxClose">✕ '+t("Back")+'</button>'+
          '<span class="cx-title mincho">📖 '+gamePick(g.name)+'</span></div></div>';
    h+='<div class="fx-intro"><span class="grow-mode">'+gamePick(g.mode)+'</span> · '+

    h+='<div class="fx-legend"><span><b class="ok">✓</b>'+(es?'dominada':'mastered')+'</span>'+
        '<span><b class="prog">◐</b>'+(es?'en progreso':'in progress')+'</span>'+

        '<span><b class="lock">🔒</b>'+(es?'bloqueada':'locked')+'</span></div>';
    var grp=fichaGroups(g);
    grp.order.forEach(function(c){
      h+='<div class="fx-cat">'+catLabel(c)+'</div><div class="fx-grid">';
      grp.map[c].forEach(function(w){ h+=fichaChipHTML(w); });

    });
    h+='<div class="fx-foot">'+(es
        ?'El diálogo y la historia no están acá: para eso usá un diccionario externo (Jisho, Yomitan). Nikka te sube la lectura hasta que ese diccionario te sea usable.'
        :'Story dialogue lives elsewhere: use an external dictionary (Jisho, Yomitan) for that. Nikka raises your reading until that dictionary becomes usable.')+'</div>';
    inner.innerHTML=h;
    var c=document.getElementById('fxClose'); if(c)c.addEventListener('click',closeFicha);
    inner.querySelectorAll('.fx-chip[data-say]').forEach(function(b){
      b.addEventListener('click',function(){ speak(b.getAttribute('data-say')); }); });

  function openFicha(id){ var el=document.getElementById('ficha'); if(!el)return; fichaGameId=id; el.classList.remove('hidden'); renderFicha(); try{window.scrollTo(0,0);}catch(e){} }

  var rsess=null;
  var READ_LEARN_POOL=12, WORD_PROMOTE_AT=3, WORD_LEECH_AT=3;
  var WORD_KEYSET=(function(){var m={};WORD_POOL.forEach(function(w){m[w.jp]=1;});return m;})();
  function markWordKnown(jp){ if(!WORD_KEYSET[jp])return; var w=ensureWords(); w.seen[jp]=1; w.known[jp]=1; w.leech[jp]=0; }

  /* Soft ranking: teach = short + target near front + prefer known neighbours (mild);

  function pickExample(key,script,mode){
    var bag=(EX_INDEX[script]||{})[key]; if(!bag||!bag.length)return null;
    mode=mode||"teach"; var target=glyph(key,script);
    var scored=bag.map(function(o){
      var unknown=0,len=0;
      readUnits(o.w).forEach(function(un){ if(un.kind==="base"||un.kind==="yoon"){ len++; if(!isLearned(un.script,un.romaji))unknown++; } else if(un.kind==="sokuon"){ len++; if(!sokuonReady())unknown++; } else if(un.kind==="choon"){ len++; if(!choonReady())unknown++; } });
      var pos=o.w.indexOf(target); if(pos<0)pos=9;
      var score=0;
      if(mode==="reward") score += (unknown===0?30:-unknown*6);
      else { score += -unknown*2; score += -Math.min(pos,3); }
      score += -Math.max(0,len-3);
      return {o:o,score:score};
    });
    scored.sort(function(a,b){return b.score-a.score;});
    var topN=scored.slice(0, Math.min(5,scored.length));
    return topN[Math.floor(Math.random()*topN.length)].o;

  function weightedPick(pool,box,idxs,exclude){

    var exSet={}; exArr.forEach(function(e){if(e!=null&&e>=0)exSet[e]=1;});
    var cand=idxs.filter(function(i){return !exSet[i];}); if(!cand.length)cand=idxs;
    var w=cand.map(function(i){var b=Math.min(5,box[pool[i].jp]||0); return b>=4?1:(10-b*2);});
    var sum=w.reduce(function(a,b){return a+b;},0),x=Math.random()*sum;
    for(var k=0;k<cand.length;k++){x-=w[k];if(x<=0)return cand[k];}
    return cand[cand.length-1];
  }
