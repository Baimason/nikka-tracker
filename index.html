<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日課">
<meta name="theme-color" content="#e4ddcc">
<title>日課 — Japanese Daily Tracker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><rect width='100' height='100' fill='%23e4ddcc'/><rect x='8' y='8' width='84' height='84' rx='6' fill='none' stroke='%23b23726' stroke-width='5'/><rect x='16' y='16' width='68' height='68' rx='3' fill='none' stroke='%23b23726' stroke-width='2'/><text x='50' y='52' text-anchor='middle' dominant-baseline='central' font-size='50' fill='%23b23726' font-family='serif' font-weight='800'>済</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet"> <!-- Font con mejor lectura para los novatos del japones -->
<style>
  :root{
    --paper:#e4ddcc; --card:#f1ece0; --ink:#23201a; --ink-soft:#6b6456;
    --ink-faint:#a99f89; --shu:#b23726; --shu-deep:#8f2a1d; --green:#4f7a52;
    --grid:#d3cab6; --line:#d8d0bf; --gold:#8a7233;
    --shadow:var(--shadow); --box-hover:var(--box-hover); --bad-bg:var(--bad-bg);
    --display-font: "Shippori Mincho", Georgia, serif;
  }
  /* Modo oscuro: sólo redefine la paleta; el resto del CSS ya usa var(). */
  body.dark{
    --paper:#191510; --card:#241f18; --ink:#ece3d0; --ink-soft:#a79d88;
    --ink-faint:#6f6656; --shu:#d1543f; --shu-deep:#a3311f; --green:#7ba86e;
    --grid:#241f18; --line:#39332a; --gold:#c2a85e;
    --shadow:rgba(0,0,0,.5); --box-hover:rgba(236,227,208,.06); --bad-bg:#3a2521;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
    color:var(--ink); font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    line-height:1.5;
    padding:0 calc(18px + env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto}
  .mincho { font-family: var(--display-font); }

  body.font-gothic {
    --display-font: "Noto Sans JP", system-ui, sans-serif;
  }

  header{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;z-index:30;
    background:var(--paper);border-bottom:2px solid var(--ink);padding:calc(20px + env(safe-area-inset-top,0px)) 0 14px;margin-bottom:22px}
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .title{display:flex;flex-direction:column;gap:2px;min-width:0}
  .title .kanji{font-family: var(--display-font);font-weight:800;font-size:44px;line-height:.95;letter-spacing:2px}
  .rom{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
  .streak-seal{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .streak-num{font-family: var(--display-font);font-weight:800;font-size:52px;line-height:1;color:var(--shu)}
  .streak-meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);max-width:78px}
  .streak-meta b{color:var(--ink);display:block;font-size:13px;letter-spacing:.05em}

  .phase{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
  .phase .wk{font-family: var(--display-font);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--shu);
    border:1.5px solid var(--shu);border-radius:2px;padding:2px 8px}
  .phase .focus{font-size:14px;color:var(--ink-soft)}
  .phase .focus b{color:var(--ink);font-weight:700}

  .wotd{display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid var(--shu);border-radius:2px;padding:3px 9px;cursor:pointer;color:var(--shu)}
  .wotd .wotd-em{font-size:15px}
  .wotd .wotd-jp{font-weight:700;font-size:15px;color:var(--ink)}
  .wotd .wotd-sub{font-size:11px;letter-spacing:.04em;color:var(--ink-soft)}
  .wotd.empty{font-size:15px;color:var(--ink-soft);border-color:var(--ink-soft);padding:3px 9px}
  .wotd{flex-shrink:0}

  .card{position:relative;background:var(--card);border:1.5px solid var(--ink);
    box-shadow:5px 5px 0 var(--shadow);padding:20px 20px 8px;margin-bottom:30px}
  .card h2{font-family: var(--display-font);font-weight:700;font-size:18px;margin:0 0 2px;letter-spacing:.02em}
  .card .date{font-size:12px;color:var(--ink-soft);margin-bottom:14px}

  .task{display:flex;align-items:flex-start;gap:13px;padding:13px 2px;border-top:1px solid var(--line)}
  .task:first-of-type{border-top:none}
  .box{flex:none;width:26px;height:26px;margin-top:1px;border:1.8px solid var(--ink);border-radius:3px;
    background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s;font-family: var(--display-font);color:#fff;font-size:17px}
  .box:hover{background:var(--box-hover)}
  .box.on{background:var(--ink)}
  .box.sacred{border-color:var(--shu)}
  .box.sacred.on{background:var(--shu)}
  .t-body{flex:1;min-width:0}
  .t-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .t-label{font-weight:700;font-size:15px}
  .task.done .t-label{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--shu)}
  .badge{font-family: var(--display-font);font-size:10px;letter-spacing:.12em;color:var(--shu);
    border:1px solid var(--shu);border-radius:2px;padding:1px 5px;white-space:nowrap}
  .t-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .chip{display:inline-flex;align-items:center;gap:5px;margin-top:7px;margin-right:6px;
    font-size:12px;font-weight:500;color:var(--ink);text-decoration:none;
    border:1.3px solid var(--ink);border-radius:2px;padding:3px 9px;background:var(--paper);transition:transform .1s,background .15s;cursor:pointer}
  .chip:hover{background:var(--ink);color:var(--card);transform:translateY(-1px)}
  .chip .arr{font-size:11px}

  .note{font-size:12.5px;color:var(--ink-soft);padding:12px 2px 16px;border-top:1px dashed var(--line);margin-top:4px}
  .note b{color:var(--shu)}

  .seal{position:absolute;top:-14px;right:-12px;width:66px;height:66px;
    display:flex;align-items:center;justify-content:center;pointer-events:none;
    opacity:0;transform:scale(.4) rotate(-18deg)}
  .seal.show{opacity:1;transform:scale(1) rotate(-9deg);
    transition:opacity .18s, transform .28s cubic-bezier(.2,1.5,.4,1)}
  .seal svg{width:100%;height:100%;filter:drop-shadow(1px 1px 0 rgba(143,42,29,.25))}

  .sec-h{font-family: var(--display-font);font-weight:700;font-size:13px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px;display:flex;align-items:center;gap:10px}
  .sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

  /* drill entry card */
  .drill-card{position:relative;background:var(--card);border:1.5px solid var(--ink);
    box-shadow:5px 5px 0 var(--shadow);padding:18px 20px;margin-bottom:30px}
  .drill-card .dc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .drill-card h3{font-family: var(--display-font);font-weight:700;font-size:17px;margin:0}
  .drill-card .dc-count{font-family: var(--display-font);font-size:15px;color:var(--shu);font-weight:700}
  .prog.milestones{position:relative;overflow:visible}
  .prog .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-faint);transform:translateX(-1px);opacity:.5}
  .prog .tick.on{background:var(--ink);opacity:1}

  .prog .tick.hit{background:transparent;opacity:1}
  .prog .tick-seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;line-height:16px;text-align:center;
    font-family:var(--display-font);font-weight:800;font-size:12px;color:var(--shu);
    background:var(--card);border:1.5px solid var(--shu);border-radius:3px;
    box-shadow:1px 1px 0 rgba(143,42,29,.25);z-index:2}
  .prog .tick-seal.pop{animation:tickpop .3s ease-out}
  .prog .tick-seal.final{width:24px;height:24px;line-height:20px;font-size:15px;border-width:2px;
    box-shadow:1.5px 1.5px 0 rgba(143,42,29,.3)}
  @keyframes tickpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
    60%{transform:translate(-50%,-50%) scale(1.15)}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){ .prog .tick-seal.pop{animation:none} }

  .drill-card .dc-count .tier{color:var(--green)}
  .prog{height:9px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 0 6px}
  .prog > i{display:block;height:100%;background:var(--shu);width:0;transition:width .3s}
  .prog > i.g{background:var(--green)}
  .dc-sub{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
  .start-btn{width:100%;font:inherit;font-weight:700;font-size:15px;color:var(--card);background:var(--ink);
    border:none;border-radius:3px;padding:13px;cursor:pointer}
  .start-btn:active{transform:translateY(1px)}
  .start-btn.done-today{background:var(--green)}
  details.opts{margin-top:12px}
  details.opts summary{list-style:none;cursor:pointer;font-size:12px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.1em;font-weight:700}
  details.opts summary::-webkit-details-marker{display:none}
  .opt-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
  .opt-row .k{font-size:11px;color:var(--ink-soft);width:44px;text-transform:uppercase;letter-spacing:.08em}
  .seg{font:inherit;font-size:12px;font-weight:600;border:1.3px solid var(--line);background:var(--paper);
    color:var(--ink-soft);border-radius:2px;padding:4px 10px;cursor:pointer}
  .seg.on{border-color:var(--ink);color:var(--ink);background:var(--card)}

  .road{display:flex;flex-direction:column;gap:0;margin-bottom:32px}
  .stop{display:flex;gap:14px;align-items:flex-start}
  .stop .rail{display:flex;flex-direction:column;align-items:center;flex:none;width:22px}
  .stop .dot{width:13px;height:13px;border:2px solid var(--ink-faint);background:var(--paper);border-radius:50%;margin-top:4px}
  .stop .bar{width:2px;flex:1;background:var(--line);min-height:26px}
  .stop:last-child .bar{display:none}
  .stop .rt{padding-bottom:20px}
  .stop .rt .lbl{font-weight:700;font-size:14.5px}
  .stop .rt .ds{font-size:12.5px;color:var(--ink-soft)}
  .stop.on .dot{border-color:var(--shu);background:var(--shu);box-shadow:0 0 0 4px rgba(178,55,38,.15)}
  .stop.on .rt .lbl{color:var(--shu)}
  .stop.done .dot{border-color:var(--ink);background:var(--ink)}

  /* Estilos base para el calendario */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
  .cell{aspect-ratio:1;border:1px solid var(--grid);background:var(--card);
    display:flex;align-items:center;justify-content:center;position:relative;border-radius:2px}
  .cell.pre{background:transparent;border-color:transparent}
  .cell.today{border:1.8px solid var(--ink)}
  
 /* Mejor legibilidad para las fechas */
  .cell .num{
    position:absolute; top:6px; left:8px; 
    font-size:18px; /* ¡Casi el doble de grande! */
    font-weight:800; /* Negrita al máximo */
    color:var(--ink); /* Negro sólido */
    font-family: var(--display-font); z-index: 3;
    line-height: 1; letter-spacing: -0.02em;
  }
    
  /* Niveles de recompensa (Sellos) */
  .cell .mini{font-family: var(--display-font);font-weight:800;color:var(--shu);line-height:1;}
  
  /* Nivel Básico (1-29) */
  .cell .mini.lvl-1{font-size:15px; transform:rotate(-8deg)}
  
  /* Nivel Intermedio (30-49) */
  .cell .mini.lvl-2{font-size:22px; transform:rotate(-5deg)}
  
  /* Nivel Avanzado (50-99) */
  .cell .mini.lvl-3{width: 75%; height: 75%; display: flex; align-items: center; justify-content: center;}
  .cell .mini.lvl-3 svg{width:100%; height:100%;}
  
  /* Nivel Épico (100+) */
  .cell .mini.lvl-4{width: 95%; height: 95%; display: flex; align-items: center; justify-content: center; transform:rotate(-12deg); z-index: 2;}
  .cell .mini.lvl-4 svg{width:100%; height:100%; filter:drop-shadow(2px 2px 0 rgba(143,42,29,.3))}

  .cal-cap{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-bottom:30px}

  /* Comportamiento dinámico del sello principal de la tarjeta */
  .seal.show.lvl-1 { font-size: 32px; color: var(--shu); font-weight: 800; transform: scale(1) rotate(-8deg); }
  .seal.show.lvl-2 { font-size: 46px; color: var(--shu); font-weight: 800; transform: scale(1) rotate(-5deg); }
  .seal.show.lvl-3 { transform: scale(1); }
  .seal.show.lvl-4 { transform: scale(1.15) rotate(-15deg); }
  .seal.show.lvl-4 svg { filter: drop-shadow(2px 2px 0 rgba(143,42,29,.3)); }

  .res{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .res a{font-size:12.5px;color:var(--ink);text-decoration:none;border:1.3px solid var(--line);
    border-radius:2px;padding:6px 11px;background:var(--card);transition:border-color .15s,transform .1s}
  .res a:hover{border-color:var(--ink);transform:translateY(-1px)}
  .res a span{color:var(--ink-soft)}

  details.panel{border:1.5px dashed var(--line);background:var(--card);padding:0 16px;margin-bottom:26px}
  details.panel summary{list-style:none;cursor:pointer;padding:14px 0;font-family: var(--display-font);
    font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:space-between}
  details.panel summary::-webkit-details-marker{display:none}
  details.panel summary .caret{transition:transform .2s}
  details.panel[open] summary .caret{transform:rotate(90deg)}
  .row{padding:14px 0;border-top:1px solid var(--line)}
  .row label{display:block;font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--ink)}
  .row .hint{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  textarea.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:8px;resize:vertical;
    min-height:54px;word-break:break-all;line-height:1.4}
  .btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--card);background:var(--ink);border:none;
    border-radius:2px;padding:8px 15px;cursor:pointer;margin-top:9px}
  .btn.alt{background:var(--paper);color:var(--ink);border:1.3px solid var(--ink)}
  .btn:active{transform:translateY(1px)}
  .status{font-size:12px;margin-top:8px;min-height:15px}
  .status.ok{color:var(--gold)} .status.err{color:var(--shu)}
  .soon{display:flex;align-items:center;justify-content:space-between;opacity:.6}
  .soon .st{font-weight:700;font-size:13.5px}
  .soon .tag{font-family: var(--display-font);font-size:10px;letter-spacing:.12em;border:1px solid var(--ink-faint);
    color:var(--ink-soft);border-radius:2px;padding:2px 7px;white-space:nowrap}
  .soon .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}

  footer{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;
    align-items:center;font-size:11.5px;color:var(--ink-faint);flex-wrap:wrap;gap:8px}
  .reset{background:none;border:none;color:var(--ink-faint);font:inherit;font-size:11.5px;cursor:pointer;
    text-decoration:underline;padding:0}
  .reset:hover{color:var(--shu)}
  .loading{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px}
  .saveerr{display:none;background:var(--shu);color:#fff;font-size:12px;padding:6px 12px;border-radius:2px;margin-bottom:16px}

  /* ---- drill overlay ---- */
  .drill{position:fixed;inset:0;z-index:60;overflow-y:auto;
    background:linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px, var(--paper);
    padding:calc(20px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));display:flex;flex-direction:column}
  .drill.hidden{display:none}
  .drill-inner{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
  .reading{position:fixed;inset:0;z-index:60;overflow-y:auto;background:linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 34px, var(--paper);padding:calc(20px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));display:flex;flex-direction:column}
  .reading.hidden{display:none}
  .reading-inner{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1}
  .r-count{font-size:13px;color:var(--ink-soft);font-weight:700}
  .read-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0;min-height:200px}
  .read-level{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--shu);font-weight:700;margin-bottom:16px}
  .read-jp{font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.35;color:var(--ink);max-width:92%}
  .read-romaji{font-size:16px;color:var(--ink-soft);margin-top:18px;font-style:italic}
  .read-trans{font-family: var(--display-font);font-weight:700;font-size:22px;color:var(--green);margin-top:10px}
  .romaji-toggle{align-self:center;margin-top:12px;font:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);background:none;border:1.2px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer}
  .reading-card{background:var(--card);border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--shadow);padding:18px 20px;margin-bottom:30px}
  .reading-card .rc-tag{font-family: var(--display-font);font-size:12px;color:var(--shu);font-weight:700}
  .rq-prompt{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0 14px;min-height:130px}
  .rq-kind{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px}
  .rq-jp{font-weight:700;font-size:clamp(30px,8vw,46px);line-height:1.3;color:var(--ink);max-width:92%}
  .rq-mean{font-family: var(--display-font);font-weight:700;font-size:clamp(22px,6vw,30px);color:var(--ink);max-width:92%}
  .d-spk.big{width:64px;height:64px;font-size:28px}
  .ropts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .ropt{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.6px solid var(--ink);border-radius:4px;padding:13px 14px;cursor:pointer;text-align:center;transition:transform .08s,background .12s}
  .ropt.jp{font-size:19px}
  .ropt.mincho{font-family:var(--display-font)}
  .teach-word .tw-rom{font-family:var(--display-font);font-weight:800;font-size:20px;color:var(--shu);margin-top:2px}
  .ropt:active{transform:scale(.99)}
  .ropt.correct{background:var(--green);border-color:var(--green);color:#fff}
  .ropt.bad{background:var(--bad-bg);border-color:var(--shu);color:var(--shu)}
  .ropt.dim{opacity:.45}
  .rq-fb{min-height:60px;margin-top:12px;text-align:center}
  .rq-msg{font-family: var(--display-font);font-weight:800;font-size:20px}
  .rq-msg.ok{color:var(--green)} .rq-msg.no{color:var(--shu)}
  .rq-ans{font-size:15px;color:var(--ink);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .rq-ans .mincho{font-size:19px}
  .rq-ans .rq-rom{color:var(--ink-soft);font-style:italic;font-size:13px}
  .rq-ans .mean{color:var(--ink-soft)}

  var SCHEMA=2, state=null, lastSaveOk=true;
  function pad(n){return String(n).padStart(2,"0");}

  function emptyState(){return {schema:SCHEMA,lang:detectLang(),font:"mincho",startDate:today(),days:{},exercises:{},aim:null,meta:{updatedAt:nowISO()}};}
  function migrate(s){
    if(!s||typeof s!=="object") return null;
    return {schema:SCHEMA,lang:s.lang,font:s.font||"mincho",theme:s.theme||"light",startDate:s.startDate||today(),aim:(s.aim||null),
      days:(s.days&&typeof s.days==="object")?s.days:{},
      exercises:(s.exercises&&typeof s.exercises==="object")?s.exercises:{},
      meta:(s.meta&&typeof s.meta==="object")?s.meta:{updatedAt:nowISO()}};
  }
  function mergeStates(a,b){
    a=migrate(a);b=migrate(b); if(!a)return b; if(!b)return a;

    var out={
      schema:SCHEMA,
      lang:a.lang||b.lang,
      font:a.font||b.font||"mincho", 
      theme:a.theme||b.theme||"light",
      aim:a.aim||b.aim||null,
      startDate:(daysBetween(a.startDate,b.startDate)<0?b.startDate:a.startDate),
      days:{},
      exercises:Object.assign({},a.exercises,b.exercises),
      meta:{updatedAt:(a.meta.updatedAt>b.meta.updatedAt?a.meta.updatedAt:b.meta.updatedAt)}
    };

    var keys={}; Object.keys(a.days).forEach(function(k){keys[k]=1;}); Object.keys(b.days).forEach(function(k){keys[k]=1;});
    Object.keys(keys).forEach(function(d){
      var da=a.days[d]||{},db=b.days[d]||{},m={},kk={};
      Object.keys(da).forEach(function(k){kk[k]=1;}); Object.keys(db).forEach(function(k){kk[k]=1;});
      Object.keys(kk).forEach(function(k){m[k]=!!(da[k]||db[k]);});
      out.days[d]=m;
    });
    return out;
  }
  // lazy-init the kana drill bucket inside exercises
  function ensureKana(){
    if(!state.exercises||typeof state.exercises!=="object") state.exercises={};
    var e=state.exercises;
    if(!e.kana) e.kana={box:{},kbox:{},daily:{},goal:30,scope:{hira:true,kata:false,hdak:false,kdak:false},learned:{},level:1,declined:false,kataIntroSeen:false};
    var k=e.kana;
    if(!k.box)k.box={}; if(!k.daily)k.daily={}; if(!k.goal)k.goal=30;
    if(!k.learned){k.learned={};for(var lr in k.box){k.learned["h:"+lr]=1;}} /* hiragana only */
    if(!k.scope)k.scope={hira:true,kata:false,hdak:false,kdak:false};
    /* migrate old scope {hira,kata,dakuten} -> per-script dakuten */
    if(typeof k.scope.hdak!=="boolean"){ var _od=!!k.scope.dakuten; k.scope.hdak=_od; k.scope.kdak=false; }
    if(k.scope.dakuten!==undefined) delete k.scope.dakuten;
    if(typeof k.scope.kdak!=="boolean")k.scope.kdak=false;
    if(!k.scope.hira&&!k.scope.kata)k.scope.hira=true;
    if(!k.level)k.level=k.scope.kata?3:(k.scope.hdak?2:1);
    if(k.level>4)k.level=4;
    /* one-time katakana split: give katakana its own box, and re-teach it
       (old builds auto-marked all katakana as "learned" sharing hiragana's SRS) */
    if(!k.kbox){
      k.kbox={};
      for(var lk in k.learned){ if(lk.indexOf("k:")===0) delete k.learned[lk]; }
      k.scope=levelScope(k.level);
      k.kataIntroSeen=false;
    }
    if(typeof k.kataIntroSeen!=="boolean")k.kataIntroSeen=false;
    if(typeof k.declined!=="boolean")k.declined=false;
    if(!k.leech||typeof k.leech!=="object")k.leech={};   /* lapse counter per char (re-teach leeches) */
    if(!k.due||typeof k.due!=="object")k.due={};         /* next-review date per char (cross-day SRS) */
    return k;
  }

  var CODEC_PREFIX="NIKKA1.";
  function b64e(str){return btoa(unescape(encodeURIComponent(str)));}
  function b64d(str){return decodeURIComponent(escape(atob(str)));}
  function encodeState(s){return CODEC_PREFIX+b64e(JSON.stringify(migrate(s)));}
  function decodeCode(code){
    code=(code||"").trim();
    if(code.indexOf(CODEC_PREFIX)!==0) throw new Error(t("That's not a Nikka backup code."));
    var obj=JSON.parse(b64d(code.slice(CODEC_PREFIX.length)));
    if(!obj||typeof obj!=="object"||typeof obj.days!=="object") throw new Error(t("The code looks corrupted or incomplete."));
    return migrate(obj);
  }

  function weekOf(startStr){var d=daysBetween(startStr,today());if(d<0)d=0;return Math.floor(d/7)+1;}
  function coreDone(day){return !!(day&&(day.practiced||day.anki||day.kana||day.words||day.phrases));}
  function computeStreak(days){var s=0,d=new Date(),t=today();
    if(!(days[t]&&coreDone(days[t])))d.setDate(d.getDate()-1);
    while(days[fmt(d)]&&coreDone(days[fmt(d)])){s++;d.setDate(d.getDate()-1);} return s;}
  function computeTotal(days){var n=0;for(var k in days)if(coreDone(days[k]))n++;return n;}
  function drillToday(){var k=ensureKana();return k.daily[today()]||{done:0,correct:0};}
  function kanaMastery(){
    var k=ensureKana(),pool=activePool(),total=pool.length,sum=0,solid=0,weak=[];
    pool.forEach(function(r){var b=Math.min(5,k.box[r]||0);sum+=b;if(b>=4)solid++;else weak.push({r:r,b:b});});
    weak.sort(function(a,b){return a.b-b.b;});
    return {pct:total?Math.round(sum/(total*5)*100):0,solid:solid,total:total,weak:weak};
  }

  /* =========================================================================
     7. KANA DRILL ENGINE
     ========================================================================= */
  var drillEl=document.getElementById("drill"), drillInner=document.getElementById("drillInner");
  var sess=null; // in-memory session: {done,correct,wrong,q,hitGoalShown}

  function activePool(){
    var k=ensureKana(),keys=BASE_KEYS.slice();
    if(k.scope.dakuten)keys=keys.concat(DAK_KEYS);
    return keys;
  }
  function activeScripts(){var k=ensureKana();var a=[];if(k.scope.hira)a.push("hira");if(k.scope.kata)a.push("kata");if(!a.length)a.push("hira");return a;}
  function pickTarget(pool,exclude){
    var k=ensureKana(),ent=pool.filter(function(r){return r!==exclude;});
    var w=ent.map(function(r){return Math.max(1,6-(k.box[r]||0));});
    var sum=w.reduce(function(a,b){return a+b;},0),x=Math.random()*sum;
    for(var i=0;i<ent.length;i++){x-=w[i];if(x<=0)return ent[i];}
    return ent[ent.length-1];
  }
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function sample(pool,n,exclude){
    var c=pool.filter(function(r){return r!==exclude;}); shuffle(c); return c.slice(0,n);
  }
  function setupQuiz(target,script){
    var dir=Math.random()<0.5?"toRomaji":"toKana",distr=distractors(target,script,8),opts;
    if(dir==="toRomaji"){ opts=shuffle(distr.concat([target])).map(function(r){return {label:r,romaji:r,rom:true};}); }
    else { opts=shuffle(distr.concat([target])).map(function(r){return {label:glyph(r,script),romaji:r,rom:false};}); }
    sess.mode="quiz"; sess.teach=null;
    sess.q={target:target,dir:dir,script:script,opts:opts,answered:false,picked:null};
    if(dir==="toKana") setTimeout(function(){speak(glyph(target,script));},250);
  }
  /* --- Learning pace: only introduce new characters as you master current ones ---
     A character joins the "active pool" when taught and leaves it (freeing a slot
     for a new one) once its SRS box reaches PROMOTE_AT. New characters appear only
     while the pool has room — so you drill a small set to fluency before more
     arrive, instead of being flooded at the start. Raise LEARN_POOL for a faster
     ramp (~15% of the ~46 base kana ≈ 7) or lower it (3–4) for a gentler pace. */
  var LEARN_POOL=5;   // max characters actively being learned at once
  var PROMOTE_AT=3;   // SRS box (0–5) at which a char graduates out of the pool
  function learningPoolCount(){
    var n=0; activePairs().forEach(function(p){
      if(isLearned(p.script,p.romaji) && (boxFor(p.script)[p.romaji]||0)<PROMOTE_AT) n++;
    }); return n;
  }

  /* --- Cross-day SRS: each learned character carries a next-review date --- */
  var SRS_IV=[0,1,2,4,7,14];   // days until next review, indexed by SRS box (0–5)
  function schedKey(sc,r){ return learnedKey(sc,r); }
  function getDue(sc,r){ var k=ensureKana(); return k.due[schedKey(sc,r)]||null; }
  function setDue(sc,r,box){ var k=ensureKana(),iv=SRS_IV[Math.min(5,Math.max(0,box))]; var d=new Date(); d.setDate(d.getDate()+iv); k.due[schedKey(sc,r)]=fmt(d); }
  function isDue(sc,r){ var d=getDue(sc,r); return !d || d<=today(); }   // unscheduled => treat as due
  function dueCount(){ var n=0; activePairs().forEach(function(p){ if(isLearned(p.script,p.romaji)&&isDue(p.script,p.romaji))n++; }); return n; }

  /* --- Leeches: a character that keeps lapsing gets re-taught (mnemonic again) --- */
  var LEECH_AT=3;              // lapses before the teach card comes back
  function bumpLeech(sc,r){ var k=ensureKana(),kk=schedKey(sc,r); k.leech[kk]=(k.leech[kk]||0)+1; }
  function clearLeech(sc,r){ var k=ensureKana(); delete k.leech[schedKey(sc,r)]; }
  function dueLeech(){ var k=ensureKana(),best=null,bv=LEECH_AT-1; activePairs().forEach(function(p){ if(!isLearned(p.script,p.romaji))return; var v=k.leech[schedKey(p.script,p.romaji)]||0; if(v>bv){bv=v;best=p;} }); return best; }

  /* --- Confusable-aware distractors: bias the wrong options toward look-alikes --- */
  var CONFUSE_GROUPS={
    hira:[["a","o"],["ki","sa","chi"],["nu","me"],["ne","re","wa"],["ru","ro"],["ha","ho","ma"],["ma","mo"],["i","ri"],["ta","na"],["su","mu"]],
    kata:[["shi","tsu","so","n"],["ku","ta","ke","ka"],["u","wa","ku","fu"],["no","me","nu"],["chi","te"],["ra","fu"],["ko","ro"],["a","ma"],["ha","ho"],["na","me"]]
  };
  var CONFUSE=(function(){ var out={hira:{},kata:{}}; ["hira","kata"].forEach(function(sc){ CONFUSE_GROUPS[sc].forEach(function(g){ g.forEach(function(r){ out[sc][r]=out[sc][r]||{}; g.forEach(function(o){ if(o!==r)out[sc][r][o]=1; }); }); }); }); return out; })();
  function distractors(target,script,n){
    var pool=poolForScript(script).filter(function(r){return r!==target && isLearned(script,r);});
    var conf=(CONFUSE[script]&&CONFUSE[script][target])?Object.keys(CONFUSE[script][target]):[];
    var confAvail=conf.filter(function(r){return pool.indexOf(r)>=0;}); shuffle(confAvail);
    var pick=confAvail.slice(0,Math.min(4,confAvail.length));
    var rest=pool.filter(function(r){return pick.indexOf(r)<0;}); shuffle(rest);
    return pick.concat(rest).slice(0,n);
  }

  function buildQuestion(){
    var k=ensureKana();
    if(sess.force){ var f=sess.force; sess.force=null; setupQuiz(f.romaji,f.script); return; }
    var relearn=dueLeech();
    if(relearn){ clearLeech(relearn.script,relearn.romaji); sess.mode="teach"; sess.teach={script:relearn.script,romaji:relearn.romaji,relearn:true}; sess.q=null;
      var rc=sess.teach; setTimeout(function(){ if(sess.mode==="teach")speak(glyph(rc.romaji,rc.script)); },320); return; }
    var pairs=activePairs(),unlearned=[],learnedG=[];
    pairs.forEach(function(p){ (isLearned(p.script,p.romaji)?learnedG:unlearned).push(p); });
    var canTeach=learningPoolCount()<LEARN_POOL;
    if(canTeach && !k.kataIntroSeen && unlearned.some(function(p){return p.script==="kata";})){
      sess.mode="teach"; sess.teach={intro:"kata"}; sess.q=null; return;
    }
    if(unlearned.length && canTeach){
      unlearned.sort(function(a,b){return teachOrder(a)-teachOrder(b);});
      var tier=teachOrder(unlearned[0]),tierItems=unlearned.filter(function(p){return teachOrder(p)===tier;});
      sess.mode="teach"; sess.teach=tierItems[Math.floor(Math.random()*tierItems.length)]; sess.q=null;
      var tc=sess.teach; setTimeout(function(){ if(sess.mode==="teach"&&!tc.intro)speak(glyph(tc.romaji,tc.script)); },320); return;
    }
    if(!learnedG.length){ sess.mode="teach"; sess.teach=(unlearned[0]||{script:"hira",romaji:BASE_KEYS[0]}); sess.q=null; return; }
    var lastT=sess.q?sess.q.target:null;
    var dueG=learnedG.filter(function(c){return isDue(c.script,c.romaji);}),reviewSet=dueG.length?dueG:learnedG;
    var cands=reviewSet.filter(function(c){return c.romaji!==lastT;}); if(!cands.length)cands=reviewSet;
    var w=cands.map(function(c){var b=boxFor(c.script);return Math.max(1,6-(b[c.romaji]||0));});
    var sum=w.reduce(function(a,b){return a+b;},0),x=Math.random()*sum,pick=cands[cands.length-1];
    for(var i=0;i<cands.length;i++){x-=w[i];if(x<=0){pick=cands[i];break;}}
    setupQuiz(pick.romaji,pick.script);
  }
  function speak(text){
    try{
      if(!window.speechSynthesis)return;
      var u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=.8;
      var vs=window.speechSynthesis.getVoices(); var jp=vs.filter(function(v){return /ja(-|_)?JP/i.test(v.lang);})[0];
      if(jp)u.voice=jp; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function startDrill(){
    ensureKana();
    sess={done:0,correct:0,wrong:0,q:null,hitGoalShown:false,newCount:0,maxNew:5,mode:"quiz",teach:null,force:null};
    buildQuestion();

  function answer(pickRomaji){
    var q=sess.q; if(!q||q.answered)return;
    q.answered=true; q.picked=pickRomaji;
    var k=ensureKana(),correct=pickRomaji===q.target;
    // SRS box update (per script + sound)
    var _b=boxFor(q.script),cur=_b[q.target]||0;
    _b[q.target]=correct?Math.min(5,cur+1):0;
    // cross-day scheduling + leech tracking
    setDue(q.script,q.target,_b[q.target]);
    if(correct){ if(_b[q.target]>=PROMOTE_AT)clearLeech(q.script,q.target); } else { bumpLeech(q.script,q.target); }
    // session + daily counters (goal counts attempts, right or wrong)
    sess.done++; if(correct)sess.correct++; else sess.wrong++;
    var t=today(); if(!k.daily[t])k.daily[t]={done:0,correct:0};
    k.daily[t].done++; if(correct)k.daily[t].correct++;
    // unified: any 15 reps (kana+reading) stamps the day
    if(stampDay()) sess.justHitGoal=true;
    sess.q.word=pickWordFor(q.target,q.script,"reward");
    Persistence.save(state);
    renderDrill();

  function gotIt(){
    var k=ensureKana(),c=sess.teach; if(!c)return;
    if(c.intro){ if(c.intro==="kata")k.kataIntroSeen=true; Persistence.save(state); buildQuestion(); renderDrill(); return; }
    if(c.relearn)clearLeech(c.script,c.romaji);
    k.learned[learnedKey(c.script,c.romaji)]=true; sess.newCount++;
    sess.force={romaji:c.romaji,script:c.script};
    Persistence.save(state); buildQuestion(); renderDrill();
  }

  function renderDrill(){
    var q=sess.q,k=ensureKana(),dt=k.daily[today()]||{done:0};
    var gpct=Math.min(100,dt.done),gtier=dayTier(dt.done);
    var h="";
    h+='<div class="d-sticky">';
    h+='<div class="d-head"><button class="d-close" id="dClose">✕ '+t("Close")+'</button>'+
       '<div class="d-stats">'+
       '<div class="d-stat"><div class="n">'+sess.done+'</div><div class="l">'+t("Done")+'</div></div>'+
       '<div class="d-stat wrong"><div class="n">'+sess.wrong+'</div><div class="l">'+t("Wrong")+'</div></div>'+
       '<div class="d-stat right"><div class="n">'+sess.correct+'</div><div class="l">'+t("Correct")+'</div></div>'+
       '</div></div>';
    h+='<div class="d-goal"><div class="lab"><span>'+t("Daily goal")+'</span><span>'+dt.done+(gtier>=0?' · '+t(TIER_LABEL[gtier]):'')+'</span></div>'+
       '<div class="prog milestones"><i style="width:'+gpct+'%"></i>'+milestoneTicks(dt.done,"drill")+'</div></div>';
    h+='</div>';

    if(sess.mode==="teach"){ h+=teachHTML(); drillInner.innerHTML=h; bindDrill(); return; }

    // prompt
    h+='<div class="d-prompt">';
    if(q.dir==="toRomaji"){
      h+='<div class="d-kind">'+t("Which sound is this?")+'</div><div class="d-glyph mincho">'+glyph(q.target,q.script)+'</div>';
    }else{
      h+='<div class="d-kind">'+t("Tap the")+' '+(q.script==="kata"?"katakana":"hiragana")+'</div><div class="d-romaji mincho">'+q.target+'</div>'+
         '<button class="d-spk" id="dSpk" aria-label="Play sound">🔊</button>';
    }
    h+='</div>';

    // options
    h+='<div class="d-grid">';
    q.opts.forEach(function(o,idx){
      var cls="opt"+(o.rom?" rom":"");
      if(q.answered){
        if(o.romaji===q.target)cls+=" correct";
        else if(o.romaji===q.picked)cls+=" bad";
        else cls+=" dim";
      }
      h+='<div class="'+cls+'" data-r="'+o.romaji+'">'+o.label+'</div>';
    });
    h+='</div>';

    // feedback
    h+='<div class="d-fb">';
    if(q.answered){
      var correct=q.picked===q.target;
      if(sess.justHitGoal){
        h+='<div class="d-celebrate"><div class="big">'+t("済 Streak saved!")+'</div><div class="sm">'+t("Today is stamped and your streak is safe. Keep going or close.")+'</div></div>';
      }else{
        var tgl=glyph(q.target,q.script==="kata"?"kata":"hira");
        h+='<div class="msg '+(correct?"ok":"no")+'">'+(correct?t("Correct!"):t("It was"))+' <span class="gl mincho">'+tgl+'</span> <span class="rm">'+q.target+'</span></div>';
        var word=sess.q.word;
        if(word) h+='<div class="reward-card"><div class="rw-word mincho">'+word.w+'</div><div class="rw-sub">'+word.r+' — <span class="mean">'+exMean(word)+'</span></div><button class="d-spk-word" id="dSpkWord" aria-label="Play word">🔊 <span>'+t("hear it")+'</span></button></div>';
      }
    }
    h+='</div>';

    // actions
    if(q.answered){
      h+='<div class="d-actions"><button class="d-next" id="dNext">'+t("Next →")+'</button></div>';
    }else{
      h+='<div class="d-actions"><button class="d-skip" id="dSkip">'+t("Skip")+'</button></div>';
    }
    drillInner.innerHTML=h;
    bindDrill();
  }

  /* Fold each game's bundled words into WORD_POOL (dedup by jp) so they
     become teachable/trackable exactly like the built-in word batches. */
  (function(){
    var seen={}; WORD_POOL.forEach(function(w){ seen[w.jp]=1; });
    GAMES.forEach(function(g){ (g.words||[]).forEach(function(o){
      if(!o||!o.jp||seen[o.jp])return; seen[o.jp]=1;
      WORD_POOL.push({jp:o.jp,romaji:o.romaji||'',en:(o.en||o.es||''),es:(o.es||o.en||''),emoji:(o.emoji||EMOJI[o.jp]||'')});
    }); });

  function gamePick(o){ return o?(getLang()==="es"?(o.es||o.en):(o.en||o.es)):""; }
  function isWordMastered(jp){ return (ensureWords().box[jp]||0) >= 4; }

  /* ---- Aim at a game: bias new-word introductions toward its core vocab ----
     Mixed, not exclusive (AIM_BIAS) and still capped by READ_LEARN_POOL, so it
     prioritises without flooding. state.aim holds one game id at a time. */
  var AIM_BIAS=0.8;
  function aimedGame(){ if(!state||!state.aim)return null; for(var i=0;i<GAMES.length;i++)if(GAMES[i].id===state.aim)return GAMES[i]; return null; }
  function aimWordSet(){ var g=aimedGame(); if(!g)return null; var m={}; (g.words||[]).forEach(function(w){m[w.jp]=1;}); return m; }
  function setAim(id){ state.aim=(state.aim===id)?null:id; Persistence.save(state); render(); }

  function gameReadiness(g){
    var need = g.kana || READY_KANA_DEFAULT;
    var hira = scriptMastery('hira').pct, kata = scriptMastery('kata').pct;
    var kanaOK = (hira >= (need.hira||0)) && (kata >= (need.kata||0));
    var core = (g.words||[]).map(function(w){ return w.jp; });
    var have = core.filter(isWordMastered).length;
    var cov  = core.length ? have/core.length : 1;
    var st;
    if(!kanaOK || cov < READY_DICT) st='locked';
    else if(cov < READY_COMFY)      st='dict';
    else                            st='comfy';
    return { state:st, cov:cov,
      kana:{ ok:kanaOK, hira:hira, kata:kata, needHira:(need.hira||0), needKata:(need.kata||0) },
      words:{ done:have, total:core.length } };
  }

  /* What to show under a game: verdict badge + the honest "te falta" line. */
  function gameVerdict(r){
    var es=getLang()==="es";
    if(r.state==='comfy') return { cls:'comfy', badge:(es?'¡Ya podés!':'Ready!'),
      sub:(es?'Menús cubiertos — jugá tranquilo':'Menus covered — go for it') };
    if(r.state==='dict'){ var falta=r.words.total-r.words.done;
      return { cls:'dict', badge:(es?'Jugable con diccionario':'Playable w/ dictionary'),
        sub:(es?('Te faltan '+falta+' palabra'+(falta===1?'':'s')+' para leerlo cómodo')
               :(falta+' word'+(falta===1?'':'s')+' from reading it comfortably')) }; }
    // locked: say WHY — kana first, then words
    if(!r.kana.ok){
      var parts=[];

    var nx=document.getElementById("rNext"); if(nx)nx.addEventListener("click",nextReadingQ);
    var sp=document.getElementById("rSpk"); if(sp)sp.addEventListener("click",function(){speak(rsess.pool[rsess.q.target].jp);});
    var spw=document.getElementById("rSpkW"); if(spw)spw.addEventListener("click",function(){speak(rsess.pool[rsess.q.target].jp);});
    var rem=document.getElementById("rEmoji"); if(rem)rem.addEventListener("click",toggleEmoji);
    var gt=document.getElementById("rGot"); if(gt)gt.addEventListener("click",teachWordDone);

  /* =========================================================================
     NEW EXERCISES — Armar la palabra (build) + Emparejar (match)
     Both live in CHARACTER practice (stages 1–3): the word is a scaffold to
     drill kana in context. They feed the SAME kana SRS as the drill (boxFor /
     setDue / leech) and count toward the daily goal (k.daily[td].done + stampDay).
     "Solo lo aprendido": build words are gated by wordReadable; match draws only
     from learned+active pairs. Tunable: BUILD_MAX_LEN, buildFullProb, MATCH_PAIRS.
     Both reuse the #reading overlay (readingEl/readingInner) — one runs at a time.
     ========================================================================= */
  var bsess=null, msess=null;
  function bstat(){ return wsess?rsess:bsess; }
  var BUILD_MAX_LEN=4, MATCH_PAIRS=5;

  /* shared: mirror the drill's SRS + daily semantics for one character event */
  function srsMark(script,romaji,correct){
    var b=boxFor(script),cur=b[romaji]||0;
    b[romaji]=correct?Math.min(5,cur+1):0;
    setDue(script,romaji,b[romaji]);
    if(correct){ if(b[romaji]>=PROMOTE_AT)clearLeech(script,romaji); } else { bumpLeech(script,romaji); }
  }
  function bumpDaily(correct){
    var k=ensureKana(),td=today();
    if(!k.daily[td])k.daily[td]={done:0,correct:0};
    k.daily[td].done++; if(correct)k.daily[td].correct++;
    stampDay();
  }
  function closeExtra(){ if(dsess){ dailyEnd(); return; } if(wsess){ wordsEnd(); return; } bsess=null; msess=null; readingEl.classList.add("hidden"); try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){} render(); }

  /* ---------- ARMAR LA PALABRA ---------- */
  function wordChars(jp){ var a=[]; for(var i=0;i<jp.length;i++){ var ch=jp.charAt(i); var e=KANA_REV[ch]; if(e)a.push({ch:ch,romaji:e.romaji,script:e.script}); } return a; }
  function buildWordPool(){
    return WORD_POOL.filter(function(w){
      if(!wordReadable(w.jp))return false;
      var real=0,ok=true;
      for(var i=0;i<w.jp.length;i++){ var ch=w.jp.charAt(i);
        if(SMALL_KANA.indexOf(ch)>=0){ ok=false; break; }   /* v1: skip っ/ゃ/ー etc. so 1 tile = 1 testable kana */
        if(!KANA_REV[ch]){ ok=false; break; }
        real++;
      }
      return ok && real>=2 && real<=BUILD_MAX_LEN;
    });
  }
  /* how much to lean toward full-word building vs single-gap cloze:
     rises with how many kana are learned and how solid they are — "se va adaptando". */
  function buildFullProb(){
    var pairs=activePairs().filter(function(p){return isLearned(p.script,p.romaji);});
    if(!pairs.length)return 0.15;
    var sum=0; pairs.forEach(function(p){ sum+=Math.min(5,boxFor(p.script)[p.romaji]||0); });
    var avg=sum/pairs.length, learnedFactor=Math.min(1,pairs.length/20);
    return Math.max(0.15,Math.min(0.8,(avg/5)*0.55+learnedFactor*0.3));
  }
  function buildNextQ(preferJp){
    var pool=buildWordPool();
    if(wsess){ var _sn=ensureWords().seen||{}; pool=pool.filter(function(w){return _sn[w.jp];}); }
    if(!pool.length){ bsess.q=null; return; }
    var w=null; if(preferJp){ for(var _pi=0;_pi<pool.length;_pi++){ if(pool[_pi].jp===preferJp){ w=pool[_pi]; break; } } } if(!w) w=pool[Math.floor(Math.random()*pool.length)];
    var chars=wordChars(w.jp);
    if(Math.random()<buildFullProb()){
      var uniq={}; chars.forEach(function(c){uniq[c.ch]=1;});
      var decoys=[];
      chars.forEach(function(c){ distractors(c.romaji,c.script,2).forEach(function(dr){ var g=glyph(dr,c.script); if(!uniq[g]&&decoys.indexOf(g)<0)decoys.push(g); }); });
      shuffle(decoys); decoys=decoys.slice(0,Math.max(2,Math.min(4,8-Object.keys(uniq).length)));
      var tiles=shuffle(Object.keys(uniq).concat(decoys));
      bsess.q={mode:"full",word:w,chars:chars,tiles:tiles,slot:0,placed:[],attempted:{},badTile:"",done:false};
    }else{
      var bi=Math.floor(Math.random()*chars.length),tgt=chars[bi];
      var seen={},opts=[{romaji:tgt.romaji,ch:tgt.ch}]; seen[tgt.romaji]=1;
      distractors(tgt.romaji,tgt.script,5).forEach(function(r){ if(!seen[r]){seen[r]=1;opts.push({romaji:r,ch:glyph(r,tgt.script)});} });
      shuffle(opts);
      bsess.q={mode:"cloze",word:w,chars:chars,blank:bi,tgt:tgt,opts:opts,done:false,picked:null,correct:false};
    }
  }
  function startBuild(){ bsess={done:0,correct:0,wrong:0,q:null}; buildNextQ(); readingEl.classList.remove("hidden"); renderBuild(); }
  function buildAnswerCloze(rom){
    var q=bsess.q; if(!q||q.done||q.mode!=="cloze")return;
    var correct=rom===q.tgt.romaji;
    q.done=true; q.picked=rom; q.correct=correct;
    srsMark(q.tgt.script,q.tgt.romaji,correct); bumpDaily(correct); if(correct)markWordKnown(q.word.jp);
    var _st=bstat(); _st.done++; if(correct)_st.correct++; else _st.wrong++;
    speak(q.word.jp); Persistence.save(state); renderBuild();
  }
  function buildTapTile(gl){
    var q=bsess.q; if(!q||q.done||q.mode!=="full")return;
    var slot=q.slot, need=q.chars[slot], firstTry=!q.attempted[slot];
    if(gl===need.ch){
      if(firstTry){ q.attempted[slot]=1; srsMark(need.script,need.romaji,true); bumpDaily(true); var _st=bstat(); _st.done++; _st.correct++; }
      q.placed[slot]=gl; q.badTile=""; q.slot++;
      if(q.slot>=q.chars.length){ q.done=true; speak(q.word.jp); markWordKnown(q.word.jp); }
      Persistence.save(state); renderBuild();
    }else{
      if(firstTry){ q.attempted[slot]=1; srsMark(need.script,need.romaji,false); bumpDaily(false); var _st=bstat(); _st.done++; _st.wrong++; Persistence.save(state); }
      q.badTile=gl; renderBuild();
    }
  }
  function extraGoalHTML(){
    var k=ensureKana(),dt=k.daily[today()]||{done:0},gpct=Math.min(100,dt.done),gtier=dayTier(dt.done);
    return '<div class="d-goal"><div class="lab"><span>'+t("Daily goal")+'</span><span>'+dt.done+(gtier>=0?' · '+t(TIER_LABEL[gtier]):'')+'</span></div>'+
      '<div class="prog milestones"><i style="width:'+gpct+'%"></i>'+milestoneTicks(dt.done,"drill")+'</div></div>';
  }
  function buildHeaderHTML(s){
    return '<div class="d-sticky"><div class="d-head"><button class="d-close" id="xClose">✕ '+t("Close")+'</button>'+
      '<div class="d-stats">'+
      '<div class="d-stat"><div class="n">'+s.done+'</div><div class="l">'+t("Done")+'</div></div>'+
      '<div class="d-stat wrong"><div class="n">'+s.wrong+'</div><div class="l">'+t("Wrong")+'</div></div>'+
      '<div class="d-stat right"><div class="n">'+s.correct+'</div><div class="l">'+t("Correct")+'</div></div>'+
      '</div></div>'+(wsess?wordsGoalHTML():extraGoalHTML())+'</div>';
  }
  function renderBuild(){
    var q=bsess.q, h=buildHeaderHTML(bstat());
    if(!q){ h+='<div class="rq-prompt"><div class="rq-kind">'+t("Build the word")+'</div><div class="rq-mean">'+t("Learn a few characters first.")+'</div></div>'; readingInner.innerHTML=h; bindBuild(); return; }
    var es=getLang()==="es", w=q.word, mean=(es?w.es:w.en)||w.en||"", em=(getEmoji()&&w.emoji)?(' '+w.emoji):"", showRom=state.buildRomaji!==false;
    h+='<div class="rq-prompt">';
    h+='<div class="rq-kind">'+t(q.mode==="cloze"?"Fill the gap":"Spell it out")+'</div>';
    h+='<div class="rq-mean">'+mean+em+'</div>';
    h+='<div class="bw-rom'+(showRom?"":" hide")+'">'+w.romaji+'</div>';
    h+='<button class="d-spk" id="xSpk" aria-label="Play">🔊</button>';
    h+='</div>';
    h+='<div class="bw-slots mincho">';
    q.chars.forEach(function(c,i){
      if(q.mode==="cloze"){
        if(i===q.blank){ h+='<span class="bw-slot blank'+(q.done?(q.correct?" correct":" bad"):" active")+'">'+(q.done?c.ch:"＿")+'</span>'; }
        else h+='<span class="bw-slot fixed">'+c.ch+'</span>';
      }else{
        if(i<q.slot){ var okc=(q.placed[i]===c.ch); h+='<span class="bw-slot filled'+(okc?"":" corr")+'">'+c.ch+'</span>'; }
        else if(i===q.slot && !q.done) h+='<span class="bw-slot active">＿</span>';
        else h+='<span class="bw-slot">＿</span>';
      }
    });
    h+='</div>';
    h+='<div class="d-grid bw-grid">';
    if(q.mode==="cloze"){
      q.opts.forEach(function(o){
        var cls="opt mincho";
        if(q.done){ if(o.romaji===q.tgt.romaji)cls+=" correct"; else if(o.romaji===q.picked)cls+=" bad"; else cls+=" dim"; }
        h+='<button class="'+cls+'" data-rom="'+o.romaji+'">'+o.ch+'</button>';
      });
    }else{
      q.tiles.forEach(function(g){ h+='<button class="opt mincho'+(q.badTile===g?" bad":"")+'" data-tile="'+g+'">'+g+'</button>'; });
    }
    h+='</div>';
    h+='<button class="bw-toggle" id="xRom">'+t(showRom?"Hide romaji":"Show romaji")+'</button>';
    if(q.done){
      h+='<div class="rq-fb"><div class="rq-ans"><span class="mincho">'+w.jp+'</span> <span class="rq-rom">'+w.romaji+'</span> — <span class="mean">'+mean+'</span></div></div>';
      h+='<div class="d-actions"><button class="d-next" id="xNext">'+t("Next →")+'</button></div>';
    }
    readingInner.innerHTML=h; bindBuild();
  }
  function bindBuild(){
    var c=document.getElementById("xClose"); if(c)c.addEventListener("click",closeExtra);
    var sp=document.getElementById("xSpk"); if(sp)sp.addEventListener("click",function(){ if(bsess&&bsess.q)speak(bsess.q.word.jp); });
    var rt=document.getElementById("xRom"); if(rt)rt.addEventListener("click",function(){ state.buildRomaji=!(state.buildRomaji!==false); Persistence.save(state); renderBuild(); });
    var nx=document.getElementById("xNext"); if(nx)nx.addEventListener("click",function(){ if(dsess){ dailyAfterUnit(); } else if(wsess){ wordsAfterUnit(); } else { buildNextQ(); renderBuild(); } });
    if(bsess&&bsess.q&&!bsess.q.done){
      if(bsess.q.mode==="cloze") readingInner.querySelectorAll(".opt[data-rom]").forEach(function(o){ o.addEventListener("click",function(){ buildAnswerCloze(o.getAttribute("data-rom")); }); });
      else readingInner.querySelectorAll(".opt[data-tile]").forEach(function(o){ o.addEventListener("click",function(){ buildTapTile(o.getAttribute("data-tile")); }); });
    }
  }

  /* ---------- EMPAREJAR ---------- */
  function matchPool(){ return activePairs().filter(function(p){return isLearned(p.script,p.romaji);}); }
  function matchDeal(){
    var pool=matchPool(); if(pool.length<3){ msess.left=null; msess.right=null; return; }
    var scored=pool.map(function(p){ var b=Math.min(5,boxFor(p.script)[p.romaji]||0); return {p:p,w:Math.max(1,6-b)+(isDue(p.script,p.romaji)?3:0)}; });
    var N=Math.min(MATCH_PAIRS,pool.length),chosen=[],bag=scored.slice(),usedRom={};
    while(chosen.length<N && bag.length){
      var sum=bag.reduce(function(a,x){return a+x.w;},0),x=Math.random()*sum,idx=0;
      for(var i=0;i<bag.length;i++){ x-=bag[i].w; if(x<=0){idx=i;break;} }
      var cand=bag[idx].p; bag.splice(idx,1);
      if(usedRom[cand.romaji])continue;            /* one sound per board: や/ヤ, へ/ヘ can't both show */
      usedRom[cand.romaji]=1; chosen.push(cand);
    }
    var left=chosen.map(function(p,i){return {id:i,type:"g",p:p,glyph:glyph(p.romaji,p.script),done:false};});
    var right=chosen.map(function(p,i){return {id:i,type:"r",p:p,label:p.romaji,done:false};});
    msess.left=shuffle(left); msess.right=shuffle(right); msess.sel=null; msess.bad=null; msess.remain=chosen.length;
  }
  function startMatch(){ msess={done:0,boards:0,wrong:0}; matchDeal(); readingEl.classList.remove("hidden"); renderMatch(); }
  function matchTap(col,idx){
    if(!msess)return;
    var arr=col==="l"?msess.left:msess.right, card=arr&&arr[idx];
    if(!card||card.done)return;
    var sel=msess.sel;
    if(!sel){ msess.sel={col:col,idx:idx,id:card.id}; msess.bad=null; renderMatch(); return; }
    if(sel.col===col){ msess.sel=(sel.idx===idx)?null:{col:col,idx:idx,id:card.id}; msess.bad=null; renderMatch(); return; }
    if(sel.id===card.id){
      arr[idx].done=true; (sel.col==="l"?msess.left:msess.right)[sel.idx].done=true;
      srsMark(card.p.script,card.p.romaji,true); bumpDaily(true);
      if(state.matchSpeak!==false)speak(glyph(card.p.romaji,card.p.script));
      msess.done++; msess.remain--; msess.sel=null; msess.bad=null; Persistence.save(state);
      if(msess.remain<=0){ msess.boards++; renderMatch(); setTimeout(function(){ if(dsess){ if(msess)dailyAfterUnit(); } else if(msess){ matchDeal(); renderMatch(); } },700); return; }
      renderMatch();
    }else{
      msess.wrong=(msess.wrong||0)+1;
      msess.bad=[{col:sel.col,idx:sel.idx},{col:col,idx:idx}]; msess.sel=null; renderMatch();
      setTimeout(function(){ if(msess){ msess.bad=null; renderMatch(); } },550);
    }
  }
  function matchTileHTML(col,idx,card){
    var lab=card.type==="g"?card.glyph:card.label, base="opt mt-tile"+(card.type==="g"?" mincho":" rom");
    if(card.done)return '<button class="'+base+' done" disabled>'+lab+'</button>';
    var sel=msess.sel&&msess.sel.col===col&&msess.sel.idx===idx;
    var bad=msess.bad&&msess.bad.some(function(b){return b.col===col&&b.idx===idx;});
    return '<button class="'+base+(sel?" sel":"")+(bad?" bad":"")+'" data-col="'+col+'" data-idx="'+idx+'">'+lab+'</button>';
  }
  function renderMatch(){
    var mWrong=msess.wrong||0, mDone=msess.done+mWrong;
    var h='<div class="d-sticky"><div class="d-head"><button class="d-close" id="mClose">✕ '+t("Close")+'</button>'+
      '<div class="d-stats">'+
      '<div class="d-stat"><div class="n">'+mDone+'</div><div class="l">'+t("Done")+'</div></div>'+
      '<div class="d-stat wrong"><div class="n">'+mWrong+'</div><div class="l">'+t("Wrong")+'</div></div>'+
      '<div class="d-stat right"><div class="n">'+msess.done+'</div><div class="l">'+t("Correct")+'</div></div>'+
      '</div></div>'+
      '<div class="mt-sub">'+msess.done+' '+t("Pairs")+' · '+msess.boards+' '+t("Boards")+'</div>'+
      extraGoalHTML()+'</div>';
    if(!msess.left){ h+='<div class="rq-prompt"><div class="rq-kind">'+t("Match")+'</div><div class="rq-mean">'+t("Learn a few characters first.")+'</div></div>'; readingInner.innerHTML=h; bindMatch(); return; }
    h+='<div class="rq-prompt" style="padding:4px 0 2px"><div class="rq-kind">'+t("Tap the pairs")+'</div></div>';
    h+='<div class="mt-board"><div class="mt-col">';
    msess.left.forEach(function(card,idx){ h+=matchTileHTML("l",idx,card); });
    h+='</div><div class="mt-col">';
    msess.right.forEach(function(card,idx){ h+=matchTileHTML("r",idx,card); });
    h+='</div></div>';
    h+='<button class="bw-toggle" id="mSnd">'+(state.matchSpeak!==false?"☑":"☐")+' '+t("🔊 on tap")+'</button>';
    readingInner.innerHTML=h; bindMatch();
  }
  function bindMatch(){
    var c=document.getElementById("mClose"); if(c)c.addEventListener("click",closeExtra);
    var s=document.getElementById("mSnd"); if(s)s.addEventListener("click",function(){ state.matchSpeak=(state.matchSpeak===false); Persistence.save(state); renderMatch(); });
    readingInner.querySelectorAll(".mt-tile:not([disabled])").forEach(function(o){ o.addEventListener("click",function(){ matchTap(o.getAttribute("data-col"),parseInt(o.getAttribute("data-idx"),10)); }); });
  }

  /* =========================================================================
     PRACTICA DIARIA - dynamic director. Interleaves the REAL kana drill
     (teaching + review), Emparejar and Armar la palabra in one session.
     Exercises phase in by practiced-days; proportions shift by mastery.
     Each exercise stays untouched; a tiny "unit done -> next" seam hands
     control back here (nextQuestion / build Next / match board-clear).
     Tunables: INTRO_DAYS, the 70/15/15 base + ramp, masteryLevel().
     ========================================================================= */
  var dsess=null;
  var INTRO_DAYS={match:1, build:3};   // practiced days before each exercise joins the mix
  function practicedDays(){ var n=0,d=state.days||{}; for(var kk in d){ if(coreDone(d[kk]))n++; } return n; }
  function masteryLevel(){
    var pairs=activePairs().filter(function(p){return isLearned(p.script,p.romaji);}), n=pairs.length;
    if(!n)return 0;
    var sum=0; pairs.forEach(function(p){ sum+=Math.min(5,boxFor(p.script)[p.romaji]||0); });
    var solid=(sum/n)/5, count=Math.max(0,Math.min(1,(n-15)/(100-15)));
    return Math.max(0,Math.min(1,0.5*count+0.5*solid));      // 0..1: blends how many + how solid
  }
  function dailyMix(){
    var days=practicedDays(), m=masteryLevel();
    var learnedN=activePairs().filter(function(p){return isLearned(p.script,p.romaji);}).length;
    var canMatch = days>=INTRO_DAYS.match && learnedN>=8;
    var canBuild = canMatch && days>=INTRO_DAYS.build && buildWordPool().length>=8;
    var drill,match,build;
    if(canBuild){ build=15+55*m; drill=70-55*m; match=15; }   // steady 70/15/15 -> mastery 15/15/70
    else if(canMatch){ drill=80; match=20; build=0; }         // just introduced pairs
    else { drill=100; match=0; build=0; }                     // day 1: only characters
    var tot=drill+match+build;
    return {drill:drill/tot, match:match/tot, build:build/tot, canMatch:canMatch, canBuild:canBuild, m:m, days:days, learnedN:learnedN};
  }
  function pickDailyType(mix){ mix=mix||dailyMix(); var r=Math.random();
    if(r<mix.drill)return "drill"; if(r<mix.drill+mix.match)return "match"; return "build"; }
  function startDaily(){ ensureKana(); dsess={active:true,cur:null}; dailyNextUnit(); }
  function dailyNextUnit(){
    if(!dsess)return;
    var mix=dailyMix(), type=pickDailyType(mix);
    if(type==="match" && !mix.canMatch)type="drill";
    if(type==="build" && !mix.canBuild)type="drill";
    dsess.cur=type;
    if(type==="drill"){
      readingEl.classList.add("hidden");
      if(!sess) sess={done:0,correct:0,wrong:0,q:null,hitGoalShown:false,newCount:0,maxNew:5,mode:"quiz",teach:null,force:null};
      buildQuestion(); drillEl.classList.remove("hidden"); renderDrill();
    }else if(type==="match"){
      drillEl.classList.add("hidden");
      if(!msess) msess={done:0,boards:0,wrong:0};
      matchDeal(); readingEl.classList.remove("hidden"); renderMatch();
    }else{
      drillEl.classList.add("hidden");
      if(!bsess) bsess={done:0,correct:0,wrong:0,q:null};
      buildNextQ(); readingEl.classList.remove("hidden"); renderBuild();
    }
  }
  function dailyAfterUnit(){ if(!dsess)return; dailyNextUnit(); }
  function dailyEnd(){ dsess=null; sess=null; bsess=null; msess=null;
    drillEl.classList.add("hidden"); readingEl.classList.add("hidden");
    try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){} render(); }

  function startFocusDrill(romaji, script) {
    var k = ensureKana();
    // Reiniciamos la sesión
    sess = {
      done: 0, correct: 0, wrong: 0, q: null, hitGoalShown: false, 
      newCount: 0, maxNew: 5, mode: "teach", teach: null, force: null
    };

    // Forzamos la sesión a enseñar este carácter específico en su alfabeto
    sess.teach = { script: script, romaji: romaji };
    
    // Mostramos la pantalla de práctica
    drillEl.classList.remove("hidden");
    renderDrill();
    
    // Reproducimos el sonido si está disponible
    setTimeout(function(){ 
      if(sess.mode==="teach" && !sess.teach.intro) speak(glyph(romaji, script)); 
    }, 320);
  }

  function bindMain(){
    app.querySelectorAll("[data-fn]").forEach(function(b){var fn=b.getAttribute("data-fn");b.addEventListener("click",function(){if(fn==="startDrill")startDrill();else if(fn==="startDaily")startDaily();else if(fn==="startWords")startWords();else if(fn==="startPhrases")startPhrases();else if(fn==="startBuild")startBuild();else if(fn==="startMatch")startMatch();});});

    var wd=app.querySelector(".wotd[data-say]"); if(wd)wd.addEventListener("click",function(){speak(wd.getAttribute("data-say"));});
    app.querySelectorAll("[data-aim]").forEach(function(b){ b.addEventListener("click",function(){ setAim(b.getAttribute("data-aim")); }); });

    // Conectar los botones de "Enfócate en" para lanzar el entrenamiento
    app.querySelectorAll(".focus-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        startFocusDrill(btn.getAttribute("data-r"), btn.getAttribute("data-s"));
      });
    });

    app.querySelectorAll(".box").forEach(function(b){
      b.addEventListener("click",function(){toggle(b.getAttribute("data-id"));});
      b.addEventListener("keydown",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle(b.getAttribute("data-id"));}});
    });
    var sd=document.getElementById("startDrill"); if(sd)sd.addEventListener("click",startDrill);
    var stn=document.getElementById("stNext"); if(stn)stn.addEventListener("click",advanceStage);
    var stb=document.getElementById("stBack"); if(stb)stb.addEventListener("click",retreatStage);
    app.querySelectorAll(".seg").forEach(function(s){
      s.addEventListener("click",function(){setSeg(s.getAttribute("data-seg"),parseInt(s.getAttribute("data-val"),10));});
    });
    app.querySelectorAll(".lseg").forEach(function(b){b.addEventListener("click",function(){setLang(b.getAttribute("data-lang"));});});

    app.querySelectorAll(".fseg").forEach(function(b){b.addEventListener("click",function(){setFont(b.getAttribute("data-font"));});});

    app.querySelectorAll(".tseg").forEach(function(b){b.addEventListener("click",function(){setTheme(b.getAttribute("data-theme"));});});

    var lu=document.getElementById("lvUp"); if(lu)lu.addEventListener("click",levelUp);
    var ln=document.getElementById("lvNo"); if(ln)ln.addEventListener("click",declineLevel);
    var si=document.getElementById("scriptInfo");
    if(si)si.addEventListener("click",function(){var hp=document.getElementById("scriptHelp");if(hp)hp.hidden=!hp.hidden;});
    var kob=document.getElementById("kanaOptsBtn");
    if(kob)kob.addEventListener("click",function(e){e.stopPropagation();var p=document.getElementById("kanaOptsPanel");if(p){p.hidden=!p.hidden;kob.setAttribute("aria-expanded",p.hidden?"false":"true");}});
    var kex=app.querySelector(".ex-kana");
    if(kex)kex.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target===kex){e.preventDefault();startDrill();}});
    var cb=document.getElementById("copyBtn"); if(cb)cb.addEventListener("click",function(){copyText(encodeState(state),document.getElementById("copyStatus"));});
    var ib=document.getElementById("importBtn"); if(ib)ib.addEventListener("click",function(){
      var st=document.getElementById("importStatus"),raw=document.getElementById("importBox").value;
      try{state=mergeStates(state,decodeCode(raw));Persistence.save(state);render();flash(document.getElementById("importStatus"),t("Imported and merged ✓"),"ok");}
      catch(err){flash(st,err.message||t("Couldn't read that code."),"err");}
    });
  }
  function bindDrill(){
    var c=document.getElementById("dClose"); if(c)c.addEventListener("click",closeDrill);
    var tg=document.getElementById("tGot"); if(tg)tg.addEventListener("click",gotIt);
    var tsp=document.getElementById("tSpk"); if(tsp)tsp.addEventListener("click",function(){ if(sess.teach)speak(glyph(sess.teach.romaji,sess.teach.script)); });
    var tspb=document.getElementById("tSpkBase"); if(tspb)tspb.addEventListener("click",function(){ if(sess.teach){var dv=DEVOICE[sess.teach.romaji]; if(dv)speak(glyph(dv[0],sess.teach.script));} });
    var n=document.getElementById("dNext"); if(n)n.addEventListener("click",nextQuestion);
    var s=document.getElementById("dSkip"); if(s)s.addEventListener("click",function(){buildQuestion();renderDrill();});
    var sp=document.getElementById("dSpk"); if(sp)sp.addEventListener("click",function(){speak(glyph(sess.q.target,sess.q.script));});
    var spw=document.getElementById("dSpkWord"); if(spw)spw.addEventListener("click",function(){ if(sess.q.word)speak(sess.q.word.w); });
    if(sess.q && !sess.q.answered){
      drillInner.querySelectorAll(".opt").forEach(function(o){
        o.addEventListener("click",function(){answer(o.getAttribute("data-r"));});
      });
    }
  }

  document.getElementById("resetBtn").addEventListener("click",function(){
    if(!confirm(t("Reset everything — streak, days, drill progress, and today's checklist? This can't be undone."))) return;
    state=emptyState();Persistence.save(state);render();
  });

  (function boot(){
    var loaded=Persistence.boot();
    state=loaded||emptyState();
    if(!loaded)Persistence.save(state);
    if(!state.lang){state.lang=detectLang();Persistence.save(state);}
    try{seedKnownFromBuild();}catch(e){}
    render();
  })();
})();
</script>
